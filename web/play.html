<title>Heartwood · Player</title>

<!-- Loaded without blocking: with no internet at the venue the page still works in system fonts. -->

<style>
/* The phone page for Heartwood, in the Sleeping Forest toon style (docs/plan/toon-art/build-contract.md).
   Self-contained on purpose: style.css belongs to the Keeper's full-screen board, so nothing here depends on it.
   Toon rules: thick coloured outlines (a darker shade of the fill, never black), a light layer on top, one
   gloss, chunky buttons with a pressed lip, springy overshoot. Lilita One for titles and numbers, Nunito to read. */
:root {
  --p-ink: #3b2414; --p-ink2: #725239; --p-paper: #fdf5df; --p-paper2: #f5e4bd; --p-well: #f0ddb4; --p-well-line: #d7ba82;
  --p-wood: #8a5a2c; --p-wood-d: #5a3418; --p-cream: #fff6e0;
  --p-leaf: #5cb84a; --p-leaf-d: #2c6a20; --p-gold: #f2b32e; --p-gold-d: #8a5418; --p-berry: #e8344f; --p-water: #3aa6f0;
  --p-night: #2c2246; --p-night-d: #160f29;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --toon: 'Lilita One', 'Nunito', system-ui, sans-serif;
  --read: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body.wtp { margin: 0; min-height: 100vh; color: var(--p-cream); font: 16px/1.42 var(--read); overflow-x: clip;
  background: #0d1b14 radial-gradient(130% 70% at 50% -12%, #2e5a3c 0%, #1a3828 42%, #0d1b14 100%) no-repeat; }
.wtp svg.art { overflow: visible; display: inline-block; vertical-align: middle; flex: none; }
.wtp a { color: #1f7a48; font-weight: 800; }
.wtp small { color: inherit; font-size: .84em; }
.wtp [hidden] { display: none !important; }

/* The dusk sky behind everything: fireflies and a dark tree line. */
.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wt { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; padding: 14px 14px calc(70px + env(safe-area-inset-bottom)); }

/* ---- toon panel (parchment in a wooden outline) and its sign ---- */
.tp { position: relative; color: var(--p-ink); background: linear-gradient(180deg, var(--p-paper) 0%, var(--p-paper2) 100%);
  border: 3px solid var(--kd, var(--p-wood)); border-radius: 22px; padding: 24px 16px 16px; margin: 0 0 30px;
  box-shadow: 0 6px 0 var(--kd, var(--p-wood-d)), 0 14px 24px rgba(0,0,0,.38), inset 0 2px 0 #fff, inset 0 -4px 0 rgba(138,90,44,.1); }
.tp.nosign { padding-top: 16px; }
.tp.pop { animation: pop .5s var(--spring); }
.tp.hot { border-color: #d68a12; box-shadow: 0 6px 0 #8a5418, 0 0 0 4px rgba(255,214,90,.5), 0 14px 26px rgba(0,0,0,.4), inset 0 2px 0 #fff; }
/* Your moment: a golden halo that breathes (opacity only, cheap on old phones). */
.tp.hot::after { content: ''; position: absolute; inset: -10px -10px -14px; border-radius: 30px; pointer-events: none;
  box-shadow: 0 0 0 4px rgba(255,214,90,.8), 0 0 24px 6px rgba(255,200,70,.55); animation: hot 1.9s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(.93); opacity: .4; } 100% { transform: none; opacity: 1; } }
@keyframes hot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.sign { position: absolute; top: -17px; left: 14px; max-width: calc(100% - 28px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: 17px/1 var(--toon); letter-spacing: .03em; color: #fff; padding: 7px 13px 6px; border-radius: 13px;
  background: linear-gradient(var(--sl, #7fcf5c), var(--sc, #4fa83a)); border: 3px solid var(--sd, #2c6a20);
  box-shadow: 0 3px 0 var(--sd, #2c6a20), inset 0 2px 0 rgba(255,255,255,.45); text-shadow: 0 2px 0 var(--sd, #2c6a20); }
.tp h2, .tp h3 { font-family: var(--toon); font-weight: 400; color: #4a2a17; letter-spacing: .01em; margin: 0 0 .35em; }
.tp h2 { font-size: 26px; line-height: 1.1; }
.tp h3 { font-size: 19px; }
.lead { font: 900 20px/1.28 var(--read); margin: 0 0 .35em; color: #3b2414; }
.small { font-size: 14.5px; color: var(--p-ink2); margin: .45em 0; }
.center { text-align: center; }
.tp p { margin: .4em 0; }

/* ---- chunky toon buttons with a pressed lip ---- */
.tb { --b1: #8fdc62; --b2: #4fa83a; --bd: #2c6a20; appearance: none; -webkit-appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; margin: 0; padding: 10px 18px; font: 21px/1.1 var(--toon); letter-spacing: .02em; color: #fff; text-align: center;
  text-shadow: 0 2px 0 var(--bd); background: linear-gradient(var(--b1), var(--b2)); border: 3px solid var(--bd); border-radius: 18px;
  box-shadow: 0 5px 0 var(--bd), 0 9px 14px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.45); cursor: pointer;
  transition: transform .09s, box-shadow .09s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.tb:active:not(:disabled), .tb.press { transform: translateY(4px); box-shadow: 0 1px 0 var(--bd), 0 3px 6px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.35); }
.tb:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.tb.gold { --b1: #ffdc6a; --b2: #f2a62a; --bd: #8a5418; }
.tb.cream { --b1: #fffaf0; --b2: #efdcb4; --bd: #8a5a2c; color: #5a3418; text-shadow: none; }
.tb.red { --b1: #f0736a; --b2: #cc3b34; --bd: #7a1f1a; }
.tb.night { --b1: #6a5596; --b2: #4a3a72; --bd: #1f1638; }
.tb:disabled { --b1: #e2dccd; --b2: #c7bea9; --bd: #8f8572; color: #faf6ec; text-shadow: 0 2px 0 #8f8572; cursor: default; }
.tb.block { display: flex; width: 100%; margin: 10px 0 0; }
.tb.huge { min-height: 64px; font-size: 25px; border-radius: 20px; }
.tb.sm { min-height: 48px; font-size: 18px; padding: 8px 14px; border-radius: 15px; }
.tb svg.art { margin: -6px 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.row2 .tb { margin: 0; }
.linkbtn { appearance: none; display: inline; background: none; border: 0; padding: 8px 2px; margin: -8px 0; font: 800 inherit var(--read); font-size: inherit; color: #a3262a; text-decoration: underline; cursor: pointer; min-height: 0; line-height: inherit; }

/* ---- fields ---- */
.wtp label.lbl { display: block; margin: 12px 0 6px; font: 17px/1 var(--toon); color: #5a3418; letter-spacing: .02em; }
.field { display: block; width: 100%; min-height: 54px; margin: 0; font: 800 19px/1.2 var(--read); color: var(--p-ink); background: #fffdf6;
  border: 3px solid #c9a774; border-radius: 15px; padding: 10px 14px; box-shadow: inset 0 3px 0 rgba(138,90,44,.14); -webkit-appearance: none; appearance: none; }
.field::placeholder { color: #b9a07c; font-weight: 700; }
.field:focus { outline: none; border-color: var(--p-leaf-d); box-shadow: 0 0 0 4px rgba(92,184,74,.35), inset 0 3px 0 rgba(138,90,44,.14); }

/* ---- the entry screen ---- */
.hero { text-align: center; margin: 0 0 30px; }
.hero .scene { margin: 0 auto -6px; width: 210px; height: 200px; }
.hero h1 { font: 44px/1 var(--toon); margin: 0; color: #ffe6a6; letter-spacing: .01em; text-shadow: 0 3px 0 #6a3a12, 0 6px 14px rgba(0,0,0,.55); }
.hero p { margin: 8px 0 0; color: #d9e8cf; font-weight: 700; }
.hero b { font-family: var(--toon); font-weight: 400; color: #ffe6a6; letter-spacing: .06em; font-size: 19px; }
.joinrow { display: flex; align-items: flex-end; gap: 12px; }
.joinrow > div { flex: 1; min-width: 0; }
.joinmed { flex: none; width: 82px; height: 82px; margin-bottom: -4px; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 6px; }
.sw { position: relative; aspect-ratio: 1; width: 100%; min-height: 44px; margin: 0; padding: 0; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.6) 0 13%, transparent 14%), radial-gradient(circle at 42% 38%, var(--cl) 0 52%, var(--c) 53%);
  border: 3px solid var(--cd); box-shadow: 0 4px 0 var(--cd); transition: transform .3s var(--spring); }
.sw.sel { transform: scale(1.14); box-shadow: 0 4px 0 var(--cd), 0 0 0 4px #fff, 0 0 0 7px var(--cd); }
.sw svg { position: absolute; inset: 0; margin: auto; }
.sw:disabled { opacity: .22; cursor: default; box-shadow: none; transform: scale(.82); }
.seat { display: flex; align-items: center; gap: 12px; width: 100%; margin: 8px 0 0; padding: 8px 14px 8px 8px; text-align: left; font: 19px/1.1 var(--toon); color: #4a2a17;
  background: #fffaf0; border: 3px solid #c9a774; border-radius: 18px; box-shadow: 0 4px 0 #a98654; cursor: pointer; }
.seat:active { transform: translateY(3px); box-shadow: 0 1px 0 #a98654; }
.seat small { display: block; font: 700 13px var(--read); color: var(--p-ink2); }
.pinrow { display: flex; gap: 10px; align-items: stretch; }
.pinrow .field { flex: 1; width: auto; min-width: 0; text-align: center; letter-spacing: .35em; font-family: var(--toon); font-weight: 400; font-size: 24px; }
.pinrow .tb { margin: 0; }
.foot { text-align: center; font-size: 14px; color: #b9cdb0; margin-top: 4px; }
.foot a { color: #ffe6a6; }

/* ---- header: a wooden plank with the player's medallion ---- */
.plank { position: relative; display: flex; align-items: center; gap: 8px; margin: 10px 0 32px; padding: 10px 10px 10px 104px; min-height: 84px;
  background: repeating-linear-gradient(176deg, rgba(255,255,255,0) 0 9px, rgba(90,52,24,.13) 9px 11px, rgba(255,255,255,0) 11px 23px), linear-gradient(#b67f49, #8c5833);
  border: 3px solid #4a2a17; border-radius: 22px; box-shadow: 0 5px 0 #351c0b, 0 12px 22px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,222,170,.55), inset 0 -3px 0 rgba(0,0,0,.12); }
.medbtn { position: absolute; left: -6px; top: 50%; width: 112px; height: 112px; margin: -56px 0 0; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.medbtn:active { transform: scale(.95); }
.medbtn .cam { position: absolute; left: 50%; bottom: 0; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(#fffaf0, #efdcb4); border: 3px solid #8a5a2c; box-shadow: 0 3px 0 #5a3418; }
.plank .who { flex: 1; min-width: 0; }
.plank .nm { font: 25px/1.05 var(--toon); color: #fff6e0; letter-spacing: .01em; text-shadow: 0 2px 0 #4a2a17, 0 3px 6px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plank .ph { font: 800 13.5px/1.25 var(--read); color: #ffe2b0; margin-top: 3px; }
.plank .vb { flex: none; line-height: 0; }
.owlbtn { flex: none; width: 54px; height: 54px; padding: 0; margin: 0; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  background: linear-gradient(#7a64a8, #4d3c78); border: 3px solid #1f1638; box-shadow: 0 4px 0 #1f1638, inset 0 2px 0 rgba(255,255,255,.35); -webkit-tap-highlight-color: transparent; }
.owlbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f1638; }
.owlbtn.on { background: linear-gradient(#ffdc6a, #f2a62a); border-color: #8a5418; box-shadow: 0 4px 0 #8a5418; }

/* ---- night card: the Secret Owl ---- */
.tp.night { color: #f3eaff; background: linear-gradient(#3e3166, #2a2147); border-color: var(--p-night-d); box-shadow: 0 6px 0 var(--p-night-d), 0 14px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.18); }
.tp.night .small { color: #cfc2ea; }
.owlrow { display: flex; align-items: center; gap: 12px; }
.owlrow p { font: 800 18px/1.35 var(--read); margin: 0; }
.secret { appearance: none; font: 22px/1.1 var(--toon); color: #ffe6a6; background: rgba(255,255,255,.08); border: 2px dashed rgba(255,230,166,.5); border-radius: 10px; padding: 3px 8px; margin: 0 2px; cursor: pointer; filter: blur(7px); }
.secret.shown { filter: none; border-style: solid; }

/* ---- lists, meters, chips ---- */
.plist { list-style: none; margin: 10px 0; padding: 0; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 2px dotted #e2c99a; }
.plist li:last-child { border-bottom: 0; }
.plist li.mine { background: rgba(255,214,90,.25); border-radius: 14px; }
.plist .pn { flex: 1; min-width: 0; font: 19px/1.1 var(--toon); color: #4a2a17; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .pn em { font: 800 12px var(--read); font-style: normal; color: #fff; background: #4fa83a; border-radius: 99px; padding: 2px 7px; vertical-align: 2px; }
.plist .rbs { display: flex; gap: 2px; flex: none; }
.plist .rbs small { color: var(--p-ink2); }
.meter { position: relative; height: 20px; margin: 12px 0 4px; border-radius: 99px; background: var(--p-well); border: 3px solid #b8955e; box-shadow: inset 0 3px 0 rgba(0,0,0,.08); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(#8fdc62, #4fa83a); box-shadow: inset 0 3px 0 rgba(255,255,255,.4); transition: width .6s var(--spring); }
.meter b { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #8a5418; border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 800 13.5px/1 var(--read); color: #8a7258; background: var(--p-well); border: 2px solid var(--p-well-line); border-radius: 99px; padding: 6px 10px 6px 8px; }
.chip.ok { color: #22551a; background: #d5f0c2; border-color: #7cbf5e; }
.alert { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; padding: 10px 12px; border-radius: 14px; background: #ffe1dc; border: 3px solid #d0574f; color: #7a1f1a; font-weight: 800; box-shadow: 0 3px 0 #a3262a; }
.alert svg { flex: none; }
.stand { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 800; }

/* ---- turn and enter ---- */
.spot { display: flex; align-items: center; gap: 12px; }
.spot > div { flex: 1; min-width: 0; }
.leaves { display: inline-flex; gap: 2px; vertical-align: middle; }
.turnrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
/* Your turn: the flat map (turned like the big screen) and the action buttons under it. */
.pmap { display: block; width: calc(100% + 20px); margin: 6px -10px 4px; height: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(closest-side, #2c5a34, #1d3d26); border-radius: 18px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
.pmap text { font-family: var(--read); pointer-events: none; }
.maphint { margin: 6px 0 0 !important; min-height: 2.6em; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0 2px; font: inherit; font-weight: 900; color: #1f7a48; text-decoration: underline; cursor: pointer; }
.selbar { margin: 4px 0 8px; padding: 9px 12px; border-radius: 14px; background: var(--p-well); border: 2px solid var(--p-well-line); }
.selbar > span { display: block; font-weight: 900; }
.selbar > small { display: block; color: var(--p-ink2); }
.selbar .tb { margin-top: 8px; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 2px; }
.abtn { appearance: none; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 76px; padding: 6px 4px 5px; border-radius: 16px; cursor: pointer;
  font: 800 15px/1.1 var(--read); color: #4a2a17; background: linear-gradient(#fffaf0, #efdcb4); border: 3px solid #8a5a2c; box-shadow: 0 4px 0 #8a5a2c; }
.abtn small { font-size: 11px; font-weight: 800; color: #8a5418; min-height: 12px; }
.abtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a2c; }
.abtn.sel { background: linear-gradient(#ffeaa0, #f6c445); border-color: #8a5418; box-shadow: 0 4px 0 #8a5418, 0 0 0 3px rgba(255,214,90,.6); }
.abtn.no { opacity: .42; filter: grayscale(.7); }
.abtn:disabled { opacity: .6; }
.passp { margin: 8px 0; padding: 8px 10px; border-radius: 14px; background: #e6f4ff; border: 2px solid #8fc3e8; }
.prow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.prow > span { flex: 1; font-weight: 900; }
.pitem { appearance: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: #fff; border: 2px solid #8fc3e8; box-shadow: 0 3px 0 #5d9cc9; cursor: pointer; }
.pitem:disabled { opacity: .35; box-shadow: none; }
.vals { display: grid; gap: 7px; margin-top: 10px; }
.val { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 15px; background: #fffaf0; border: 2px solid var(--p-well-line); }
.val b { display: block; font: 18px/1.1 var(--toon); font-weight: 400; color: #4a2a17; }
.val small { display: block; color: var(--p-ink2); font-weight: 700; }

/* ---- shares ---- */
.sticker { position: absolute; top: -26px; right: 12px; line-height: 0; transform: rotate(8deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,.18)); }
.sharehead { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; padding-right: 58px; }
.sharehead .lead { margin: 0; }
.prompt { position: relative; margin: 6px 0 8px; padding: 14px 16px 14px 34px; font: 900 21px/1.32 var(--read); color: #3b2414;
  background: #fffdf6; border: 3px solid var(--kc, #d7ba82); border-radius: 18px; box-shadow: 0 4px 0 var(--kd, #b8955e); }
.prompt::before { content: '\201C'; position: absolute; left: 9px; top: 2px; font: 46px/1 var(--toon); color: var(--kc, #c9a774); }
.tagline { font-style: italic; font-weight: 700; color: var(--p-ink2); margin: 2px 0 8px; }
.timer { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0; padding: 4px 12px 4px 6px; border-radius: 99px; background: #fff3cf; border: 2px solid #e2b04a; font: 20px/1 var(--toon); color: #8a5418; font-variant-numeric: tabular-nums; }
.timer:has([data-timer]:empty) { display: none; }
.timer .over { color: #c8463f; }
.trust { margin-top: 14px; text-align: center; }
.acornbtn { --b1: #ffdc6a; --b2: #f2a62a; --bd: #8a5418; position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; min-height: 86px; margin: 0;
  padding: 8px 20px; font: 30px/1 var(--toon); letter-spacing: .02em; color: #fff; text-shadow: 0 3px 0 var(--bd);
  background: radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.35), transparent 50%), linear-gradient(var(--b1), var(--b2));
  border: 4px solid var(--bd); border-radius: 26px; box-shadow: 0 7px 0 var(--bd), 0 12px 20px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.5);
  cursor: pointer; transition: transform .1s, box-shadow .1s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.acornbtn .nut { display: inline-block; animation: wobble 2.4s ease-in-out infinite; transform-origin: 50% 85%; line-height: 0; }
.acornbtn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 1px 0 var(--bd), 0 4px 8px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.4); }
.acornbtn:disabled { --b1: #e6e0d2; --b2: #cbc2ad; --bd: #8f8572; color: #fbf8f0; text-shadow: 0 2px 0 #8f8572; cursor: default; }
.acornbtn:disabled .nut { animation: none; filter: grayscale(1) opacity(.55); }
@keyframes wobble { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-2px); } }
.acornrow { display: flex; justify-content: center; flex-wrap: wrap; gap: 1px; margin: 12px 0 2px; line-height: 0; }
.acornrow .off { filter: grayscale(1) opacity(.28); }
.why-off { margin: 8px 0 0; font-weight: 800; color: var(--p-ink2); }
.given { display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: left; border-radius: 22px; background: linear-gradient(#fff4c4, #ffe08a); border: 4px solid #c98a20; box-shadow: 0 5px 0 #8a5418; animation: given .6s var(--spring); }
.given b { display: block; font: 24px/1.1 var(--toon); font-weight: 400; color: #7a4510; }
.given span { font-weight: 800; color: #6a4416; }
@keyframes given { 0% { transform: scale(.6) rotate(-4deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
/* treasure moment: gold rays behind the treasure */
.tp.gold { background: linear-gradient(#fff7da, #ffe9a8); }
.tbox { position: relative; height: 150px; margin: -6px -8px 4px; display: grid; place-items: center; overflow: hidden; border-radius: 18px; }
.rays { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,214,90,.55) 0 9deg, rgba(255,214,90,0) 9deg 22deg); animation: spin 22s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 62%); mask: radial-gradient(circle, #000 20%, transparent 62%); }
.tbox .art { position: relative; animation: rise 2.6s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255,220,120,.9)); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { 0%, 100% { transform: translateY(4px); } 50% { transform: translateY(-6px); } }
.tname { text-align: center; }
.tp.gold .meaning { text-align: center; font: italic 800 17px/1.3 var(--read); color: #8a5418; margin: 0 0 10px; }

/* ---- pack ---- */
.pack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 18px; background: var(--p-well); border: 3px solid var(--p-well-line); box-shadow: inset 0 4px 0 rgba(138,90,44,.12); text-align: center; min-width: 0; }
.slot .si { height: 40px; display: grid; place-items: center; }
.slot b { font: 26px/1 var(--toon); font-weight: 400; color: #4a2a17; }
.slot b small { font-size: 16px; color: #9a7c58; }
.slot b.tn { font-size: 17px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot span { font: 800 12px/1 var(--read); color: var(--p-ink2); text-transform: uppercase; letter-spacing: .06em; }
.slot.zero { background: #ffe1dc; border-color: #e0827a; }
.slot.zero b { color: #a3262a; }
.slot.none b { color: #a8906c; }
.where { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 15px; background: #fffaf0; border: 2px solid var(--p-well-line); font-weight: 700; }
.where > span { flex: 1; min-width: 0; }
.where .wxc { flex: none; display: flex; flex-direction: column; align-items: center; font: 800 11px/1 var(--read); color: var(--p-ink2); gap: 2px; }

/* ---- private: peeks and the Investigator ---- */
.sec + .sec { margin-top: 16px; padding-top: 14px; border-top: 2px dotted #e2c99a; }
.sech { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sech b { font: 20px/1 var(--toon); font-weight: 400; color: #4a2a17; }
.sech small { color: var(--p-ink2); font-weight: 800; }
.note { display: flex; align-items: center; gap: 10px; margin: 7px 0; padding: 8px 12px 8px 8px; border-radius: 15px; background: #fffaf0; border: 2px solid var(--p-well-line); font-weight: 700; line-height: 1.3; }
.note.new { border-color: #7cbf5e; box-shadow: 0 0 0 3px rgba(124,191,94,.3); }
.loc { white-space: nowrap; font-weight: 800; }
.loc svg { margin: -4px 2px 0 0; }
.wxn { display: block; font: 22px/1.1 var(--toon); font-weight: 400; color: #4a2a17; }
.breath { padding: 10px 12px; border-radius: 16px; background: #f3eefc; border: 2px solid #b9a6e0; }
.breath .bt { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-weight: 800; color: #4a3570; }
.brow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 2px dotted #d8cdef; font-weight: 700; }
.brow > span { flex: 1; min-width: 0; }
.brow .x2 { font: 17px/1 var(--toon); color: #7d47a6; }
.tagx { font: 800 11.5px/1 var(--read); padding: 4px 7px; border-radius: 99px; white-space: nowrap; }
.tagx.seal { background: #7d47a6; color: #fff; }
.tagx.risk { background: #ffe1dc; color: #a3262a; border: 1px solid #e0827a; }
.sectors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.sbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 76px; margin: 0; padding: 8px 2px 6px; font: 800 12.5px/1.1 var(--read); color: #4a2a17;
  background: linear-gradient(#fffaf0, #efdcb4); border: 3px solid #8a5a2c; border-radius: 16px; box-shadow: 0 4px 0 #5a3418; cursor: pointer; touch-action: manipulation; }
.sbtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #5a3418; }
.sbtn:disabled { opacity: .45; cursor: default; }
.sbtn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }

/* ---- roles ---- */
.role { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0; padding: 8px 12px 10px 8px; border-radius: 16px; background: #fffaf0; border: 2px solid var(--p-well-line); }
.role b { display: block; font: 20px/1.15 var(--toon); font-weight: 400; color: #4a2a17; margin-top: 4px; }
.role span { display: block; font-weight: 700; color: #5a3d26; line-height: 1.32; }

/* ---- finale ---- */
.picks { display: grid; gap: 8px; margin-top: 10px; }
.pick { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0; padding: 6px 12px 6px 6px; text-align: left; font: 20px/1.1 var(--toon); color: #4a2a17;
  background: #fffaf0; border: 3px solid #c9a774; border-radius: 18px; box-shadow: 0 4px 0 #a98654; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .25s var(--spring); }
.pick > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick em { font: 800 12px var(--read); font-style: normal; color: #fff; background: #4fa83a; border-radius: 99px; padding: 3px 8px; flex: none; }
.pick.sel { background: #fff3c4; border-color: #d68a12; box-shadow: 0 4px 0 #8a5418, 0 0 0 4px rgba(255,214,90,.55); transform: scale(1.02); }
.pick:active { transform: translateY(3px); }
.resline { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 6px 10px; border-radius: 12px; font-weight: 800; background: #e8f6dc; color: #2c5a1f; }
.resline.sleep { background: #ece6f4; color: #4a3570; }
.chain { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 6px 0; }
.chain .ar { line-height: 0; }
.chainnames { display: grid; grid-template-columns: 1fr 1fr; text-align: center; font: 19px/1.1 var(--toon); color: #4a2a17; margin-bottom: 8px; gap: 30px; }
.scene { display: block; margin: -4px auto 0; }
.endscene { margin: -10px -8px 0; height: 210px; border-radius: 18px; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(90% 80% at 50% 30%, #2a4a40, #12241b); border: 3px solid #23382c; box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
.endscene.dawn { background: radial-gradient(90% 85% at 50% 35%, #fff2c4 0%, #ffd27a 30%, #6bb36a 70%, #2c6a3a 100%); border-color: #b08a2c; }
.result { text-align: center; font-size: 30px !important; margin: 12px 0 2px !important; }
.recs { display: grid; gap: 8px; margin-top: 8px; }
.rec { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 16px; background: #fffaf0; border: 2px solid var(--p-well-line); font-weight: 700; line-height: 1.3; }
.rec .num { font: 30px/1 var(--toon); color: #7a4510; margin-right: 4px; }
.rec .yes { color: #2c6a20; font-weight: 900; }
.privacy { display: flex; align-items: flex-start; gap: 8px; margin: 18px 0 0; font-size: 13.5px; font-weight: 700; color: var(--p-ink2); line-height: 1.35; }
.privacy svg { flex: none; margin-top: 1px; }

/* ---- the photo sheet ---- */
body.sheet-open { overflow: hidden; }
.sheet { position: fixed; inset: 0; z-index: 50; overflow-y: auto; overscroll-behavior: contain; padding: 40px 14px calc(40px + env(safe-area-inset-bottom));
  background: rgba(5,12,8,.76); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet .tp { max-width: 430px; margin: 0 auto; animation: pop .5s var(--spring); }
.sheetmed { width: 210px; height: 210px; margin: -4px auto 0; }
.stage { position: relative; width: min(100%, 300px); aspect-ratio: 1 / 1; margin: 4px auto 6px; border-radius: 24px; overflow: hidden; touch-action: none; cursor: grab;
  background: #16281d; border: 3px solid var(--p-wood); box-shadow: 0 4px 0 var(--p-wood-d), inset 0 0 0 2px rgba(255,255,255,.12); }
.stage:active { cursor: grabbing; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.zoom { display: flex; align-items: center; gap: 10px; margin: 6px auto 4px; max-width: 300px; }
.zoom input[type=range] { flex: 1; min-width: 0; height: 16px; margin: 0; -webkit-appearance: none; appearance: none; border-radius: 99px; background: var(--p-well); border: 3px solid #b8955e; box-shadow: inset 0 2px 0 rgba(0,0,0,.08); }
.zoom input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 36% 30%, #fff 0 16%, transparent 17%), linear-gradient(#8fdc62, #4fa83a); border: 3px solid #2c6a20; box-shadow: 0 3px 0 #2c6a20; }
.zoom input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; background: linear-gradient(#8fdc62, #4fa83a); border: 3px solid #2c6a20; box-shadow: 0 3px 0 #2c6a20; }
.zbtn { flex: none; width: 46px; height: 46px; padding: 0 0 3px; margin: 0; display: grid; place-items: center; font: 28px/1 var(--toon); color: #5a3418;
  background: linear-gradient(#fffaf0, #efdcb4); border: 3px solid #8a5a2c; border-radius: 50%; box-shadow: 0 4px 0 #5a3418; cursor: pointer; touch-action: manipulation; }
.zbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5a3418; }
.loading { display: grid; place-items: center; gap: 10px; height: 220px; font: 20px var(--toon); color: #5a3418; }
.loading .art { animation: wobble 1s ease-in-out infinite; }
.vh { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }

/* ---- toast and connection badge ---- */
#flash { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 70; width: max-content; max-width: min(92vw, 400px);
  transform: translate(-50%, 180%); padding: 12px 16px; border-radius: 16px; font: 800 16px/1.3 var(--read); color: var(--p-ink);
  background: var(--p-paper); border: 3px solid var(--p-leaf-d); box-shadow: 0 5px 0 var(--p-leaf-d), 0 12px 26px rgba(0,0,0,.5); pointer-events: none;
  visibility: hidden; transition: transform .4s var(--spring), visibility 0s .4s; }
#flash.err { border-color: #a3262a; box-shadow: 0 5px 0 #a3262a, 0 12px 26px rgba(0,0,0,.5); background: #fff1ee; }
#flash.show { transform: translate(-50%, 0); visibility: visible; transition: transform .4s var(--spring); }
#conn { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 8; font: 800 12px/1 var(--read); padding: 6px 10px; border-radius: 99px; background: rgba(10,22,15,.82); border: 2px solid rgba(255,255,255,.12); pointer-events: none; }
#conn.live { color: #8fdc62; opacity: .75; }
#conn.down { color: #ffd862; }
#conn.offline { color: #ff8a80; background: rgba(60,12,12,.9); }
#toast { display: none; }

@media (prefers-reduced-motion: reduce) {
  .tp.pop, .tp.hot::after, .acornbtn .nut, .given, .rays, .tbox .art, .sheet .tp, .loading .art { animation: none !important; }
  .sw, .pick, #flash, .meter i { transition: none; }
}
@media (max-width: 370px) {
  .plank { padding-left: 96px; }
  .medbtn { width: 104px; height: 104px; margin-top: -52px; }
  .plank .nm { font-size: 22px; }
  .lead { font-size: 19px; }
  .prompt { font-size: 19.5px; }
  .acornbtn { font-size: 26px; }
}
</style>
</head>

        <div class="joinrow">
          <div class="joinmed" id="joinMed"></div>
          <div><label class="lbl" for="name">Your name</label><input id="name" class="field" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="First name"></div>
        </div>
        <label class="lbl">Your colour</label>

        <button class="tb block huge" data-act="join">Join the forest</button>

      <span class="sign" style="--sl:#ffdc6a;--sc:#f2a62a;--sd:#8a5418">Rejoin with a code</span>
      <p class="small">Lost your seat (new phone, closed browser)? The Keeper can give you a 4-digit code.</p>
      <div class="pinrow"><input id="pin" class="field" inputmode="numeric" maxlength="4" placeholder="1234" aria-label="Rejoin code"><button class="tb gold" data-act="rejoin">Rejoin</button></div>

  </section>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Your photo"><div class="tp" id="sheetCard"></div></div>
<input type="file" id="photoCam" class="vh" accept="image/*" capture="user" tabindex="-1" aria-hidden="true">
<input type="file" id="photoPick" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">

<script src="common.js"></script>
<script src="art.js"></script>
<script src="find.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => HW.esc(s);
const params = new URLSearchParams(location.search);

// ---------- seats on this device ----------
// One localStorage key per seat (hw-seat-CODE-PID), so tabs joining at the same
// time can't overwrite each other. The seat in use is in the URL (?p=…), so each
// tab can be a different player and a reload keeps the same one.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  keys() { try { return Object.keys(localStorage); } catch { return []; } },
};
const seatPrefix = `hw-seat-${HW.code}-`;
function loadSeats() {
  const out = {};
  for (const k of store.keys()) {
    if (k.startsWith(seatPrefix)) { try { out[k.slice(seatPrefix.length)] = JSON.parse(store.get(k)); } catch {} }
  }
  return out;
}
const putSeat = (pid, seat) => store.set(seatPrefix + pid, JSON.stringify(seat));
const dropSeat = pid => store.del(seatPrefix + pid);
// Earlier versions kept seats in one shared key.
for (const k of ['hw-seats-' + HW.code, 'hw-p-' + HW.code]) {
  let old = null;
  try { old = JSON.parse(store.get(k) || 'null'); } catch {}
  if (!old) continue;
  if (old.pid) putSeat(old.pid, { secret: old.secret, name: '' });
  else for (const [id, seat] of Object.entries(old)) if (!loadSeats()[id]) putSeat(id, seat);
  store.del(k);
}
// "Skip for now" on the photo step, remembered per seat (not under the seat prefix).
const photoSkipKey = id => `hw-photoskip-${HW.code}-${id}`;

let creds = null;
const pid = params.get('p');
const mySeat = pid && loadSeats()[pid];
if (mySeat) creds = { pid, secret: mySeat.secret };

// Local, unsent choices that survive a redraw.
const ui = { color: '', owlOpen: false, owlShown: false, guessPick: '', busy: '', photoChecked: false, screen: '',
  sel: null, mode: '', pass: false, confirmEnd: false, tscope: '' };   // sel, mode, pass: your turn's map and buttons

// ---------- lookups (own copies, so the board rewrite can't break the phone) ----------
const V = () => HW.view;
const player = id => (V()?.players || []).find(p => p.id === id);
const pname = id => player(id)?.name || '?';
const valueOf = i => V()?.values?.[i];
const treasureOf = id => (V()?.treasures || []).find(t => t.id === id);
const roleOf = type => (V()?.roles || []).find(r => r.type === type);
const has = (p, type) => (p?.types || []).includes(type);
const WX = { sun: 'Sun', rain: 'Rain', fog: 'Fog' };
const DECK_COLOR = { 3: '#f2b32e', 2: '#3f9e9a', 1: '#7a52b3' };   // Light, Story, Deep
const deckName = r => V()?.ringDecks?.[r] || ['', 'Deep', 'Story', 'Light'][r] || '';
const shortTreasure = t => (t?.name || '').replace(/^The\s+/i, '');

// Go sends empty lists as null; the shared normaliser may not know the new fields yet.
function normalise(v) {
  v.players = (v.players || []).map(p => ({ ...p, types: p.types || [], reached: p.reached || [] }));
  v.order ||= []; v.values ||= []; v.roles ||= []; v.treasures ||= []; v.hexes ||= []; v.colors ||= []; v.tiles ||= []; v.weather ||= [];
  v.stages ||= ['', 'Seeded', 'Sprout', 'Sapling', 'Big Tree'];
  v.ringDecks ||= ['', 'Deep', 'Story', 'Light'];
  v.goals ||= {}; v.goals.treasures ||= [];
  if (v.me) { v.me.peeks ||= []; v.me.breath ||= []; }
  v.recognition ||= [];
  return v;
}

// ---------- art (web/art.js draws everything; this page only frames it) ----------
ART.install();
// Every picture is a string; the same picture gives the same string, so HW.patch
// can skip redraws that change nothing (and animations don't restart).
const memo = new Map();
const keep = (k, f) => { let s = memo.get(k); if (s === undefined) { if (memo.size > 800) memo.clear(); s = f(); memo.set(k, s); } return s; };
const pic = (inner, vb, w, h) => `<svg class="art" viewBox="${vb}" width="${w}" height="${h ?? w}" aria-hidden="true" focusable="false">${inner}</svg>`;
const A = {
  icon: (n, w = 32) => keep(`i${n}${w}`, () => pic(ART.icon(n), '-24 -24 48 48', w)),
  role: (t, w = 44) => keep(`r${t}${w}`, () => pic(ART.roleBadge(t), '-25 -25 50 50', w)),
  value: (i, w = 36) => keep(`v${i}${w}`, () => pic(ART.valueBadge(i), '-25 -25 50 50', w)),
  wx: (k, w = 32) => keep(`w${k}${w}`, () => WX[k] ? pic(ART.weatherBadge(k), '-25 -25 50 50', w) : ''),
  fruit: (w = 26) => keep(`f${w}`, () => pic(ART.fruit(), '-13 -13 26 26', w)),
  drop: (w = 26) => keep(`d${w}`, () => pic(ART.drop(), '-13 -13 26 26', w)),
  acorn: (w = 26) => keep(`a${w}`, () => pic(ART.acorn(), '-13 -13 26 26', w)),
  treasure: (id, w = 40) => keep(`t${id}${w}`, () => pic(ART.treasure(id), '-20 -21 40 42', w, w * 42 / 40)),
};
const photoURL = p => p && p.photo > 0 ? `/api/games/${encodeURIComponent(HW.code)}/photo/${encodeURIComponent(p.id)}?v=${p.photo}` : '';
// A player's medallion. `slot` names where it sits on the page: art.js gives each
// photo clip a fresh id, so it is renamed per slot to keep the string stable.
function medal(p, slot, w, o = {}) {
  if (!p) return '';
  const opts = { photo: o.photo ?? photoURL(p), name: p.name, color: p.color, water: o.water ?? p.water ?? 0,
    fruit: o.items ? p.fruit || 0 : 0, treasure: o.items ? p.treasure || '' : '', state: o.state || '', stump: false };
  const id = 'pm-' + String(slot).replace(/[^\w-]/g, '');
  return keep(`m${id}|${w}|${JSON.stringify(opts)}`, () => pic(ART.medallion(opts).replace(/art-ph\d+/g, id), '-35 -36 70 70', w));
}
// Small drawings art.js doesn't have, in the same toon style.
const toon = (c, k = .5) => ART.tone(c, k, .16, .16);
const CAMERA = (w = 24) => keep('cam' + w, () => pic(`<path d="M-12,-4 q0-4 4-4 h3 l2.5-3.6 h7 l2.5 3.6 h3 q4 0 4 4 v11 q0 4-4 4 h-18 q-4 0-4-4Z" fill="#3e4c5a" stroke="#2a3540" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-12,-4 q0-4 4-4 h3 l2.5-3.6 h7 l2.5 3.6 h3 q4 0 4 4 v11 q0 4-4 4 h-18 q-4 0-4-4Z" fill="#5f7486"/><path d="M-10,-3 q0-3 3-3 h17 q3 0 3 3 v3 h-23Z" fill="#7d93a6"/>
  <circle cx="0" cy="2.5" r="6.2" fill="#2a3540"/><circle cx="0" cy="2.5" r="4.6" fill="#7fd0ff"/><circle cx="-1.6" cy="0.8" r="1.6" fill="#fff"/><circle cx="9" cy="-4" r="1.4" fill="#ffd862"/>`, '-15 -15 30 30', w));
const CHECK = (w = 16, c = '#2c6a20') => keep('ck' + w + c, () => pic(`<path d="M-7,0 L-2.4,5 L7,-6" fill="none" stroke="${c}" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7,0 L-2.4,5 L7,-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`, '-10 -10 20 20', w));

const EMPTY = (w = 30) => keep('em' + w, () => pic('<circle r="10.5" fill="#e6cf9f" stroke="#b8955e" stroke-width="2.2" stroke-dasharray="4 3"/><circle r="4" fill="#d7ba82"/>', '-13 -13 26 26', w));
const ARROW = (w = 44) => keep('ar' + w, () => { const t = toon('#f2b32e'); const d = 'M-14,-5 L3,-5 L3,-12 L15,0 L3,12 L3,5 L-14,5Z'; return pic(`<path d="${d}" fill="${t.o}" stroke="${t.o}" stroke-width="4" stroke-linejoin="round"/><path d="${d}" fill="${t.d}"/><path d="M-12,-3.2 L4.6,-3.2 L4.6,-8 L12,-.6 L-12,-.6Z" fill="${t.l}"/>`, '-18 -18 36 36', w); });

function setURL() { history.replaceState(null, '', `${location.pathname}?${params}`); }

function takeSeat(r) {

// ---------- feedback ----------
let flashT = null;
function flash(msg, bad) {
  const f = $('flash');
  f.textContent = msg; f.className = bad ? 'err show' : 'show';
  clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), bad ? 4600 : 2600);
}
// Server errors are plain sentences; make them read like one, and say so when the network is the problem.
function friendly(m) {
  if (!m || /failed to fetch|load failed|networkerror|network request failed/i.test(m)) return 'No connection. Check the Wi-Fi and try again.';
  m = String(m).trim();
  m = m.charAt(0).toUpperCase() + m.slice(1);
  return /[.!?]$/.test(m) ? m : m + '.';
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Something went wrong (${r.status}). Try again.`);
  return j;
}

// Sends a phone action with this seat; shows the result either way.
async function send(type, extra, okMsg) {
  if (ui.busy || !creds) return false;
  ui.busy = type; draw();
  try {
    const r = await post(`/api/games/${HW.code}/action`, { ...creds, type, ...extra });
    if (r.view) HW.apply(r.view);
    if (okMsg) flash(okMsg);
    return true;
  } catch (e) {
    flash(friendly(e.message), true);
    return false;
  } finally { ui.busy = ''; draw(); }
}

// ---------- render ----------
function draw() { if (V()) render(V()); }

function render(v) {
  normalise(v);
  window.HWFind?.view(v);   // a sealed find covers every screen (find.js)
  if (creds && !v.me) {
    // Our seat is gone (removed in the lobby) or this view isn't ours yet.
    if (v.players.every(p => p.id !== creds.pid)) {
      dropSeat(creds.pid); creds = null;
      params.delete('p'); setURL();
      closePhoto();
      HW.reconnect({});
    }
    return renderEntry(v);
  }
  if (!v.me) return renderEntry(v);
  $('entry').hidden = true; $('game').hidden = false;
  renderGame(v);
  photoViewChanged(v);
}

// ---------- join / continue / rejoin ----------
function renderEntry(v) {

    <h1>Heartwood</h1><p>Game <b>${esc(v.code || HW.code)}</b> · The forest is asleep. Wake it together.</p>`);
  const mine = Object.entries(loadSeats()).filter(([id]) => v.players.some(p => p.id === id));
  $('seatsBox').hidden = !mine.length;

    return `<button class="seat" data-act="seat" data-pid="${esc(id)}">${medal(p, 'seat' + id, 52)}<span>Continue as ${esc(p.name)}<small>Your seat on this phone</small></span></button>`; }).join(''));
  const open = v.phase === 'lobby' && v.players.length < (v.maxPlayers || 12);

// The medallion you'll have, as you type your name and pick a colour.

// ---------- game ----------
// The phone shows what is yours (pack, roles, private looks, your Secret Owl), your turn's map and actions
// (everyone plays the round at once), and the private actions: trust, Investigator look, guess. When someone
// shares, it shows only the share and the trust acorn: phones down, eyes up.
function renderGame(v) {
  const me = player(v.me.id), mv = v.me;
  if (!me) return;
  const inPlay = v.phase === 'enter' || v.phase === 'turn';
  const myTurn = HW.playing(v, me) || (v.phase === 'enter' && v.current === me.id);
  const state = myTurn && !v.share ? 'turn' : inPlay && me.pos >= 0 && me.water === 0 ? 'dry' : '';
  const owlKnown = !!(mv.target || mv.targetName);
  const phaseName = { lobby: 'Gathering in the lobby', brief: 'The briefing', enter: 'Entering the forest', turn: `Round ${v.round || 1}${v.tide ? ` · after ${v.tide} Tide${v.tide > 1 ? 's' : ''}` : ''}`,
    guess: 'Who was your Secret Owl?', chain: 'The tribute chain', end: v.result === 'won' ? 'The forest wakes!' : v.result === 'ended' ? 'Game closed by the Keeper' : 'The forest sleeps' }[v.phase] || v.phase;
  HW.patch($('head'), `<button class="medbtn" data-act="photo" aria-label="Your photo (tap to change)">${medal(me, 'head', 112, { items: true, state })}<span class="cam">${CAMERA(19)}</span></button>
    <div class="who"><div class="nm">${esc(me.name)}</div><div class="ph">${esc(phaseName)}</div></div>
    ${me.value >= 0 ? `<span class="vb" title="You stand for ${esc(valueOf(me.value)?.name || '')}">${A.value(me.value, 42)}</span>` : ''}
    ${owlKnown ? `<button class="owlbtn ${ui.owlOpen ? 'on' : ''}" data-act="owl" aria-label="Your Secret Owl" aria-expanded="${ui.owlOpen}">${A.icon('owl', 40)}</button>` : ''}`);

  // Secret Owl: tucked behind the owl button; the name stays blurred until tapped.
  $('owl').hidden = !(owlKnown && ui.owlOpen);
  if (owlKnown) HW.patch($('owl'), `${sign('Your Secret Owl', '#7a5aa8')}
    <div class="owlrow">${A.icon('owl', 64)}<p>You are the Secret Owl of <button class="secret ${ui.owlShown ? 'shown' : ''}" data-act="owlname" aria-label="${ui.owlShown ? '' : 'Tap to show the name'}">${esc(mv.targetName || pname(mv.target))}</button>${ui.owlShown ? '' : ' <small>(tap to show)</small>'}</p></div>
    <p class="small">Watch them quietly all game: something they love, something that shaped them, something they hope for. Don't let them catch you.</p>
    <button class="tb night block sm" data-act="owl">Hide</button>`);

  const main = $('main');
  const m = mainPanel(v, me, mv);
  main.className = 'tp' + (m.cls ? ' ' + m.cls : '');
  main.style.cssText = m.color ? `--kc:${m.color};--kd:${ART.dark(m.color, .42)}` : '';
  HW.patch(main, m.html);
  // A new moment (phase, share, whose turn) pops in; small updates don't.
  const screen = [v.phase, v.share?.idx, v.phase === 'turn' ? v.round + '|' + !!HW.turnOf(v, me)?.done : v.current, v.tribute?.idx, HW.slideId(v)].join('|');
  if (screen !== ui.screen) {
    const first = !ui.screen;
    ui.screen = screen; main.classList.remove('pop'); void main.offsetWidth; main.classList.add('pop');
    // A new moment (a share, your turn) comes into view if you'd scrolled down to your roles.
    if (!first && $('sheet').hidden && main.getBoundingClientRect().top < 0) window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  $('pack').hidden = !inPlay || me.pos == null || me.pos < 0;
  if (!$('pack').hidden) HW.patch($('pack'), packPanel(v, me));

  const priv = inPlay ? privatePanel(v, me, mv) : '';
  $('private').hidden = !priv;
  if (priv) HW.patch($('private'), priv);

  const showRoles = v.phase === 'lobby' || inPlay;
  $('roles').hidden = !showRoles;
  if (showRoles) HW.patch($('roles'), rolesPanel(v, me));
  HW.patch($('foot'), `Game ${esc(v.code)} · <a href="howto.html" target="_blank">How to play</a> · <a href="wiki.html" target="_blank">Wiki</a>`);

  // The photo step, once after joining (and on a reload in the lobby, until skipped).
  if (!ui.photoChecked) {
    ui.photoChecked = true;
    if (v.phase === 'lobby' && !(me.photo > 0) && !store.get(photoSkipKey(me.id)) && $('sheet').hidden) openPhoto(true);
  }
}

function mainPanel(v, me, mv) {
  if (v.share && (v.phase === 'enter' || v.phase === 'turn')) return sharePanel(v, me);
  switch (v.phase) {
    case 'lobby': return { html: lobbyPanel(v, me) };
    case 'brief': return briefPanel(v, me, mv);
    case 'enter': return enterPanel(v, me);
    case 'turn': return turnPanel(v, me);
    case 'guess': return guessPanel(v, me, mv);
    case 'chain': return chainPanel(v, me);
    case 'end': return endPanel(v, me, mv);

}

function enterPanel(v, me) {

const leaves = (left, per) => `<span class="leaves" role="img" aria-label="${left} of ${per} actions left">${Array.from({ length: per }, (_, i) => LEAF(i < left, 32)).join('')}</span>`;

// ---------- your turn: everyone plays the round at once, on their own phone ----------
// The map is flat and plain, turned to the side the Keeper turned the big screen to (view.rot). Tap a glowing hex
// to move there; the buttons under it act on your own hex. The Keeper can still tap for anyone on the big screen.
const R = HW.rules;
const SQ3 = Math.sqrt(3);
const turnQR = (q, r, k) => { for (let n = 0; n < k; n++) [q, r] = [-r, q + r]; return [q, r]; };
const hexXY = (h, k) => { const [q, r] = turnQR(h.q, h.r, k); return [SQ3 * (q + r / 2), 1.5 * r]; };
const CORNER = [0, 1, 2, 3, 4, 5].map(k => { const a = Math.PI / 180 * (60 * k - 30); return [Math.cos(a), Math.sin(a)]; });
const hexPath = (x, y, s = .97) => 'M' + CORNER.map(([a, b]) => `${(x + a * s).toFixed(3)},${(y + b * s).toFixed(3)}`).join('L') + 'Z';
const at = (x, y, k, inner) => `<g transform="translate(${x.toFixed(3)},${y.toFixed(3)}) scale(${k})">${inner}</g>`;
const PLANT = (st, sec) => keep(`pl${st}|${sec}`, () => ART.plant(st, sec, { seed: 3 }));
const MOSS = '#3f8f35', DIRT = '#c4925c';
const ACTS = ['explore', 'sow', 'water', 'tend', 'clear', 'harvest', 'take', 'drink', 'pass'];
const ACT_NAME = { explore: 'Explore', sow: 'Sow', water: 'Water', tend: 'Tend', clear: 'Clear', harvest: 'Harvest', take: 'Take', drink: 'Drink', pass: 'Pass' };
const DONE = { explore: 'You explore.', sow: 'You sow a seed.', water: 'You water it.', tend: 'You tend it.', clear: 'You clear dead leaves.', harvest: 'You harvest a fruit.', take: 'You take the treasure.', drink: 'You drink.' };

// What is on a hex, in words.
function hexWhat(v, i) {
  const t = v.tiles[i] || {};
  if (!i) return 'the World Tree';
  const tr = t.treasure ? treasureOf(t.treasure) : null;
  const what = !t.up ? (t.hint === 'something' ? 'face down · something lies here' : t.hint === 'nothing' ? 'face down · nothing there' : 'face down')
    : t.stage ? (v.stages[t.stage] || '') + (t.stage === 4 && t.harvested ? ' (picked)' : '') : t.kind === 'spring' ? 'a spring' : tr ? esc(tr.name) : 'empty';
  return what + (t.leaves >= 2 ? ' · sealed by leaves' : t.leaves ? ' · dead leaves' : '');
}

function mapSVG(v, me, o) {
  const k = v.rot || 0, xy = v.hexes.map(h => hexXY(h, k));
  let tiles = '', marks = '', rims = '', ppl = '', hits = '', edge = '';
  for (let i = 0; i < v.hexes.length; i++) {
    const h = v.hexes[i], [x, y] = xy[i], t = v.tiles[i] || {}, d = hexPath(x, y);
    if (!i) {
      tiles += `<path d="${d}" fill="#e7c35c" stroke="#8a5418" stroke-width=".08"/>`;
      marks += at(x, y + .42, .0062, keep('wt' + (v.result === 'won'), () => ART.worldTree({ awake: v.result === 'won' })));
    } else {
      const col = v.values[h.sector]?.color || '#888';
      // moss (face down) or dirt (explored), edged in the colour of its value
      tiles += `<path d="${d}" fill="${t.up ? DIRT : MOSS}"/><path d="${d}" fill="${col}" opacity=".14"/>`
        + `<path d="${hexPath(x, y, .85)}" fill="none" stroke="${col}" stroke-width=".15"/>`;
      if (t.up && t.stage) marks += at(x, y + .38, .0105, PLANT(t.stage, h.sector));
      else if (t.up && t.kind === 'spring') marks += at(x, y - .05, .036, ART.drop());
      else if (t.up && t.treasure) marks += at(x, y - .05, .028, ART.treasure(t.treasure));
      else if (!t.up && t.hint === 'something') marks += `<text x="${x.toFixed(2)}" y="${(y + .22).toFixed(2)}" font-size=".7" text-anchor="middle" fill="#ffe680" stroke="#6b4a10" stroke-width=".06" paint-order="stroke">✦</text>`;
      if (t.leaves >= 2) marks += `<path d="${d}" fill="#3b2a1a" opacity=".55"/>` + at(x - .25, y - .1, .045, ART.deadLeaf({ seed: i })) + at(x + .22, y + .12, .045, ART.deadLeaf({ seed: i + 3 }));
      else if (t.leaves) marks += at(x + .3, y - .32, .04, ART.deadLeaf({ seed: i }));
    }
    const mine = me.pos === i, sel = o.sel === i, one = o.one.has(i), two = o.two.has(i), tgt = o.targets.has(i);
    if (one || two || tgt) rims += `<path d="${hexPath(x, y, .9)}" fill="${tgt ? 'rgba(127,227,255,.22)' : 'rgba(255,240,150,.2)'}" stroke="${tgt ? '#7fe3ff' : '#fff090'}" stroke-width=".13"${two ? ' stroke-dasharray=".25 .16"' : ''}/>`;
    if (mine) rims += `<path d="${hexPath(x, y, .93)}" fill="none" stroke="#ffb020" stroke-width=".16"/>`;
    if (sel) rims += `<path d="${hexPath(x, y, .86)}" fill="rgba(255,255,255,.3)" stroke="#fff" stroke-width=".18"/>`;
    hits += `<path d="${d}" fill="transparent" data-act="hex" data-i="${i}"/>`;
  }
  // players: a coloured counter with their initial, you with a gold ring
  const by = {};
  for (const p of v.players) if (p.pos >= 0) (by[p.pos] ||= []).push(p);
  for (const [pos, ps] of Object.entries(by)) {
    const [x, y] = xy[pos], n = ps.length, r = n > 3 ? .25 : n > 1 ? .32 : .38;
    ps.sort((a, b) => (a.id === me.id) - (b.id === me.id)).forEach((p, j) => {
      const row = n > 3 ? j % 2 : 0, col = n > 3 ? Math.floor(j / 2) : j, cols = n > 3 ? Math.ceil(n / 2) : n;
      const dx = cols === 1 ? 0 : (col - (cols - 1) / 2) * Math.min(.62, 1.5 / cols), dy = n > 3 ? (row ? .5 : .02) : n > 1 ? .4 : .3;
      const you = p.id === me.id, cx = x + dx, cy = y + dy;
      ppl += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(you ? r + .05 : r).toFixed(2)}" fill="${esc(p.color)}" stroke="${you ? '#ffd23a' : '#fff'}" stroke-width="${you ? .11 : .06}"${HW.turnOf(v, p)?.done ? ' opacity=".7"' : ''}/>`
        + `<text x="${cx.toFixed(2)}" y="${(cy + r * .38).toFixed(2)}" font-size="${(r * 1.15).toFixed(2)}" text-anchor="middle" fill="#fff" font-weight="900" stroke="rgba(0,0,0,.45)" stroke-width=".04" paint-order="stroke">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</text>`;
    });
  }
  // each value's sign and weather at its edge of the forest
  for (let sct = 0; sct < 6; sct++) {
    const ring = v.hexes.map((h, i) => [h, i]).filter(([h]) => h.ring === 4 && h.sector === sct);
    if (!ring.length) continue;
    const mx = ring.reduce((a, [, i]) => a + xy[i][0], 0) / ring.length, my = ring.reduce((a, [, i]) => a + xy[i][1], 0) / ring.length;
    const len = Math.hypot(mx, my) || 1, ux = mx / len, uy = my / len, ex = mx + ux * 1.55, ey = my + uy * 1.55;
    const w = v.weather[sct];
    edge += at(ex - uy * .45, ey + ux * .45, .022, ART.valueBadge(sct)) + (w ? at(ex + uy * .45, ey - ux * .45, .024, ART.weatherBadge(w)) : '');
  }
  return `<svg class="pmap" viewBox="-9.6 -8.6 19.2 17.2" role="img" aria-label="The forest map">${tiles}${marks}${edge}${rims}${ppl}${hits}</svg>`;
}

function turnPanel(v, me) {
  const t = HW.turnOf(v, me) || {}, per = v.actionsPerTurn || 2;
  const left = Math.max(0, Math.min(per, t.actions ?? 0)), done = !!t.done;
  // a new round, a move or the end of your turn drops what was half picked
  const scope = `${v.round}|${done}|${me.pos}`;
  if (scope !== ui.tscope) { ui.tscope = scope; ui.sel = null; ui.mode = ''; ui.pass = false; ui.confirmEnd = false; }
  const still = v.order.filter(id => !HW.turnOf(v, player(id))?.done).map(pname);
  if (done) {
    return { html: `${sign(`Round ${v.round || 1}`)}
      <p class="lead">You've ended your turn.</p>
      <p class="small">${still.length ? `Still playing: <b>${still.map(esc).join(', ')}</b>. The Forest Tide comes when everyone is done.` : 'The Forest Tide is coming.'}</p>
      ${mapSVG(v, me, { one: new Set(), two: new Set(), targets: new Set(), sel: ui.sel })}${selInfo(v, me, null)}` };
  }
  const o = R.turnOptions(v, me), m = R.moveTargets(v, me);
  const mode = ui.mode && o[ui.mode]?.ok ? ui.mode : '';
  const targets = new Set(mode ? o[mode].targets : []);
  const mapO = { one: new Set(mode ? [] : m.one), two: new Set(mode ? [] : m.two), targets, sel: ui.sel };
  const hint = mode ? `Tap a glowing blue hex to <b>${mode}</b>.` : m.one.length + m.two.length ? 'Tap a glowing hex to move there, or pick an action below.' : left ? 'Pick an action below.' : 'No actions left: pass things, or end your turn.';
  const btn = k => {
    const x = k === 'pass' ? passOption(v, me) : o[k], cost = k === 'pass' ? 0 : x.cost || 1, sel = (k === 'pass' && ui.pass) || mode === k;
    return `<button class="abtn${x.ok ? '' : ' no'}${sel ? ' sel' : ''}" data-act="do" data-k="${k}"${x.ok ? '' : ` data-why="${esc(x.why)}"`} ${ui.busy ? 'disabled' : ''}>
      ${A.icon(k, 34)}<span>${ACT_NAME[k]}</span><small>${k === 'pass' ? 'free' : cost > 1 ? '2 actions' : ''}</small></button>`;
  };
  return { cls: 'hot', html: `${sign('Your turn', '#f2a62a')}
    <div class="turnrow"><p class="lead" style="margin:0">Round ${v.round || 1}</p>${leaves(left, per)}</div>
    <p class="small maphint">${hint}${mode ? ' <button class="linkbtn" data-act="cancel">Cancel</button>' : ''}</p>
    ${mapSVG(v, me, mapO)}
    ${selInfo(v, me, { m, mode, targets })}
    ${ui.pass ? passPanel(v, me) : ''}
    <div class="acts">${ACTS.map(btn).join('')}</div>
    <button class="tb gold block" data-act="endturn" ${ui.busy ? 'disabled' : ''}>${ui.busy === 'endTurn' ? 'Ending…' : ui.confirmEnd ? `Tap again: end with ${left} action${left === 1 ? '' : 's'} left` : 'End my turn'}</button>
    ${me.water === 0 ? zeroWater() : ''}` };
}

// The hex you tapped: what is there, and what you can do with it.
function selInfo(v, me, c) {
  const i = ui.sel;
  if (i == null || !v.hexes[i]) return `<div class="selbar"><span>${loc(me.pos)}</span><small>You stand here: ${hexWhat(v, me.pos)}.</small></div>`;
  const who = v.players.filter(p => p.pos === i).map(p => p.id === me.id ? 'you' : esc(p.name));
  let act = '';
  if (c && !c.mode && (c.m.one.includes(i) || c.m.two.includes(i))) {
    const mates = has(me, 8) && me.pos !== 0 ? v.players.filter(q => q.id !== me.id && q.pos === me.pos) : [];
    act = `<button class="tb block sm" data-act="move" data-i="${i}" ${ui.busy ? 'disabled' : ''}>${A.icon('move', 30)} ${ui.busy === 'move' ? 'Moving…' : 'Move here'}${c.m.two.includes(i) ? ' (2 hexes)' : ''}</button>
      ${mates.length ? `<p class="small">${A.role(8, 22)} ${mates.map(q => esc(q.name)).join(', ')} come${mates.length === 1 ? 's' : ''} along.</p>` : ''}`;
  } else if (c && c.mode && c.targets.has(i)) {
    act = `<button class="tb block sm" data-act="target" data-i="${i}" ${ui.busy ? 'disabled' : ''}>${A.icon(c.mode, 30)} ${ACT_NAME[c.mode]} here</button>`;
  }
  return `<div class="selbar"><span>${loc(i)}</span><small>${hexWhat(v, i)}${who.length ? ` · ${who.join(', ')}` : ''}</small>${act}</div>`;
}

// Passing is free until you end your turn: water, fruit or a treasure to a teammate you can reach.
function passOption(v, me) {
  const holds = me.water > 0 || me.fruit > 0 || !!me.treasure, mates = v.players.some(q => R.canPass(v, me, q));
  return { ok: holds && mates, why: !holds ? 'nothing to pass' : R.chainOf(v, me) ? 'nobody on your hex or next to it' : 'nobody on your hex' };
}
function passPanel(v, me) {
  const mates = v.players.filter(q => R.canPass(v, me, q));
  const item = (q, k, art, ok) => `<button class="pitem" data-act="give" data-to="${esc(q.id)}" data-item="${k}" ${ok && !ui.busy ? '' : 'disabled'} aria-label="Pass ${k} to ${esc(q.name)}">${art}</button>`;
  return `<div class="passp"><p class="small"><b>Pass</b> (free): tap what to give.</p>${mates.map(q => `<div class="prow">${medal(q, 'pass' + q.id, 40)}<span>${esc(q.name)}</span>
    ${item(q, 'water', A.drop(26), me.water > 0 && q.water < HW.MAX_WATER)}${item(q, 'fruit', A.fruit(26), me.fruit > 0 && q.fruit < HW.MAX_FRUIT)}${item(q, 'treasure', me.treasure ? A.treasure(me.treasure, 26) : EMPTY(24), !!me.treasure && !q.treasure)}</div>`).join('')}</div>`;
}
const zeroWater = () => `<div class="alert"><span style="filter:grayscale(1);opacity:.6;line-height:0">${A.drop(30)}</span><span>0 water. You can't move until a teammate on your hex passes you 1 water.</span></div>`;

function sharePanel(v, me) {
  const s = v.share, isMe = s.player === me.id, sp = player(s.player);
  const who = isMe ? 'You' : esc(sp?.name || '?');
  const timer = v.timerEnd || v.timerWait ? `<div class="timer">${A.icon('timer', 26)}<span data-timer></span></div>` : '';
  if (s.kind === 'treasure') {
    const t = treasureOf(s.sub);
    return { cls: 'gold', color: '#d68a12', html: `${sign('Group moment', '#f2a62a')}
      <div class="tbox"><div class="rays"></div>${t ? A.treasure(t.id, 92) : MYSTERY(80)}</div>
      <h2 class="tname">${esc(t?.name || 'A treasure')}</h2>
      ${t?.meaning ? `<p class="meaning">${esc(t.meaning)}</p>` : ''}
      <p class="small center">${s.by ? (s.by === me.id ? 'You' : esc(player(s.by)?.name || '?')) : who} found it. Everyone answers in one sentence, one at a time${s.of ? ` (${s.seq} of ${s.of})` : ''}.</p>
      <p class="center"><b>${isMe ? 'Your turn: answer in one sentence.' : `Now: ${who}`}</b></p>
      <div class="prompt">${esc(s.prompt)}</div>${timer}
      ${trustBlock(v, me, s, isMe)}` };
  }
  let color = '#8a5a2c', label = 'Share', sticker = '', title = '';
  if (s.kind === 'why') {
    const vi = sp?.value ?? -1, x = v.values[vi];
    color = x?.color || color; label = x ? `Why ${esc(x.name)}` : 'Why';
    sticker = vi >= 0 ? A.value(vi, 64) : '';
    title = isMe ? `Tell everyone why you stand for ${esc(x?.name || 'your value')}.` : `${who} tells why they stand for ${esc(x?.name || 'their value')}.`;
  } else if (s.kind === 'ring') {
    const r = +s.sub || 0, deck = deckName(r);
    color = DECK_COLOR[r] || color; label = `${deck ? esc(deck) + ' · ' : ''}Ring ${r}`;
    sticker = DECK(r, 66);
    title = isMe ? `Your ${esc(deck)} card from Ring ${r}.` : `${who} reached Ring ${r}.`;
  } else if (s.kind === 'harvest') {
    color = '#e8344f'; label = 'Harvest';
    sticker = A.fruit(60);
    title = isMe ? 'Your harvest story.' : `${who} tells a harvest story.`;
  } else if (s.kind === 'heartwood') {
    color = '#4f8a3c'; label = 'Heartwood';
    sticker = treeScene({ awake: false, treasures: v.goals.treasures, fruit: placedFruit(v) }, 76);
    title = isMe ? 'Your Heartwood question.' : `${who} answers a Heartwood question.`;
  } else {
    title = isMe ? 'Your turn to share.' : `${who} is sharing.`;
  }
  const sub = (s.kind === 'harvest' || s.kind === 'why') && s.sub ? `<p class="tagline">${esc(s.sub)}</p>` : '';
  // "Not this one": the one sharing may swap a ring or Heartwood card for another from the same deck
  const swap = isMe && (s.kind === 'ring' || s.kind === 'heartwood')
    ? `<button class="tb cream sm block" data-act="another" ${ui.busy ? 'disabled' : ''}>${ui.busy === 'another' ? 'Drawing…' : '↻ Not this one: another question'}</button>` : '';
  return { cls: isMe ? 'hot' : '', color: isMe ? '' : color, html: `${sign(label, color)}<span class="sticker">${sticker}</span>
    <div class="sharehead">${medal(sp, 'sharer', 64, { state: isMe ? 'turn' : '' })}<p class="lead">${title}</p></div>
    ${s.prompt ? `<div class="prompt">${esc(s.prompt)}</div>` : ''}${swap}${sub}${timer}
    ${trustBlock(v, me, s, isMe)}` };
}

// The trust acorn: one per share for listeners, from their 10.
function trustBlock(v, me, s, isMe) {
  const left = Math.max(0, me.trustLeft ?? 0), total = Math.max(10, left);
  const row = `<div class="acornrow" role="img" aria-label="${left} trust acorn${left === 1 ? '' : 's'} left">${Array.from({ length: total }, (_, i) => `<span class="${i < left ? '' : 'off'}">${A.acorn(24)}</span>`).join('')}</div>`;
  const off = why => `<button class="acornbtn" disabled><span class="nut">${A.acorn(60)}</span><span>Give trust</span></button><p class="why-off">${why}</p>`;
  if (s.kind === 'treasure') return `<div class="trust">${off('A group moment: everyone answers, no acorns this time.')}</div>`;
  if (isMe) return `<div class="trust">${off("You're sharing, so the others give the acorns. Phone down, speak to the table; the Keeper closes the share when you're done.")}</div>`;
  if (s.iGave) return `<div class="trust"><div class="given">${A.acorn(60)}<div><b>Trust given!</b><span>You gave ${esc(pname(s.player))} 1 trust acorn.</span></div></div>${row}
    <p class="small">${left} acorn${left === 1 ? '' : 's'} left</p></div>`;
  return `<div class="trust"><button class="acornbtn" data-act="trust" ${left < 1 || ui.busy ? 'disabled' : ''}><span class="nut">${A.acorn(60)}</span><span>${ui.busy === 'trust' ? 'Giving…' : 'Give trust'}</span></button>${row}
    <p class="small">${left < 1 ? 'No acorns left to give.' : `${left} acorn${left === 1 ? '' : 's'} left`} · Trust is a gift, not a grade. Give it if this share moved you.</p></div>`;
}

function packPanel(v, me) {
  const tr = me.treasure ? treasureOf(me.treasure) : null;
  const h = v.hexes[me.pos];
  let where = '';
  if (h && h.ring === 0) where = `<div class="where">${treeScene({ awake: false, treasures: v.goals.treasures, fruit: placedFruit(v) }, 44)}<span>You stand on <b>the World Tree</b>.</span></div>`;
  else if (h) {
    const w = v.weather?.[h.sector];
    where = `<div class="where">${A.value(h.sector, 32)}<span>You stand in <b>${esc(valueOf(h.sector)?.name || '')}</b> · Ring ${h.ring}</span>${WX[w] ? `<span class="wxc">${A.wx(w, 34)}${WX[w]}</span>` : ''}</div>`;
  }
  const ring = r => `<span class="chip ${me.reached[r - 1] ? 'ok' : ''}">${me.reached[r - 1] ? CHECK(14) : ''}${esc(deckName(r))} · Ring ${r}</span>`;
  return `${sign('Your pack', '#c98a44')}
    <div class="pack">
      <div class="slot ${me.water === 0 ? 'zero' : ''}"><div class="si">${A.drop(36)}</div><b>${me.water ?? 0}<small>/5</small></b><span>water</span></div>
      <div class="slot"><div class="si">${A.fruit(36)}</div><b>${me.fruit ?? 0}<small>/2</small></b><span>fruit</span></div>
      <div class="slot ${tr ? '' : 'none'}"><div class="si">${tr ? A.treasure(tr.id, 34) : EMPTY(32)}</div><b class="tn">${tr ? esc(shortTreasure(tr)) : 'empty'}</b><span>treasure</span></div>
    </div>
    <div class="chips"><span class="chip ${me.placed ? 'ok' : ''}">${me.placed ? CHECK(14) : ''}Fruit placed${me.placed > 1 ? ` ×${me.placed}` : ''}</span>${[3, 2, 1].map(ring).join('')}</div>
    ${where}`;
}

function privatePanel(v, me, mv) {
  let h = '';
  if (has(me, 5)) {
    h += `<div class="sec"><div class="sech">${A.role(5, 36)}<b>Investigator</b></div>`;
    const br = mv.breath;
    h += br.length ? `<div class="breath"><p class="bt">${A.icon('clear', 28)}<span>The next Forest Breath drops dead leaves on:</span></p>${breathRows(v, br)}</div>`
      : `<p class="small">The next Forest Breath list isn't known yet.</p>`;
    if (mv.weatherPeek) {
      const w = mv.weatherPeek.weather;
      h += `<div class="note new">${A.wx(w, 44)}<span>Next weather in ${valueBadgeText(mv.weatherPeek.sector)}<b class="wxn">${esc(WX[w] || w || '?')}</b></span></div>`;
    }
    const myTurn = HW.playing(v, me);
    if (myTurn && !HW.turnOf(v, me).investigated) {
      h += `<p style="margin:12px 0 2px"><b>Investigate:</b> look at one sector's next weather (once a round).</p>
        <div class="sectors">${v.values.map((x, s) => `<button class="sbtn" data-act="investigate" data-n="${s}" ${v.share || ui.busy ? 'disabled' : ''}>${A.value(s, 36)}<span>${esc(x.name)}</span></button>`).join('')}</div>
        ${v.share ? '<p class="small">You can look after the share closes.</p>' : ''}`;
    } else if (myTurn) {
      h += `<p class="small">You've looked this round.</p>`;
    } else if (!mv.weatherPeek) {
      h += `<p class="small">During your own turn you can look at one sector's next weather, once a round.</p>`;
    }
    h += '</div>';
  }
  return h ? sign('Just for you', '#7a5aa8') + h : '';
}
const valueBadgeText = s => `<span class="loc">${A.value(s, 22)}${esc(valueOf(s)?.name || '?')}</span>`;
// The Breath list grouped by hex: two drifts on one hex, or one on a hex that has
// leaves already, seal it; a young plant there drops a stage.
function breathRows(v, br) {
  const n = new Map();
  for (const b of br) n.set(b.to, (n.get(b.to) || 0) + 1);
  return [...n].map(([to, k]) => {
    const t = v.tiles[to] || {}, now = t.leaves || 0;
    const tag = now >= 2 ? '<span class="tagx seal">sealed</span>' : now + k >= 2 ? '<span class="tagx seal">seals it</span>'
      : t.up && t.stage >= 1 && t.stage <= 3 ? `<span class="tagx risk">${esc(v.stages[t.stage])} at risk</span>` : '';
    return `<div class="brow"><span>${loc(to)}</span>${k > 1 ? `<b class="x2">×${k}</b>` : ''}${tag}</div>`;
  }).join('');
}

function rolesPanel(v, me) {
  if (!me.types.length) return `${sign('Your roles', '#3f9e9a')}<p class="small">The Keeper will give you 1 to 3 Enneagram types before the start.</p>`;
  return `${sign('Your roles', '#3f9e9a')}
    ${me.types.map(t => { const r = roleOf(t); return `<div class="role">${A.role(t, 52)}<div><b>${t} · ${esc(r?.name || '')}</b><span>${esc(r?.text || '')}</span></div></div>`; }).join('')}
    <p class="small">Always on: they work by themselves when you play.</p>`;
}

// How the game ended, for the guess and chain screens.
function resultLine(v) {
  if (v.result === 'won') return `<div class="resline">${A.icon('tend', 28)}<span>The forest woke. You did it together.</span></div>`;
  if (v.result === 'lost') return `<div class="resline sleep">${A.drop(24)}<span>The team ran dry this time.</span></div>`;
  if (v.result === 'ended') return `<div class="resline sleep">${A.icon('timer', 26)}<span>The Keeper closed the game; the forest is still asleep.</span></div>`;
  return '';
}

function guessPanel(v, me, mv) {
  const others = v.players.filter(p => p.id !== me.id);
  const done = v.players.filter(p => p.guessed).length;
  if (!ui.guessPick || !others.some(p => p.id === ui.guessPick)) ui.guessPick = mv.guess || '';
  const changed = ui.guessPick && ui.guessPick !== mv.guess;
  let h = `${sign('The forest is quiet', '#7a5aa8')}${resultLine(v)}
    <p class="lead">Who was <u>your</u> Secret Owl?</p>
    <p class="small">Someone watched you all game. Tap who you think it was.</p>
    <div class="picks">${others.map(p => { const sel = ui.guessPick === p.id;
      return `<button class="pick ${sel ? 'sel' : ''}" data-act="pick" data-id="${esc(p.id)}" aria-pressed="${sel}">${medal(p, 'g' + p.id, 50)}<span>${esc(p.name)}</span>${mv.guess === p.id ? '<em>your guess</em>' : ''}${sel ? CHECK(22, '#8a5418') : ''}</button>`; }).join('')}</div>`;
  if (!mv.guess || changed) h += `<button class="tb gold block huge" data-act="guess" ${!ui.guessPick || ui.busy ? 'disabled' : ''}>${ui.busy === 'guess' ? 'Sending…' : mv.guess ? 'Change my guess' : 'Lock in my guess'}</button>`;
  if (mv.guess) h += `<p class="lead" style="margin-top:14px">You guessed ${esc(pname(mv.guess))}.</p>

// ---------- your photo ----------
// After joining, a "Take your photo" step; later "Your photo" (tap your medallion)
// to change or remove it until the game ends. The phone crops and scales it to a
// 320×320 JPEG, so the server never sees the full camera picture.
const OUT = 320, MAX_ZOOM = 4, CROP = .74;   // the round window is 74% of the stage, leaving room for the crown
const P = { mode: '', auto: false, err: '', busy: false, confirm: false, src: null, W: 0, H: 0, zoom: 1, cx: 0, cy: 0, size: 0, C: 0, dpr: 1, raf: 0, key: '' };

const PRIVACY = `<p class="privacy">${LOCK(18)}<span>Your photo is only shown in this game and deleted after it ends.</span></p>`;

function openPhoto(auto) {
  if (!me0()) return;

}
function closePhoto(skip) {

// Keep the sheet's preview in step with the live view (a new photo, a colour, water).
function photoViewChanged(v) {
  const me = me0();

  const key = [me.photo, me.color, me.name, me.water, v.result].join('|');
  // The automatic step steps aside when the game starts, unless you're mid-crop.
  if (P.auto && P.mode === 'intro' && !P.busy && v.phase !== 'lobby') return closePhoto();
  if (key === P.key) return;
  P.key = key;
  if (P.mode === 'intro' && !P.busy) photoIntro();

function photoIntro() {

    <div class="sheetmed">${medal(me, 'sheet', 210)}</div>
