<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartwood Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div id="entry" hidden>
    <div class="panel" id="seatsBox" hidden></div>
    <div class="panel" id="joinBox">
      <h1>🌰 Join game <span id="joinCode"></span></h1>
      <div id="joinOpen">
        <label for="name">Your name</label><input id="name" maxlength="20" autocomplete="off">
        <label>Your colour</label><div class="swatches" id="swatches"></div>
        <label>Your top three Enneagram types, in order. Each gives you a power you can use once.</label>
        <div class="types" id="types"></div>
        <p><button data-act="join">Join the expedition</button></p>
      </div>
      <p id="joinClosed" class="muted" hidden>This game has already started. If you were playing, continue below or ask the Keeper for a rejoin code.</p>
    </div>
    <div class="panel">
      <h3>Rejoin with a code</h3>
      <p class="muted">Lost your seat (new phone, closed browser)? The Keeper can give you a 4-digit code.</p>
      <div class="row"><input id="pin" inputmode="numeric" maxlength="4" placeholder="1234" style="flex:1"><button class="ghost" data-act="rejoin">Rejoin</button></div>
    </div>
    <p class="muted"><a href="howto.html">How to play</a> · <a href="wiki.html">Wiki</a></p>
  </div>

  <div id="game" hidden>
    <div class="panel" id="top"></div>
    <div class="panel" id="action"></div>
    <div class="panel" id="boardp" hidden><svg class="board" id="svg"></svg><div class="legend" id="legend"></div></div>
    <div class="panel" id="secret" hidden></div>
    <div class="panel"><h3>Your powers</h3><div id="powers"></div></div>
    <p class="muted"><a href="howto.html" target="_blank">How to play</a> · <a href="wiki.html" target="_blank">Wiki</a></p>
  </div>
</div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

// Seats this device holds for this game, one localStorage key each
// (hw-seat-CODE-PID), so tabs joining at the same time can't overwrite each
// other. The seat in use is in the URL (?p=…), so each tab can be a different
// player and a reload keeps the same one.
const seatPrefix = `hw-seat-${HW.code}-`;
function loadSeats() {
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(seatPrefix)) { try { out[k.slice(seatPrefix.length)] = JSON.parse(localStorage.getItem(k)); } catch {} }
  }
  return out;
}
const putSeat = (pid, seat) => localStorage.setItem(seatPrefix + pid, JSON.stringify(seat));
const dropSeat = pid => localStorage.removeItem(seatPrefix + pid);
// Earlier versions kept seats in one shared key.
for (const k of ['hw-seats-' + HW.code, 'hw-p-' + HW.code]) {
  const old = JSON.parse(localStorage.getItem(k) || 'null');
  if (!old) continue;
  if (old.pid) putSeat(old.pid, { secret: old.secret, name: '' });
  else for (const [id, seat] of Object.entries(old)) if (!loadSeats()[id]) putSeat(id, seat);
  localStorage.removeItem(k);
}

let creds = null;
const pid = params.get('p');
const mySeat = pid && loadSeats()[pid];
if (mySeat) creds = { pid, secret: mySeat.secret };

const joinState = { color: '', types: [] };
const keep = {};      // dropdown choices not yet sent, so a redraw doesn't reset them
let keepScope = '';
let busy = false;

function takeSeat(r) {
  putSeat(r.pid, { secret: r.secret, name: r.name });
  creds = { pid: r.pid, secret: r.secret };
  params.set('p', r.pid);
  history.replaceState(null, '', `${location.pathname}?${params}`);
  HW.view = null;
  HW.reconnect(creds);
}

function render(v) {
  if (creds && !v.me) {
    // Our seat is gone (removed in the lobby) or this view isn't ours yet.
    if (v.players.every(p => p.id !== creds.pid)) {
      dropSeat(creds.pid); creds = null;
      params.delete('p'); history.replaceState(null, '', `${location.pathname}?${params}`);
      HW.reconnect({});
    }
    return renderEntry(v);
  }
  if (!v.me) return renderEntry(v);
  $('entry').hidden = true; $('game').hidden = false;
  renderGame(v);
}

// ---------- join / continue / rejoin ----------
function renderEntry(v) {
  $('entry').hidden = false; $('game').hidden = true;
  $('joinCode').textContent = v.code;
  const mine = Object.entries(loadSeats()).filter(([id]) => v.players.some(p => p.id === id));
  $('seatsBox').hidden = !mine.length;
  HW.patch($('seatsBox'), `<h3>Continue on this device</h3>` + mine.map(([id]) =>
    `<button class="ghost seat" data-act="seat" data-pid="${id}">Continue as ${HW.chip(id)}</button>`).join(''));
  const open = v.phase === 'lobby';
  $('joinOpen').hidden = !open; $('joinClosed').hidden = open;
  if (!open) return;
  const taken = new Set(v.players.map(p => p.color));
  if (taken.has(joinState.color)) joinState.color = '';
  HW.patch($('swatches'), v.colors.map(c =>
    `<button style="background:${c}" data-act="color" data-c="${c}" class="${joinState.color === c ? 'sel' : ''}" ${taken.has(c) ? 'disabled' : ''} aria-label="colour ${c}"></button>`).join(''));
  HW.patch($('types'), v.powers.map(p => {
    const rank = joinState.types.indexOf(p.type);
    return `<button data-act="type" data-t="${p.type}" class="${rank >= 0 ? 'sel' : ''}">${rank >= 0 ? `<b class="rank">#${rank + 1}</b>` : ''}
      <b>${p.type} ${p.name}</b> · ${p.title}<br><small>${HW.esc(p.text)}</small></button>`;
  }).join(''));
}

// ---------- game ----------
function renderGame(v) {
  const me = HW.player(v.me.id), mv = v.me;
  const scope = `${v.phase}|${v.season}|${v.turn?.player || ''}`;
  if (scope !== keepScope) { keepScope = scope; for (const k in keep) delete keep[k]; }

  HW.patch($('top'), `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${HW.chip(me.id)}</h2><span class="muted">${HW.esc(HW.phaseTitle(v))}</span></div>
    <div class="stats" style="margin-top:.6em">
      <span title="Sunlight">☀ ${me.sun}</span><span title="Water">💧 ${me.water}</span>
      <span title="Trust acorns left to give">🌰 ${me.trustLeft} to give</span>
      <span title="Bonus points">✨ ${me.bonus}</span>${me.squirrels ? `<span title="Squirrels: follow-up questions">🐿️ ${me.squirrels}</span>` : ''}
    </div>
    <p class="muted" style="margin:.5em 0 0">Trust received: <b>${mv.potCount}</b> from ${mv.potGivers} people · Allies: ${me.allies.map(a => HW.chip(a)).join(' ') || 'none yet'}</p>
    <div class="timer" data-timer></div>${HW.forestHTML(v)}`);
  patchKeep($('action'), actionPanel(v, me, mv));

  const showBoard = ['plant', 'turn'].includes(v.phase);
  $('boardp').hidden = !showBoard;
  if (showBoard) {
    HW.renderBoard($('svg'), boardOpts(v, me, mv));
    HW.patch($('legend'), v.regions.map((r, i) => `<span><i style="background:${HW.regionColors[i]}"></i>${HW.regionIcons[i]} ${r}</span>`).join(''));
  }

  const showSecret = v.phase !== 'lobby' && v.phase !== 'scores';
  $('secret').hidden = !showSecret;
  if (showSecret) HW.patch($('secret'), `<h3>🦉 You're the Secret Owl for…</h3><p>Watch <span class="secret" data-act="reveal">${HW.esc(mv.targetName || '')}</span> <small>(tap to reveal)</small> quietly today. Notice something they love, something that shaped them, something they hope for.</p>`);
  patchKeep($('powers'), me.types.map(t => powerCard(v, me, t)).join(''));
}

// Patch a section, then put back any dropdown choices the player hadn't sent yet.
function patchKeep(el, html) {
  if (!HW.patch(el, html)) return;
  el.querySelectorAll('select[data-keep]').forEach(s => {
    const k = s.dataset.keep;
    if (k in keep && [...s.options].some(o => o.value === keep[k])) s.value = keep[k];
  });
}
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-keep]');
  if (s) keep[s.dataset.keep] = s.value;
});

function boardOpts(v, me, mv) {
  const opts = { highlight: new Set(), peek: mv.peek || {}, compact: true };
  if (v.phase === 'plant' && v.current === me.id) {
    v.hexes.forEach((h, i) => { if (h.ring === 3) opts.highlight.add(i); });
    opts.onClick = i => opts.highlight.has(i) && send('plant', { hex: i });
  }
  const t = v.turn;
  if (v.phase === 'turn' && t && t.player === me.id && t.step === 'move') {
    const here = v.hexes[me.pos];
    v.hexes.forEach((h, i) => {
      if (t.teleport) { if (h.ring === here.ring && HW.ringOpen(h.ring)) opts.highlight.add(i); }
      else if (!t.discovered && HW.dist(h, here) === 1 && HW.ringOpen(h.ring) && (h.ring !== 0 || me.allies.length)) opts.highlight.add(i);
    });
    opts.onClick = i => opts.highlight.has(i) && send('step', { hex: i });
  }
  return opts;
}

function actionPanel(v, me, mv) {
  const t = v.turn;
  switch (v.phase) {
    case 'lobby': return `<p class="big">You're in. Waiting for the Keeper to start…</p><p class="muted">While you wait, read <a href="howto.html" target="_blank">how to play</a>.</p>`;
    case 'plant':
      return v.current === me.id
        ? `<p class="big">Plant your seed: tap an outer space below, in the value you identify with most.</p><p class="muted">Then tell everyone why, in one sentence.</p>`
        : `<p>${HW.chip(v.current)} is planting their seed.</p>`;
    case 'turn': return t.player === me.id ? myTurn(v, me, mv, t) : othersTurn(v, me, mv, t);
    case 'dusk': return duskPanel(v, me, mv);
    case 'guess': {
      const opts = v.players.filter(p => p.id !== me.id).map(p => `<option value="${p.id}" ${mv.guess === p.id ? 'selected' : ''}>${HW.esc(p.name)}</option>`).join('');
      return `<p class="big">Who was <b>your</b> Secret Owl?</p>
        <select id="guess" data-keep="guess"><option value="">Choose…</option>${opts}</select>
        <p><button data-act="guess">${mv.guess ? 'Change my guess' : 'Lock in my guess'}</button></p>
        ${mv.guess ? `<p class="good">You guessed ${HW.esc(HW.name(mv.guess))}.</p>` : ''}`;
    }
    case 'chain': {
      const tr = v.tribute;
      if (tr.receiver === me.id) return `<p class="big">${HW.chip(tr.giver)} is honouring you.</p>
        <p>How many of the three things they discovered about you are true?</p>
        <div class="row">${[0, 1, 2, 3].map(n => `<button data-act="confirm" data-n="${n}">${n}</button>`).join('')}</div>
        <p class="muted">Then it's your turn to honour the person you watched.</p>`;
      if (tr.giver === me.id) return `<p class="big">Your tribute to ${HW.chip(tr.receiver)}</p>
        <p>Three things you discovered about them today, and one thing you appreciate. Then hand them an acorn: your trust. 🌰</p>`;
      return `<p class="big">${HW.chip(tr.giver)} → ${HW.chip(tr.receiver)}</p><p class="muted">Listen.</p>`;
    }
    case 'scores': return HW.scoresTable(v);
  }
  return '';
}

function myTurn(v, me, mv, t) {
  let h = `<h2>Your turn</h2>`;
  if (t.eventText) h += `<div class="event">${HW.esc(t.eventText)}${t.helped ? ` <b>${HW.esc(HW.name(t.helped))} helped!</b>` : ''}</div>`;
  if (t.step === 'move') {
    if (t.teleport) return h + `<p>Tap any highlighted space in this ring, or stay.</p><button data-act="endMove">Stay here</button>`;
    if (t.canClaim) {
      h += `<p>Field Notes: claim one discovery next to you.</p><div class="row">${Object.entries(mv.peek).map(([i, k]) =>
        `<button class="ghost" data-act="claim" data-hex="${i}">${HW.tokenIcons[k]} ${k}</button>`).join('')}</div>`;
    }
    // Who you'd be next to if you stopped here: the people you could ally with at Dusk.
    const here = v.hexes[me.pos];
    const near = v.players.filter(p => p.id !== me.id && HW.dist(v.hexes[p.pos], here) <= 1);
    h += `<p class="muted">${near.length ? `Stopping here, you're next to ${near.map(p => HW.chip(p.id)).join(' ')}: you could ally with them at Dusk.` : 'No one is next to this space yet.'}</p>`;
    h += `<p>Tap a highlighted neighbouring space to step. Each step costs 1 ☀; stepping inward to the Sapling Path costs +1 ☀; into the Oak Circle 1 💧; the Heartwood needs an ally.${t.freeSteps ? ` <b>${t.freeSteps} free steps left.</b>` : ''}</p>
      <button data-act="endMove">${t.discovered ? 'Draw my card' : 'Stop here and discover'}</button>`;
    return h;
  }
  if (t.step === 'share') {
    h += `<span class="tier">${HW.tierNames[t.tier]}${t.region >= 0 ? ' · ' + v.regions[t.region] : ''}</span>`;
    if (t.choices?.length) {
      return h + `<p>True North: choose your card.</p>` + t.choices.map((c, k) => `<button class="ghost seat" data-act="pick" data-card="${t.choiceIds[k]}">${HW.esc(c)}</button>`).join('');
    }
    h += `<div class="prompt" style="font-size:1.35rem">${HW.esc(t.prompt)}</div>`;
    if (!t.started) {
      h += `<div class="row"><button data-act="startShare">Start sharing</button>
        <button class="ghost" data-act="redraw" ${t.redrawn ? 'disabled' : ''}>Draw again</button>
        <button class="ghost" data-act="lighter" ${t.tier <= 1 || t.tier >= 4 ? 'disabled' : ''}>Lighter tier</button></div>
        <p class="muted">Passing is always free: draw again, take a lighter question, or <button class="ghost" data-act="pass" style="padding:.3em .7em">pass this turn</button> (no card, no points, no questions asked).</p>`;
    } else h += `<button data-act="doneShare">I'm done sharing</button>`;
    return h;
  }
  if (t.step === 'trust') {
    return h + `<p class="big">🌰 ${t.trustCount} trust given so far.</p>${t.followUps.map(f => `<div class="event">🐿️ ${HW.esc(f)}</div>`).join('')}
      <button data-act="endTrust">Pass to the next player →</button>`;
  }
  return h;
}

function othersTurn(v, me, mv, t) {
  let h = `<p>${HW.chip(t.player)}'s turn</p>`;
  if (t.eventText) h += `<div class="event">${HW.esc(t.eventText)}</div>`;
  if (t.needsHand && !t.helped) h += `<button class="ghost" data-act="help" ${me.sun < 1 ? 'disabled' : ''}>Give 1 ☀ to help (+2 ✨ each)</button>`;
  if (t.step === 'share' || t.step === 'trust') {
    h += `<span class="tier">${HW.tierNames[t.tier]}</span><div class="prompt" style="font-size:1.25rem">${HW.esc(t.prompt)}</div>`;
  }
  if (t.step === 'trust') {
    h += t.iGave ? `<p class="good">You gave trust. 🌰</p>`
      : `<button data-act="trust" class="big" ${me.trustLeft < 1 ? 'disabled' : ''}>Give trust 🌰 (${me.trustLeft} left)</button>
         <p class="muted">Trust is a gift, not a grade. Give it if this share moved you.</p>`;
    if (me.squirrels > 0) h += `<button class="ghost" data-act="squirrel">🐿️ Ask a follow-up</button>`;
  }
  return h;
}

function duskPanel(v, me, mv) {
  if (v.dusk.resolved) {
    const pr = v.dusk.pairs.find(p => [p.a, p.b, p.c].includes(me.id));
    if (!pr) return '<p>Rest by the fire.</p>';
    const others = [pr.a, pr.b, pr.c].filter(x => x && x !== me.id).map(x => HW.chip(x)).join(' & ');
    return `<p class="big">You're with ${others} ${pr.ally ? '<span class="badge">ALLIANCE</span>' : '<span class="muted">(fireside: +1 💧)</span>'}</p>
      ${pr.note ? `<p class="note">${HW.esc(pr.note)}</p>` : ''}
      <div class="prompt" style="font-size:1.3rem">${HW.esc(pr.bond)}</div><p class="muted">Talk for 4 minutes.</p>`;
  }
  const choice = mv.duskChoice || {};
  const here = v.hexes[me.pos];
  const opts = v.players.filter(p => p.id !== me.id).map(p => {
    const near = HW.dist(v.hexes[p.pos], here) <= 1;
    const done = me.partners.includes(p.id);
    return `<option value="${p.id}" ${choice.partner === p.id ? 'selected' : ''} ${done ? 'disabled' : ''}>${HW.esc(p.name)}${near ? ' · nearby' : ''}${done ? ' · already talked' : ''}${me.allies.includes(p.id) ? ' · ally' : ''}</option>`;
  }).join('');
  return `<p class="big">Dusk: who do you want to talk with?</p>
    <select id="partner" data-keep="partner"><option value="">Anyone (the Keeper pairs me)</option>${opts}</select>
    <label><input type="checkbox" id="ally" style="width:auto" ${choice.ally ? 'checked' : ''}> Make it an alliance (1 💧 each; you must be on the same or a neighbouring space${mv.common ? ', or not, thanks to Common Ground' : ''})</label>
    <p><button data-act="dusk">${mv.duskChoice ? 'Update my choice' : 'Send my choice'}</button></p>
    ${mv.duskChoice ? `<p class="good">Sent: ${mv.duskChoice.partner ? HW.esc(HW.name(mv.duskChoice.partner)) : 'anyone'}${mv.duskChoice.ally ? ', as an alliance' : ''}.</p>` : ''}
    <p class="muted">You pair only if you both choose each other. +3 points each for an alliance.</p>`;
}

function powerCard(v, me, type) {
  const p = v.powers[type - 1], used = me.used?.[type];
  let extra = '';
  if (type === 2) extra = `<select data-keep="p2t" data-ptarget="2">${v.players.filter(x => x.id !== me.id).map(x => `<option value="${x.id}">${HW.esc(x.name)}</option>`).join('')}</select>
    <select data-keep="p2r" data-pres="2"><option value="sun">2 ☀</option><option value="water">2 💧</option></select>`;
  if (type === 6) extra = me.allies.length ? `<select data-keep="p6t" data-ptarget="6">${me.allies.map(a => `<option value="${a}">${HW.esc(HW.name(a))}</option>`).join('')}</select>` : '<small>You need an ally first.</small>';
  return `<div class="power ${used ? 'used' : ''}"><h3>${p.title} <small>· ${p.type} ${p.name}, ${p.gift}</small></h3>
    <div>${HW.esc(p.text)}</div><small>When: ${HW.esc(p.when)}</small>
    ${used ? '<div><b>Used</b></div>' : `<div class="row" style="margin-top:.4em">${extra}<button class="ghost" data-act="power" data-power="${type}">Activate</button></div>`}</div>`;
}

// ---------- taps ----------
async function send(type, extra) {
  if (busy) return;
  busy = true;
  try { await HW.act(creds, type, extra); } finally { busy = false; }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case 'reveal': b.classList.toggle('secret'); return;
    case 'color': joinState.color = d.c; return render(HW.view);
    case 'type': {
      const t = +d.t, i = joinState.types.indexOf(t);
      if (i >= 0) joinState.types.splice(i, 1);
      else if (joinState.types.length < 3) joinState.types.push(t);
      else HW.toast('You already have three. Tap one to remove it.');
      return render(HW.view);
    }
    case 'join':
      try { takeSeat(await HW.post(`/api/games/${HW.code}/join`, { name: $('name').value, color: joinState.color, types: joinState.types })); }
      catch (err) { HW.toast(err.message); }
      return;
    case 'rejoin':
      try { takeSeat(await HW.post(`/api/games/${HW.code}/rejoin`, { pin: $('pin').value })); }
      catch (err) { HW.toast(err.message); }
      return;
    case 'seat': { const seat = loadSeats()[d.pid]; if (seat) takeSeat({ pid: d.pid, ...seat }); return; }
    case 'claim': return send('claim', { hex: +d.hex });
    case 'pick': return send('pickChoice', { card: +d.card });
    case 'confirm': return send('confirm', { n: +d.n });
    case 'guess': return send('guess', { target: $('guess').value });
    case 'dusk': return send('duskChoice', { target: $('partner').value, ally: $('ally').checked });
    case 'power': {
      const t = +d.power;
      const target = document.querySelector(`[data-ptarget="${t}"]`)?.value || '';
      const resource = document.querySelector(`[data-pres="${t}"]`)?.value || '';
      return send('power', { power: t, target, resource });
    }
    case 'pass':
      // Tap twice, so a stray tap doesn't pass.
      if (Date.now() - (window.passArmed || 0) > 3000) { window.passArmed = Date.now(); HW.toast('Tap "pass this turn" again to pass. No card, no points.'); return; }
      window.passArmed = 0;
      return send('pass');
    default: return send(d.act); // endMove, startShare, redraw, lighter, doneShare, endTrust, trust, squirrel, help
  }
});

HW.connect(creds || {}, render, msg => { $('entry').hidden = false; $('game').hidden = true; HW.toast(msg); });
</script>
</body>
</html>
