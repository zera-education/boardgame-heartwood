    <p class="small center">${ended ? "The game has ended, so photos can't be changed now." : hasPhoto ? 'Take a new one any time until the game ends.' : 'A quick selfie helps everyone find you on the board.'}</p>
    ${P.err ? `<div class="alert" role="alert">${esc(P.err)}</div>` : ''}
    ${ended ? '' : `<label class="tb block huge" for="photoCam" role="button" tabindex="0">${CAMERA(30)} ${hasPhoto ? 'Take a new photo' : 'Take a photo'}</label>
      <label class="tb cream block sm" for="photoPick" role="button" tabindex="0">Choose from my photos</label>`}
    ${hasPhoto ? (P.confirm ? `<button class="tb red block sm" data-ph="remove" ${P.busy ? 'disabled' : ''}>${P.busy ? 'Removing…' : 'Yes, remove my photo'}</button>`
      : `<button class="tb cream block sm" data-ph="ask-remove">Remove my photo</button>`) : ''}
    <button class="tb cream block sm" data-ph="${hasPhoto ? 'close' : 'skip'}">${hasPhoto ? 'Done' : 'Skip for now'}</button>
    ${PRIVACY}`;
}

function photoLoading() {
  P.mode = 'loading';
  $('sheetCard').innerHTML = `${sign('Your photo', '#c98a44')}<div class="loading">${CAMERA(56)}<span>Opening your photo…</span></div>${PRIVACY}`;
}
// The sheet shows the error in place (no toast on top of it).
function photoError(msg) { P.err = msg; photoIntro(); }

async function loadPhoto(file) {
  if (!file || !P.mode) return;
  P.err = '';
  if (file.type && !/^image\//i.test(file.type)) return photoError("That file isn't a photo. Pick a picture from your camera or your photos.");
  if (file.size > 40 * 1024 * 1024) return photoError('That photo is too big to open (over 40 MB). Try another one.');
  photoLoading();
  let src;
  try { src = await decodeToCanvas(file, 1600); }
  catch { return P.mode && photoError("We couldn't open that picture. Try a JPEG or PNG photo, or take a new one."); }
  if (!P.mode) return;   // closed while it was opening
  if (src.width < 40 || src.height < 40) return photoError('That picture is too small. Try a bigger photo.');
  // Start centred; on a tall selfie, a little above the middle, where faces are.
  Object.assign(P, { src, W: src.width, H: src.height, zoom: 1, cx: src.width / 2, cy: src.height * (src.height > src.width * 1.1 ? .42 : .5) });
  photoCrop();
}

// Decodes the file the right way up (EXIF orientation) into a canvas at most `max` pixels a side,
// so huge camera pictures stay light while you drag and zoom.
async function decodeToCanvas(file, max) {
  let img = null, url = '';
  if (window.createImageBitmap) {
    try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { img = null; }
    // A browser that ignores the option leaves a sideways camera photo sideways: then decode it as an <img>.
    if (img) {
      const j = await jpegInfo(file);
      if (j.orientation >= 5 && img.width === j.w && img.height === j.h && j.w !== j.h) { img.close?.(); img = null; }
    }
  }
  if (!img) {
    url = URL.createObjectURL(file);
    img = new Image();
    img.src = url;
    try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); throw e; }
  }
  try {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error('empty image');
    const k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally {
    if (img.close) img.close();
    if (url) URL.revokeObjectURL(url);
  }
}

// A JPEG's stored size and EXIF orientation, from its first 256 KB ({} for anything else).
async function jpegInfo(file) {
  try {
    const d = new DataView(await file.slice(0, 262144).arrayBuffer()), out = {};
    if (d.getUint16(0) !== 0xffd8) return out;
    for (let p = 2; p + 4 <= d.byteLength;) {
      const m = d.getUint16(p), len = d.getUint16(p + 2);
      if ((m & 0xff00) !== 0xff00) break;
      if (m === 0xffe1 && out.orientation == null && d.getUint32(p + 4) === 0x45786966) {   // "Exif"
        const t = p + 10, le = d.getUint16(t) === 0x4949, ifd = t + d.getUint32(t + 4, le);
        for (let i = 0, n = d.getUint16(ifd, le); i < n; i++) {
          const e = ifd + 2 + i * 12;
          if (d.getUint16(e, le) === 0x0112) out.orientation = d.getUint16(e + 8, le);
        }
      } else if (m >= 0xffc0 && m <= 0xffcf && ![0xffc4, 0xffc8, 0xffcc].includes(m)) {   // start of frame
        out.h = d.getUint16(p + 5); out.w = d.getUint16(p + 7);
        return out;
      }
      p += 2 + len;
    }
    return out;
  } catch { return {}; }
}

// The crop: a round window in a medallion ring; drag to move, pinch / slider / wheel to zoom.
function photoCrop() {
  const me = me0();
  if (!me || !P.src) return photoIntro();
  P.mode = 'crop';
  $('sheetCard').innerHTML = `${sign('Fit your face in the circle', '#c98a44')}
    <div class="stage" id="stage"><canvas id="cropc" aria-label="Your photo: drag to move it"></canvas>${ringOverlay(me)}</div>
    <p class="small center" style="margin:2px 0">Drag to move · pinch or slide to zoom</p>
    <div class="zoom"><button class="zbtn" data-ph="zout" aria-label="Zoom out">−</button><input type="range" id="zoom" min="1" max="${MAX_ZOOM}" step="0.01" value="${P.zoom}" aria-label="Zoom"><button class="zbtn" data-ph="zin" aria-label="Zoom in">+</button></div>
    ${P.err ? `<div class="alert" role="alert">${esc(P.err)}</div>` : ''}
    <button class="tb block huge" data-ph="use" ${P.busy ? 'disabled' : ''}>${P.busy ? 'Sending…' : `${CHECK(26)} Use this photo`}</button>
    <div class="row2"><label class="tb cream sm" for="photoCam" role="button" tabindex="0">${CAMERA(24)} Retake</label><button class="tb cream sm" data-ph="skip" ${P.busy ? 'disabled' : ''}>Skip</button></div>
    ${PRIVACY}`;
  bindStage();
}
// The medallion ring around the crop window, in the player's colour, with the water crown.
function ringOverlay(me) {
  const t = ART.tone(me.color || '#43a047', .5, .16, .16), R = CROP * 50, RW = 5.4, water = Math.max(0, Math.min(5, me.water ?? 0));
  const arc = (r, a0, a1) => { const p = a => [50 + r * Math.cos(a * Math.PI / 180), 50 + r * Math.sin(a * Math.PI / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };
  let s = `<circle cx="50" cy="50" r="${R + RW / 2}" fill="none" stroke="${t.o}" stroke-width="${RW + 2.6}"/><circle cx="50" cy="50" r="${R + RW / 2}" fill="none" stroke="${t.d}" stroke-width="${RW}"/>
    <circle cx="49.6" cy="49.5" r="${R + RW / 2 - .5}" fill="none" stroke="${t.l}" stroke-width="${RW * .5}"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${t.o}" stroke-width=".9"/>
    <path d="${arc(R + RW / 2, 200, 252)}" fill="none" stroke="#fff" stroke-width="1.5" opacity=".85" stroke-linecap="round"/>`;
  const dropD = 'M0,-3.24 C0.72,-1.92 2.4,-0.67 2.4,0.72 A2.4,2.4 0 0 1 -2.4,0.72 C-2.4,-0.67 -0.72,-1.92 0,-3.24Z';
  for (let i = 0; i < 5; i++) {
    const a = -150 + i * 30, rr = R + RW + 3.2, x = 50 + rr * Math.cos(a * Math.PI / 180), y = 50 + rr * Math.sin(a * Math.PI / 180), full = i < water;
    const d = full ? ART.tone('#3aa6f0', .52, .12, .2) : ART.tone('#3b4d5a', .4, .1, .05);
    s += `<g transform="translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${a + 90})"><path d="${dropD}" fill="${d.o}" stroke="${d.o}" stroke-width="1.6" stroke-linejoin="round"/><path d="${dropD}" fill="${d.d}"/>${full ? '<ellipse cx="-.8" cy="-.2" rx=".5" ry="1" fill="#fff" opacity=".85"/>' : ''}</g>`;
  }
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
}

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const cropScale = () => P.zoom * P.C / Math.min(P.W, P.H);          // screen px per source px
function clampCrop() {
  const half = P.C / 2 / cropScale();
  P.cx = clamp(P.cx, half, P.W - half);
  P.cy = clamp(P.cy, half, P.H - half);
}
function queueDraw() { if (!P.raf) P.raf = requestAnimationFrame(drawCrop); }
function drawCrop() {
  P.raf = 0;
  const cv = $('cropc');
  if (!cv || !P.src) return;
  const g = cv.getContext('2d'), N = P.size, s = cropScale();
  g.setTransform(P.dpr, 0, 0, P.dpr, 0, 0);
  g.fillStyle = '#16281d'; g.fillRect(0, 0, N, N);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(P.src, N / 2 - P.cx * s, N / 2 - P.cy * s, P.W * s, P.H * s);
  // Dim what falls outside the round window.
  g.beginPath(); g.rect(0, 0, N, N); g.arc(N / 2, N / 2, P.C / 2, 0, Math.PI * 2);
  g.fillStyle = 'rgba(8,18,12,.66)'; g.fill('evenodd');
}
function setZoom(z) {
  P.zoom = clamp(z, 1, MAX_ZOOM);
  clampCrop();
  const zr = $('zoom'); if (zr) zr.value = P.zoom;
  queueDraw();
}
function sizeStage() {
  const st = $('stage'), cv = $('cropc');
  if (!st || !cv) return;
  P.size = st.clientWidth; P.C = P.size * CROP;
  P.dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(P.size * P.dpr); cv.height = cv.width;
  clampCrop(); drawCrop();
}
function bindStage() {
  const st = $('stage');
  sizeStage();
  const ptrs = new Map();
  let g = null;   // the gesture: last midpoint and finger distance
  const mid = () => { const a = [...ptrs.values()]; return [a.reduce((s, p) => s + p[0], 0) / a.length, a.reduce((s, p) => s + p[1], 0) / a.length]; };
  const spread = () => { const a = [...ptrs.values()]; return a.length > 1 ? Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) : 0; };
  const restart = () => { g = ptrs.size ? { mid: mid(), d: spread() } : null; };
  st.addEventListener('pointerdown', e => { e.preventDefault(); try { st.setPointerCapture(e.pointerId); } catch {} ptrs.set(e.pointerId, [e.clientX, e.clientY]); restart(); });
  st.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !g) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const d = spread();
    if (d && g.d) P.zoom = clamp(P.zoom * d / g.d, 1, MAX_ZOOM);
    const m = mid(), s = cropScale();
    P.cx -= (m[0] - g.mid[0]) / s; P.cy -= (m[1] - g.mid[1]) / s;
    g = { mid: m, d };
    setZoom(P.zoom);
  });
  const up = e => { ptrs.delete(e.pointerId); restart(); };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up); st.addEventListener('lostpointercapture', up);
  st.addEventListener('wheel', e => { e.preventDefault(); setZoom(P.zoom * Math.exp(-e.deltaY * .0015)); }, { passive: false });
  $('zoom').addEventListener('input', e => setZoom(+e.target.value));
}
window.addEventListener('resize', () => { if (P.mode === 'crop') sizeStage(); });

// The round window, scaled to 320×320 JPEG (quality ≈ 0.82).
function cropData() {
  const out = document.createElement('canvas');
  out.width = out.height = OUT;
  const g = out.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, OUT, OUT);   // a PNG's transparent parts turn white, not black
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const D = P.C / cropScale();
  g.drawImage(P.src, P.cx - D / 2, P.cy - D / 2, D, D, 0, 0, OUT, OUT);
  let q = .82, url = out.toDataURL('image/jpeg', q);
  while ((url.length - url.indexOf(',') - 1) * .75 > 280 * 1024 && q > .4) { q -= .15; url = out.toDataURL('image/jpeg', q); }
  if (!url.startsWith('data:image/jpeg')) throw new Error('no jpeg');
  return url;
}

async function usePhoto() {
  if (P.busy || !P.src || !creds) return;
  let data;
  try { data = cropData(); } catch { return photoError("We couldn't prepare that photo. Try another one."); }
  P.busy = true; P.err = ''; photoCrop();
  try {
    const r = await post(`/api/games/${HW.code}/photo`, { ...creds, data });
    if (r.view) HW.apply(r.view);
    store.del(photoSkipKey(creds.pid));
    closePhoto();
    flash('Looking good! Your photo is on the board.');
  } catch (e) {
    P.busy = false; P.err = friendly(e.message);
    if (P.mode) photoCrop();
  }
}
async function removePhoto() {
  if (P.busy || !creds) return;
  P.busy = true; photoIntro();
  try {
    const r = await post(`/api/games/${HW.code}/photo`, { ...creds, data: '' });
    if (r.view) HW.apply(r.view);
    store.set(photoSkipKey(creds.pid), '1');
    P.err = '';
    flash('Your photo is off the board and deleted.');
  } catch (e) {
    P.err = friendly(e.message);
  } finally { P.busy = false; P.confirm = false; if (P.mode === 'intro') photoIntro(); }
}

for (const id of ['photoCam', 'photoPick']) $(id).addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';   // so the same picture can be picked again
  if (f) loadPhoto(f);
});
$('sheet').addEventListener('click', e => {
  if (e.target === $('sheet') && !P.busy) return closePhoto(P.auto);   // a tap outside the card
  const b = e.target.closest('[data-ph]');
  if (!b || b.disabled) return;
  switch (b.dataset.ph) {
    case 'use': return usePhoto();
    case 'skip': return closePhoto(true);
    case 'close': return closePhoto();
    case 'ask-remove': P.confirm = true; return photoIntro();
    case 'remove': return removePhoto();
    case 'zin': return setZoom(P.zoom * 1.25);
    case 'zout': return setZoom(P.zoom / 1.25);
  }
});

// ---------- taps ----------
async function doAt(k, i) {
  ui.mode = '';
  if (await send(k, { hex: i }, DONE[k] || '')) ui.sel = null;
  draw();
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case 'owl': ui.owlOpen = !ui.owlOpen; if (!ui.owlOpen) ui.owlShown = false; return draw();
    case 'owlname': ui.owlShown = !ui.owlShown; return draw();
    case 'photo': return openPhoto(false);
    case 'color': ui.color = d.c; return draw();
    case 'join': {
      const name = $('name').value.trim();
      if (!name) { flash('Type your name first.', true); $('name').focus(); return; }
      if (!ui.color) { flash('Pick a colour first.', true); return; }
      b.disabled = true; b.textContent = 'Joining…';
      try { const r = await post(`/api/games/${HW.code}/join`, { name, color: ui.color }); flash(`Welcome, ${name}!`); takeSeat(r); }
      catch (err) { flash(friendly(err.message), true); }
      finally { b.disabled = false; b.textContent = 'Join the forest'; }
      return;
    }
    case 'rejoin':
      b.disabled = true;
      try { const r = await post(`/api/games/${HW.code}/rejoin`, { pin: $('pin').value.trim() }); flash(`Welcome back${r.name ? ', ' + r.name : ''}!`); takeSeat(r); }
      catch (err) { flash(friendly(err.message), true); }
      finally { b.disabled = false; }
      return;
    case 'seat': { const seat = loadSeats()[d.pid]; if (seat) takeSeat({ pid: d.pid, ...seat }); return; }
    case 'trust': { const to = pname(V()?.share?.player); return send('trust', {}, `You gave ${to} 1 trust acorn.`); }
    case 'another': return send('another', {}, 'Here is another question.');
    case 'investigate': { const n = +d.n; return send('investigate', { n }, `You looked at ${valueOf(n)?.name || 'the sector'}'s next weather.`); }
    case 'pick': ui.guessPick = d.id; return draw();
    // your turn
    case 'hex': {
      const i = +d.i, v = V(), me = v && player(creds?.pid);
      if (!me || v.phase !== 'turn') return;
      if (ui.mode && R.turnOptions(v, me)[ui.mode]?.targets?.includes(i)) return doAt(ui.mode, i);
      ui.sel = ui.sel === i ? null : i; ui.confirmEnd = false; return draw();
    }
    case 'cancel': ui.mode = ''; return draw();
    case 'do': {
      const v = V(), me = player(creds?.pid), k = d.k;
      if (!v || !me) return;
      ui.confirmEnd = false;
      if (d.why) { flash(friendly(`${ACT_NAME[k]}: ${d.why}`), true); return draw(); }
      if (k === 'pass') { ui.pass = !ui.pass; ui.mode = ''; return draw(); }
      ui.pass = false;
      const x = R.turnOptions(v, me)[k];
      // one place to do it (most of the time, your own hex): straight away; more: tap one on the map
      if (x.targets && x.targets.length > 1) { ui.mode = ui.mode === k ? '' : k; ui.sel = null; return draw(); }
      ui.mode = '';
      return doAt(k, x.targets ? x.targets[0] : -1);
    }
    case 'target': return doAt(ui.mode, +d.i);
    case 'move': {
      const i = +d.i;
      if (await send('move', { hex: i }, '')) { ui.sel = null; }
      return draw();
    }
    case 'give': {
      const to = pname(d.to);
      if (await send('pass', { target: d.to, text: d.item }, `You pass ${d.item === 'treasure' ? 'the treasure' : d.item} to ${to}.`)) ui.pass = false;
      return draw();
    }
    case 'endturn': {
      const v = V(), me = player(creds?.pid), left = HW.turnOf(v, me)?.actions || 0;
      if (left > 0 && !ui.confirmEnd) { ui.confirmEnd = true; return draw(); }
      ui.confirmEnd = false;
      return send('endTurn', {}, 'Turn ended. Wait for the others.');
    }
    case 'guess': if (!ui.guessPick) return flash('Tap a player first.', true);
      return send('guess', { target: ui.guessPick }, `Guess saved: ${pname(ui.guessPick)}`);
  }
});
document.addEventListener('keydown', e => {
  // Labels that open the camera act like buttons from the keyboard too.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('label[for][role="button"]')) { e.preventDefault(); $(e.target.htmlFor)?.click(); return; }
  if (e.key === 'Escape' && !$('sheet').hidden && !P.busy) return closePhoto(P.auto);
  if (e.key !== 'Enter') return;
  if (e.target.id === 'name') document.querySelector('[data-act="join"]')?.click();
  if (e.target.id === 'pin') document.querySelector('[data-act="rejoin"]')?.click();
});
$('name').addEventListener('input', joinPreview);

HW.connect(creds || {}, render, msg => { $('entry').hidden = false; $('game').hidden = true; flash(friendly(msg), true); });
</script>
</body>
</html>
