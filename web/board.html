<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartwood · Keeper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌳%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking: the game runs on a school Wi-Fi that may have no internet. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body class="kp">
<div id="k-sky"><i class="k-night"></i><i class="k-dawn"></i></div>
<div id="k-map" aria-label="The forest board"></div>
<div id="k-dim" hidden></div>
<header id="k-tl" class="k-sign k-still"></header>
<aside id="k-q" class="k-sign k-still" hidden aria-label="Turn order"></aside>
<aside id="k-tr" class="k-sign k-still" hidden></aside>
<div id="k-pop"></div>
<div id="k-info" hidden></div>
<div id="k-tray"></div>
<button id="k-tab" class="k-tab" aria-controls="k-drawer"></button>
<aside id="k-drawer" class="k-still">
  <section class="k-dsec" id="k-host" hidden>
    <h3>Keeper tools</h3>
    <div class="k-row"><span class="k-lab">Timer</span>
      <button class="k-btn cream sm" data-t="60">1 min</button><button class="k-btn cream sm" data-t="90">90 s</button><button class="k-btn cream sm" data-t="240">4 min</button></div>
    <div class="k-row" id="briefRow" hidden><span class="k-lab">Briefing</span><button class="k-btn cream sm" data-k="showBrief">Show the slides again</button></div>
    <details class="k-det"><summary>Help a player rejoin · Keeper on another device</summary><div id="hostTools"></div><div id="hostOut"></div></details>
    <details class="k-det" id="endEarly" hidden><summary>End the game early</summary><div id="endBox"></div></details>
  </section>
  <section class="k-dsec"><h3>Trail log</h3><div class="k-log" id="log"></div></section>
  <p class="k-links"><a href="howto.html" target="_blank">How to play</a> · <a href="wiki.html" target="_blank">Wiki</a></p>
</aside>
<div id="k-modal" hidden></div>
<div id="k-banner" aria-live="polite"></div>
<div id="k-moment" hidden></div>
<script src="common.js"></script>
<script src="art.js"></script>
<script src="recorder.js"></script>
<script src="find.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
// A Keeper link (?k=…) moves the Keeper controls to this device.
const params = new URLSearchParams(location.search);
if (params.get('k')) {
  localStorage.setItem('hw-host-' + HW.code, params.get('k'));
  params.delete('k');
  history.replaceState(null, '', `${location.pathname}?${params}`);
}
const host = localStorage.getItem('hw-host-' + HW.code) || '';
const creds = host ? { host } : {};
ART.install();
const esc = HW.esc;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const SPRING = 'cubic-bezier(.34,1.56,.64,1)';
const NS = 'http://www.w3.org/2000/svg';
const S = ART.S, TILT = ART.TILT;
const MED_R = 13.5;                       // photo radius of a medallion on the board (world units)
const now = () => performance.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = { get(k, d) { try { const x = localStorage.getItem(k); return x == null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem(k, JSON.stringify(x)); } catch { } } };

// ---------- actions ----------
// Players say it aloud; the Keeper taps it here, acting for them (`as`). Every tap gets visible feedback:
// the board animates, and a toast says what happened (green) or why the server refused (red).
let busy = false;
async function act(type, extra = {}, okMsg) {
  if (busy) return false;
  busy = true;
  document.body.classList.add('busy');
  try {
    const ok = await HW.act(creds, type, extra);
    if (ok && okMsg) HW.toast(okMsg, 'ok');
    return ok;
  } finally { busy = false; document.body.classList.remove('busy'); }
}
const actAs = (pid, type, extra, okMsg) => act(type, { as: pid, ...extra }, okMsg);
// takes back the Keeper's last tap this turn (the server keeps a copy of the game before each one)
function undo() {
  const v = HW.view;
  if (!v?.isHost || !v.undo) return;
  ui.mode = null; ui.pass = false; ui.value = null; closeInfo();
  return act('undo', {}, `↶ Taken back: ${v.undo}`);
}

// Keeper choices on this screen that aren't sent yet.
const ui = { value: null, mode: null, bring: null, pass: false, scope: '', confirmEnd: false, hidePanel: false, brief: null, slideTo: null,
  drawer: store.get('hw-drawer', false), tip: '' };

// ---------- small drawings for the HUD (ART markup, memoised) ----------
const memo = new Map();
const M = (k, f) => { let x = memo.get(k); if (x === undefined) { if (memo.size > 600) memo.clear(); x = f(); memo.set(k, x); } return x; };
const svgI = (inner, vb, w, h, cls) => ART.svg(inner, { viewBox: vb, width: w, height: h ?? w, cls });
const I = {
  icon: (n, s = 40) => M(`ic${n}${s}`, () => svgI(ART.icon(n), '-25 -25 50 50', s)),
  wx: (w, s = 30) => M(`wx${w}${s}`, () => svgI(ART.weatherBadge(w), '-25 -25 50 50', s)),
  val: (i, s = 30) => M(`va${i}${s}`, () => svgI(ART.valueBadge(i), '-25 -25 50 50', s)),
  role: (t, s = 30) => M(`ro${t}${s}`, () => svgI(ART.roleBadge(t), '-25 -25 50 50', s)),
  fruit: (s = 22) => M(`fr${s}`, () => svgI(ART.fruit(), '-13 -13 26 26', s)),
  drop: (s = 18, empty) => M(`dr${s}${empty}`, () => svgI(empty ? '<g opacity=".28" style="filter:url(#art-grey)">' + ART.drop() + '</g>' : ART.drop(), '-13 -13 26 26', s)),
  acorn: (s = 22) => M(`ac${s}`, () => svgI(ART.acorn(), '-13 -13 26 26', s)),
  treasure: (id, s = 30) => M(`tr${id}${s}`, () => svgI(ART.treasure(id), '-19 -19 38 38', s)),
  // a treasure nobody has found yet: a face-down hex with a question mark (the briefing doesn't say which three)
  mystery: (h = 60) => M(`my${h}`, () => svgI(ART.tile({ ring: 2, seed: 5 }) + '<text y="14" text-anchor="middle" font-family="Lilita One, Nunito, sans-serif" font-size="44" fill="#ffe6a6" stroke="#2e1709" stroke-width="6" paint-order="stroke" stroke-linejoin="round">?</text>', '-38 -28 76 86', h * 76 / 86, h)),
  ghost: (s = 30) => M(`gh${s}`, () => svgI('<circle r="13" fill="rgba(80,50,20,.18)" stroke="#9a7a52" stroke-width="2.2" stroke-dasharray="4 3"/>', '-19 -19 38 38', s)),
  leaf: (on, s = 26) => M(`lf${on}${s}`, () => svgI(ART.leaf({ empty: !on }), '-13 -13 26 26', s)),
  dead: (s = 18, seed = 1, dim) => M(`dl${s}${seed}${dim}`, () => svgI(dim ? '<g opacity=".25">' + ART.deadLeaf({ seed }) + '</g>' : ART.deadLeaf({ seed }), '-10 -10 20 20', s)),
  bigTree: (s, h = 44, done = true) => M(`bt${s}${h}${done}`, () => svgI(ART.plant(4, s, { seed: 7 }), '-40 -92 80 96', h * 80 / 96, h, done ? '' : 'k-dimtree')),
  world: (awake, h = 64) => M(`wt${awake}${h}`, () => svgI(ART.worldTree({ awake }), '-96 -205 192 215', h * 192 / 215, h)),
  hollow: (s = 120) => M(`ho${s}`, () => svgI(ART.worldTree({ awake: true, fruit: 4 }), '-30 -84 60 52', s, s * 52 / 60)),
  sprig: (s = 44, flip) => M(`sp${s}${flip}`, () => svgI(ART.sprig(), '-24 -16 48 32', s, s * 32 / 48, flip ? 'k-flip' : '')),
};
const photoURL = p => (p && p.photo ? `/api/games/${HW.code}/photo/${encodeURIComponent(p.id)}?v=${p.photo}` : '');
// a player's medallion as a small picture for the HUD (no stump)
function medPic(p, size = 56, o = {}) {
  if (!p) return '';
  // outside play (lobby, finale) the water crown is just decoration: full
  const playing = ['enter', 'turn'].includes(HW.view?.phase), water = o.water ?? (playing ? p.water : 5), st = o.state || '';
  const fruit = o.badges === false ? 0 : p.fruit, treasure = o.badges === false ? '' : p.treasure;
  // memoised, so an unchanged panel keeps the very same HTML and HW.patch leaves it (and its taps) alone
  return M(`mp|${p.id}|${photoURL(p)}|${p.name}|${p.color}|${water}|${fruit}|${treasure}|${st}|${size}`, () =>
    svgI(ART.medallion({ photo: photoURL(p), name: p.name, color: p.color, water, fruit, treasure, state: st, r: 20, stump: false }), '-42 -44 84 86', size, size, 'k-medpic'));
}
const pname = id => esc(HW.name(id));
const chip = (p, size = 30) => p ? `<span class="k-chip">${medPic(p, size, { badges: false })}<b>${esc(p.name)}</b></span>` : '';

// ---------- rules the Keeper screen checks before offering a tap ----------
// The server checks again and its refusal is shown; these only decide what glows.
const has = (p, t) => (p?.types || []).includes(t);
const wxOf = (v, i) => (i > 0 && v.hexes[i] ? v.weather[v.hexes[i].sector] : null);
const tileOf = (v, i) => (i > 0 ? v.tiles[i] : null);
const sealed = (v, i) => !!tileOf(v, i) && tileOf(v, i).leaves >= 2;
const stageName = (v, s) => (v.stages && v.stages[s]) || HW.STAGES[s] || '';

function moveTargets(v, p) {
  if (!p || p.pos < 0 || p.water <= 0 || !v.turn || v.turn.actions < 1) return { one: [], two: [] };
  const one = B.adj[p.pos].filter(j => !sealed(v, j) || has(p, 8));
  const two = [];
  if (has(p, 7) && !v.turn.enthusiastUsed && wxOf(v, p.pos) !== 'fog')
    for (const m of B.adj[p.pos].filter(j => !sealed(v, j) && wxOf(v, j) !== 'fog'))
      for (const j of B.adj[m]) if (j !== p.pos && !sealed(v, j) && wxOf(v, j) !== 'fog' && !one.includes(j) && !two.includes(j)) two.push(j);
  return { one, two };
}
// Passing: on the giver's own turn, on the same hex, or to a teammate on a neighbouring hex when both are in a
// Peacemaker's chain (teammates linked hex by hex, each on or next to the next one's hex, a Peacemaker among them).
function canPass(v, a, b) {
  if (!a || !b || a.id === b.id || a.pos < 0 || b.pos < 0) return false;
  if (a.pos === b.pos) return true;
  return B.adj[a.pos].includes(b.pos) && !!chainOf(v, a);
}
// the Peacemaker that p is linked to hex by hex through teammates (p themself, maybe), or null
function chainOf(v, p) {
  const seen = new Set([p.id]), todo = [p];
  while (todo.length) {
    const a = todo.shift();
    if (has(a, 9)) return a;
    for (const b of v.players) if (!seen.has(b.id) && b.pos >= 0 && (b.pos === a.pos || B.adj[a.pos]?.includes(b.pos))) { seen.add(b.id); todo.push(b); }
  }
  return null;
}
// who comes along when a Challenger moves: everyone standing with them, or the Keeper's pick. On the World Tree,
// where the team gathers, nobody comes unless picked.
function bringing(v, p) {
  const mates = has(p, 8) ? v.players.filter(q => q.id !== p.id && q.pos === p.pos) : [];
  const b = ui.bring, pick = b && b.pid === p.id && b.pos === p.pos ? b.ids : p.pos === 0 ? [] : mates.map(q => q.id);
  return mates.filter(q => pick.includes(q.id));
}
const reachable = (v, p) => [p.pos, ...(has(p, 2) ? B.adj[p.pos] : [])].filter(i => i > 0);
function targetsFor(v, p, mode) {
  if (mode === 'water') return reachable(v, p).filter(i => [1, 2].includes(v.tiles[i].stage) && v.tiles[i].leaves < 2);
  if (mode === 'tend') return reachable(v, p).filter(i => v.tiles[i].stage === 3 && v.tiles[i].leaves < 2);
  if (mode === 'clear') return [p.pos, ...B.adj[p.pos]].filter(i => i > 0 && v.tiles[i].leaves > 0)
    .filter(i => v.turn.actions >= clearCost(v, p, i));
  return [];
}
const clearCost = (v, p, i) => (wxOf(v, i) === 'rain' && !has(p, 1) ? 2 : 1);

// What the current player can do, with the reason when they can't.
function turnOptions(v, p) {
  const t = v.turn, left = t.actions, pos = p.pos, tile = tileOf(v, pos), w = wxOf(v, pos);
  const onTree = pos === 0, helper = has(p, 2);
  const o = {};
  const need = (n, ok, why) => (left < n ? { ok: false, why: left ? `needs ${n} actions` : 'no actions left' } : ok ? { ok: true } : { ok: false, why });
  const exploreCost = w === 'fog' ? 2 : 1;
  o.explore = need(exploreCost, tile && !tile.up, onTree ? 'nothing to explore here' : 'already explored');
  o.explore.cost = exploreCost; o.explore.wx = w;
  o.sow = need(1, tile && tile.up && tile.kind !== 'spring' && !tile.treasure && !tile.stage && tile.leaves < 2,
    onTree ? 'not on the World Tree' : !tile.up ? 'explore it first' : tile.kind === 'spring' ? 'a spring' : tile.treasure ? 'a treasure lies here'
      : tile.stage ? 'already growing' : 'sealed by leaves');
  const wt = targetsFor(v, p, 'water');
  o.water = need(1, p.water > 0 && wt.length, p.water <= 0 ? 'no water to give' : helper ? 'no Seeded or Sprout here or next door' : 'not Seeded or Sprout');
  o.water.targets = wt;
  const tt = targetsFor(v, p, 'tend');
  o.tend = need(1, tt.length, helper ? 'no Sapling here or next door' : 'no Sapling here');
  o.tend.targets = tt;
  const near = [pos, ...B.adj[pos]].filter(i => i > 0 && v.tiles[i].leaves > 0);
  const ct = targetsFor(v, p, 'clear');
  o.clear = need(1, ct.length, !near.length ? 'no leaves nearby' : 'needs 2 actions in rain');
  o.clear.targets = ct;
  o.clear.cost = near.length && near.every(i => clearCost(v, p, i) === 2) ? 2 : 1;
  o.clear.wx = o.clear.cost > 1 ? 'rain' : '';
  o.harvest = need(1, tile && tile.stage === 4 && tile.leaves < 2 && w !== 'rain' && !tile.harvested && p.fruit < HW.MAX_FRUIT,
    !tile || tile.stage !== 4 ? 'no Big Tree here' : tile.leaves >= 2 ? 'sealed by leaves' : w === 'rain' ? 'not in the rain'
      : tile.harvested ? 'picked since the Tide' : 'carrying 2 fruit');
  o.take = need(1, tile && tile.up && tile.treasure && !p.treasure, tile && tile.up && tile.treasure ? 'carrying a treasure' : 'no treasure here');
  o.drink = need(1, tile && tile.up && tile.kind === 'spring' && p.water < HW.MAX_WATER, tile && tile.up && tile.kind === 'spring' ? 'already full' : 'no spring here');
  return o;
}

// ==================================================================================================
// The board: a full-screen 2.5D map in stacked SVG layers (same viewBox), built once per game and
// patched in place. Static tiles sit in their own layer so the animated layers above never repaint them.
// Painter order: tiles (+ ground dusk) → weather + dappled light → objects → mist, fireflies, sector signs
// → highlight rims + hit areas → medallions → effects.
// ==================================================================================================
let B = null;
const TR = (x, y) => `translate(${x.toFixed(1)},${y.toFixed(1)})`;
const LAYERS = ['tile', 'wx', 'obj', 'air', 'hit', 'med', 'num', 'fx'];
// Animations hold back parts of the new state until their moment (a flipped tile, a plant that pops).
const hold = { tile: new Map(), obj: new Map() };
const ovr = {};          // pid → {water, fruit, treasure}: what a medallion shows until an animation lands
let queueEnd = 0;        // when the animations already scheduled are done (the share card waits for it)

// The map can be seen from any of its six sides (this screen only, kept per game): rot is how many sixths of a
// turn it has turned clockwise. A hex's place on the screen comes from its turned coordinates; it keeps its own
// look (the decoration follows the hex, the ribbon follows the forest's edge).
let rot = store.get('hw-rot-' + HW.code, 0);
const turnQR = (q, r, k) => { for (let n = 0; n < k; n++) [q, r] = [-r, q + r]; return [q, r]; };
const placeOf = (h, k = rot) => ART.project(...turnQR(h.q, h.r, k));
// sector s's sign stands in the slot of the sector it has turned to; the slot at the top right is SIGN[0]
const signSlot = s => (s + rot) % 6, topSign = () => (6 - rot) % 6;
function buildBoard(v) {
  const map = $('k-map');
  map.innerHTML = '';
  const hx = v.hexes, xy = hx.map(h => placeOf(h));
  const at = {};
  hx.forEach((h, i) => (at[h.q + ',' + h.r] = i));
  const adj = hx.map(h => ART.DIRS.map(([dq, dr]) => at[(h.q + dq) + ',' + (h.r + dr)]).filter(i => i !== undefined));
  const order = hx.map((_, i) => i).sort((a, b) => xy[a][1] - xy[b][1] || xy[a][0] - xy[b][0]);
  const L = {};
  for (const n of LAYERS) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'k-layer k-L' + n);
    s.setAttribute('preserveAspectRatio', 'none');
    map.appendChild(s);
    L[n] = s;
  }
  const sc = [0, 1, 2, 3, 4, 5].map(s => hx.map((h, i) => [h, i]).filter(([h]) => h.sector === s).map(([, i]) => xy[i]));
  // tiles + the ground dusk (one group with one opacity, so overlapping hexes don't double-darken)
  L.tile.innerHTML = order.map(i => `<g transform="${TR(...xy[i])}"><g class="k-tw"></g></g>`).join('')
    + `<g class="k-dusk" id="kDusk">${order.map(i => `<polygon data-d="${i}" points="${ART.tileOutline(hx[i].ring)}" transform="${TR(...xy[i])}"/>`).join('')}</g>`;
  const tw = [], dusk = [];
  L.tile.querySelectorAll('.k-tw').forEach((g, k) => (tw[order[k]] = g));
  L.tile.querySelectorAll('[data-d]').forEach(p => (dusk[+p.dataset.d] = p));
  // weather and dappled light per sector
  L.wx.innerHTML = [0, 1, 2, 3, 4, 5].map(s => `<g class="k-wxs" data-s="${s}"></g><g class="k-dap" data-s="${s}">${ART.dapple(sc[s], { seed: 40 + s })}</g>`).join('');
  // objects, one slot per hex in painter order
  L.obj.innerHTML = order.map(i => `<g transform="${TR(...xy[i])}"><g class="k-ow"></g></g>`).join('');
  const ow = [];
  L.obj.querySelectorAll('.k-ow').forEach((g, k) => (ow[order[k]] = g));
  // mist + fireflies over asleep sectors; sector signs at the board's outer edge
  let air = '';
  for (let s = 0; s < 6; s++) {
    const R = ART.rng(900 + s);
    let ff = '';
    for (let k = 0; k < 3; k++) { const [x, y] = sc[s][Math.floor(R() * sc[s].length)]; ff += ART.firefly(x + (R() - .5) * 40, y - 20 - R() * 30, { seed: s * 10 + k }); }
    air += `<g class="k-mist" data-s="${s}">${ART.mist(sc[s], { seed: 70 + s, n: 2 })}${ff}</g>`;
  }
  air += `<g class="k-mist k-mist0" data-s="-1">${ART.mist([[0, -30]], { seed: 77, n: 1 })}</g>`;
  air += [0, 1, 2, 3, 4, 5].map(s => `<g class="k-sign-g" data-s="${s}" transform="${TR(...SIGN[signSlot(s)])} scale(.72)">${signMarkup(v, s)}</g>`).join('');
  L.air.innerHTML = air;
  // highlight rims + hit areas (front tiles last, so they win where a back tile's wall hides behind them)
  const face = ART.facePoints(S, .9);
  L.hit.innerHTML = order.map(i => `<g class="k-h" data-i="${i}" transform="${TR(...xy[i])}"><polygon class="k-rim-o" points="${face}"/><polygon class="k-rim" points="${face}"/><polygon class="k-hitp" points="${ART.tileOutline(hx[i].ring)}"/></g>`).join('');
  const hg = [];
  L.hit.querySelectorAll('.k-h').forEach(g => (hg[+g.dataset.i] = g));
  L.hit.addEventListener('click', e => { const g = e.target.closest('.k-h'); if (g) onHex(+g.dataset.i); });
  // tapping a medallion means the hex it stands on; pointing at one lights that hex
  L.med.addEventListener('click', e => { const m = e.target.closest('.k-med'); if (m && m.dataset.hex) onHex(+m.dataset.hex); });
  const hov = i => { L.hit.querySelector('.k-h.hov')?.classList.remove('hov'); if (i != null && i >= 0) L.hit.querySelector(`.k-h[data-i="${i}"]`)?.classList.add('hov'); };
  L.med.addEventListener('mouseover', e => { const m = e.target.closest('.k-med'); hov(m ? m.dataset.hex : null); });
  L.med.addEventListener('mouseout', e => { if (!e.relatedTarget?.closest?.('.k-med')) hov(null); });
  L.med.innerHTML = order.map(i => `<g data-m="${i}"></g>`).join('');
  const mg = [];
  L.med.querySelectorAll('[data-m]').forEach(g => (mg[+g.dataset.m] = g));
  L.fx.innerHTML = '<g id="kFx"></g>';
  // the board's extent: tiles with walls, the World Tree's crown, medallions on the top row, the signs
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  hx.forEach((h, i) => { const [x, y] = xy[i]; x0 = Math.min(x0, x - 36); x1 = Math.max(x1, x + 36); y0 = Math.min(y0, y - 62); y1 = Math.max(y1, y + 24 + ART.depth(h.ring) + 7); });
  y0 = Math.min(y0, xy[0][1] - 4.75 * S);
  SIGN.forEach(([x, y]) => { x0 = Math.min(x0, x - 50); x1 = Math.max(x1, x + 50); y0 = Math.min(y0, y - 44); y1 = Math.max(y1, y + 22); });
  B = { code: v.code, n: hx.length, hx, xy, adj, order, L, sc, tw, ow, hg, dusk, mg, fx: L.fx.firstChild, hov,
    tk: [], ok: [], meds: {}, medPos: {}, wk: [], awake: null, won: null, deep: null, bbox: [x0, y0, x1 - x0, y1 - y0], k: 1, vx: 0, vy: 0 };
  const yUp = Math.min(y0, SIGN_UP[1] - 30);
  B.bboxUp = [x0, yUp, x1 - x0, y1 - yUp];
  fit();
}

// Sector signs: weather badge + value badge + name, just outside each sector's outer edge. These are the six slots,
// clockwise from the top (ZERAOS when the map isn't turned). The top and bottom ones slide sideways so the World
// Tree's crown and the action tray stay clear.
const SIGN = [[200, -176], [282, -64], [246, 112], [-206, 178], [-282, 64], [-246, -112]];
const SIGN_UP = [118, -206];
function plaqueMarkup(v, s) {

        { transform: `translate(${c[0]}px,${c[1] - 14}px) rotate(${ang}deg) scale(.6,1)`, opacity: 0 }], { duration: 760, easing: 'ease-in-out' });

// The treasure moment: the screen dims, the treasure rises in rays with its name and meaning.
function moment(tr, id) {
  const el = $('k-moment');
  el.innerHTML = `<div class="k-mo-in"><div class="k-mo-rays">${svgI(ART.rays({ n: 18 }), '-50 -50 100 100', 520)}</div>
    <div class="k-mo-art">${svgI(ART.treasure(id), '-19 -19 38 38', 220)}</div>

    <div class="k-mo-meaning">${esc(tr?.meaning || '')}</div></div>`;
  el.hidden = false;

// ==================================================================================================
// Rendering a view
// ==================================================================================================
let prevView = null;
function render(v) {
  if (!v.hexes?.length) return;
  if (turning) return;   // the map is turning: the newest view is drawn when it stops
  if (!B || B.code !== v.code || B.n !== v.hexes.length) buildBoard(v);
  // A new turn or phase drops half-made choices (a picked value, a Water target…).
  const scope = `${v.phase}|${v.current || ''}|${v.round}`;
  if (scope !== ui.scope) { ui.scope = scope; ui.value = null; ui.mode = null; ui.bring = null; ui.pass = false; ui.info = null; if (v.phase !== 'end') ui.hidePanel = false; }
  if (v.share) { ui.mode = null; ui.pass = false; }
  if (!['enter', 'turn'].includes(v.phase)) ui.brief = null;
  const fresh = takeEvents(v);
  const evs = plan(v, prevView, fresh);
  const moved = new Set(evs.filter(e => e.type === 'move' || e.type === 'enter').map(e => e.pid));
  B.prevPos = Object.fromEntries(Object.entries(B.medPos).map(([k, p]) => [k, [p[0], p[1]]]));
  // the board
  for (let i = 0; i < B.n; i++) { patchTile(v, i); patchObj(v, i); }
  // a view can arrive twice (the action's answer, then the push): what an animation will change waits for it
  if (!B.tidePending) patchWeather(v, false);
  patchMeds(v, moved);
  // the dawn (or the deeper dusk) comes with its own animation
  if (!B.wakePending && !B.dryPending) patchDusk(v, true);
  patchHighlights(v);
  run(v, evs);
  // a sealed find (web/find.js) waits for the tile to flip
  window.HWFind?.view(v, queueEnd - now());
  // the HUD
  renderTopLeft(v);
  renderGoals(v);
  renderTray(v);
  renderQueue(v);
  fit();
  renderPop(v);
  renderInfo(v);
  renderDrawer(v);
  renderModal(v);
  // recording each share (web/recorder.js): it watches the open share and records the Keeper's microphone
  window.HWRec?.view(v);
  if (v.phase === 'lobby' || prevView?.phase === 'lobby') fit();
  prevView = v;
}

// ---------- HUD: title, round, Forest Breath, turning the map ----------
const turnIcon = dir => `<svg viewBox="-12 -12 24 24" width="22" height="22" aria-hidden="true"><path d="M${dir * -7},3 A8,8 0 1,${dir > 0 ? 1 : 0} ${dir * 6},-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M${dir * 2},-9 L${dir * 8},-6 L${dir * 4},-1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function renderTopLeft(v) {
  const playing = ['turn', 'guess', 'chain', 'end'].includes(v.phase) && v.round;
  const breath = v.breathCount || 0;
  let h = `<span class="k-sprig tr">${I.sprig(54, true)}</span><div class="k-logo">${I.world(v.result === 'won', 58)}<div><div class="k-title">Heartwood</div>
    <div class="k-code">Game <b>${esc(v.code)}</b>${v.isHost ? '' : ' · <span class="k-vo">view only</span>'}</div></div></div>
    <div class="k-phase">${esc(HW.phaseTitle(v))}${playing && v.phase === 'turn' ? `<small> · Tide ${v.tide || 0}</small>` : ''}</div>`;
  if (v.phase === 'turn') h += `<div class="k-breath" title="Dead leaves the next Forest Tide blows onto the forest"><span class="k-lab">Forest Breath</span>
    <span class="k-gusts">${[0, 1, 2, 3, 4, 5].map(k => I.dead(20, k + 1, k >= breath)).join('')}</span><b>${breath}</b></div>`;
  // the map seen from another side (this screen only)
  if (['enter', 'turn'].includes(v.phase)) h += `<div class="k-view"><span class="k-lab">Turn the map</span>${[-1, 1].map(d => `<button data-turn="${d}" title="Turn the map to the ${d < 0 ? 'left' : 'right'}" aria-label="Turn the map to the ${d < 0 ? 'left' : 'right'}">${turnIcon(d)}</button>`).join('')}</div>`;
  h += `<div class="timer k-timer" data-timer></div>`;

// ---------- HUD: the goal tracker ----------
function renderGoals(v) {

    <div class="k-gt${ok(n && g.placedPlayers >= n)}"><span class="k-gt-ic">${I.fruit(30)}</span><span class="k-gt-mid"><small title="everyone places a fruit on the World Tree">everyone's fruit</small>${bar(g.placedPlayers, n)}</span><b>${g.placedPlayers || 0}/${n}</b></div>${oweRow}

    <div class="k-gt k-gt-world${ok(n && g.onTree >= n)}"><span class="k-gt-ic">${I.world(v.result === 'won', 32)}</span><span class="k-gt-mid"><small title="everyone stands on the World Tree">all on the tree</small>${bar(g.onTree, n)}</span><b>${g.onTree || 0}/${n}</b></div>`);

// ---------- HUD: the turn queue down the left (now, next, and where the Forest Tide falls) ----------
function renderQueue(v) {
  const el = $('k-q'), order = (v.order || []).map(id => HW.player(id)).filter(Boolean);
  el.hidden = !['enter', 'turn'].includes(v.phase) || !order.length;
  if (el.hidden) return;
  const i = Math.max(0, order.findIndex(p => p.id === v.current));
  // entering: everyone in order; playing: from now to the end of the round, the Tide, then the next round
  const rows = v.phase === 'turn' ? [...order.slice(i), 'tide', ...order.slice(0, i)] : order;
  const next = rows.slice(rows.indexOf(order[i]) + 1).find(p => p !== 'tide');
  let after = false;
  const row = p => {
    const now = p.id === v.current, dry = v.phase === 'turn' && p.water <= 0, done = v.phase === 'enter' && p.pos >= 0 && !now;
    const sub = now ? 'now' : p === next ? 'next' : '';
    return `<li class="k-q-p${now ? ' now' : ''}${after ? ' after' : ''}${done ? ' done' : ''}" data-q="${p.pos}" title="${esc(p.name)}${now ? ': their turn now' : p === next ? ': next' : dry ? ': no water' : ''}">
      ${sub ? `<small>${sub}</small>` : ''}${medPic(p, 44, { state: now ? 'turn' : dry ? 'dry' : '' })}<b style="border-color:${esc(p.color)}">${esc(p.name)}</b></li>`;
  };
  HW.patch(el, `<div class="k-q-h">Turns</div><ol class="k-q-l">${rows.map(p => {
    if (p !== 'tide') return row(p);
    after = true;
    return `<li class="k-q-tide" title="Forest Tide: after the last turn of the round, the weather changes and dead leaves blow">${I.dead(16, 2)}<span>Tide</span>${I.dead(16, 5)}</li>`;
  }).join('')}</ol>`);
  // fill the room between the top-left sign and the tray: the medallions shrink for a big team
  const z = parseFloat(document.body.style.getPropertyValue('--hud')) || 1;
  const top = $('k-tl').getBoundingClientRect().bottom + 12, tray = $('k-tray').getBoundingClientRect();
  const bottom = tray.height && tray.left < 14 + el.offsetWidth * z + 12 ? tray.top - 12 : innerHeight - 12;
  el.style.top = (top / z) + 'px';
  // a row is the medallion + its name tag + a gap (20px more than the medallion); the current one is a quarter
  // bigger and says "now", the next says "next"; then the Tide line, the heading and the frame (~110px)
  const room = (bottom - top) / z, n = order.length;
  el.style.setProperty('--qs', Math.max(28, Math.min(62, (room - 20 * n - 110) / (n + .25))).toFixed(1) + 'px');
}
$('k-q').addEventListener('mouseover', e => { const r = e.target.closest('[data-q]'); B?.hov(r ? +r.dataset.q : null); });
$('k-q').addEventListener('mouseleave', () => B?.hov(null));

// ---------- HUD: whose turn + the action tray of seed packets ----------
const PK = { move: 'Move', explore: 'Explore', sow: 'Sow', water: 'Water', tend: 'Tend', clear: 'Clear', harvest: 'Harvest', take: 'Take', drink: 'Drink', pass: 'Pass', end: 'End turn' };
// keyboard shortcuts for the Keeper's commonest taps (then 1-9 picks a numbered hex)
const KEYS = { move: 'M', explore: 'E', end: '↵' };
function packet(k, o) {
  // the cost in the corner: a leaf per action, and the weather that makes it 2 in the other corner

// During play the Keeper can show them again here only (ui.brief is that slide).
const briefLive = v => v.phase === 'brief';

const hurdle = (art, name, does, prevent) => `<div class="k-br-c k-br-hurdle"><div class="k-br-art">${art}</div><h3>${name}</h3><p>${does}</p>
  <p class="k-br-ok"><b>Prevent it</b>${prevent}</p></div>`;
// The forest as it starts, each value's sector washed in its colour, the World Tree asleep in the centre.
// names: each value's plaque where the board puts its sign; trees: a Big Tree in every sector (the first goal).
function briefMap(v, h, o = {}) {
  return M(`bm|${h}|${o.names ? 1 : 0}|${o.trees ? 1 : 0}|${rot}|${v.values.map(x => x.name).join()}`, () => {
    const hx = v.hexes, xy = hx.map(t => placeOf(t)), face = ART.facePoints(S, .965);
    const order = hx.map((_, i) => i).sort((a, b) => xy[a][1] - xy[b][1] || xy[a][0] - xy[b][0]);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    const span = (x, y, w, up, down) => { x0 = Math.min(x0, x - w); x1 = Math.max(x1, x + w); y0 = Math.min(y0, y - up); y1 = Math.max(y1, y + down); };
    let g = order.map(i => {
      const t = hx[i];
      span(...xy[i], 36, 30, 24 + ART.depth(t.ring) + 7);
      return `<g transform="${TR(...xy[i])}">${i ? ART.tile({ ring: t.ring, sector: t.sector, q: t.q, r: t.r, outer: edgeOf(t) }) + `<polygon points="${face}" fill="${v.values[t.sector]?.color || '#888'}" opacity=".55"/>` : ART.tile({ world: true, q: 0, r: 0 })}</g>`;
    }).join('');
    const obj = [[0, ART.worldTree({ awake: false, seed: 31 })]];
    span(...xy[0], 70, 4.75 * S, 0);
    // on Ring 3, mid-sector (Zealous's middle hex hides behind the World Tree's crown, so its tree stands one over)
    if (o.trees) for (let s = 0; s < 6; s++) {
      const ring3 = hx.map((t, i) => [t, i]).filter(([t]) => t.sector === s && t.ring === 3).map(([, i]) => i), i = ring3[s ? 1 : 0];
      obj.push([i, `<g transform="scale(1.35)">${ART.plant(4, s, { seed: i * 7 + 3 })}</g>`]);
      span(...xy[i], 1.1 * S * 1.35, 2.2 * S * 1.35, 0);
    }
    g += obj.sort((a, b) => xy[a[0]][1] - xy[b[0]][1]).map(([i, m]) => `<g transform="${TR(...xy[i])}">${m}</g>`).join('');
    if (o.names) g += [0, 1, 2, 3, 4, 5].map(s => {

      span(x, y, w, 20, 18);
      return `<g transform="${TR(x, y)} scale(1.4) translate(0,-10)">${plaqueMarkup(v, s)}</g>`;
    }).join('');
    return svgI(g, `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1 - x0).toFixed(1)} ${(y1 - y0).toFixed(1)}`, h * (x1 - x0) / (y1 - y0), h, 'k-br-map');
  });
}

// a new slide: live, every screen follows the Keeper (the server keeps the number); during play, this screen only
async function goSlide(i) {
  const v = HW.view;
  if (!v || !briefOn(v)) return;
  i = Math.max(0, Math.min(HW.SLIDES.length - 1, i));
  if (!briefLive(v)) { ui.brief = i; return renderModal(v); }
  if (!v.isHost || busy || i === slideAt(v)) return;
  ui.slideTo = i; renderModal(v);
  await act('slide', { n: i });
  ui.slideTo = null;
  if (HW.view) renderModal(HW.view);
}

// ---------- taps ----------
// Taps that need a second tap within 3 s, so a stray tap doesn't end a turn early.
const armed = {};
function twice(key, msg) {
  if (Date.now() - (armed[key] || 0) < 3000) { armed[key] = 0; return true; }
  armed[key] = Date.now();
  HW.toast(msg);
  return false;
}
const VERB = { explore: 'explores', sow: 'sows a seed', water: 'waters', tend: 'tends the Sapling', clear: 'clears leaves', harvest: 'harvests a fruit', take: 'takes the treasure', drink: 'drinks at the spring' };

async function onHex(i) {
  const v = HW.view;
  if (!v) return;
  // A hex that isn't a target shows its card; tapping that hex again closes it. `why` says why the tap didn't act.
  const info = (why = '') => (ui.info?.i === i ? closeInfo() : showInfo(i, why));
  if (!v.isHost || !['enter', 'turn'].includes(v.phase)) return info();
  if (v.share) return info(`${esc(HW.name(v.share.player))} is sharing: tap Done sharing first.`);
  const { hl, hl2 } = highlights(v);
  if (v.phase === 'enter') {
    if (ui.value == null) return info('To enter here: first tap the value they stand for.');
    if (!hl.has(i)) return info(`To enter: tap a glowing hex on the outer ring of ${esc(v.values[ui.value].name)}.`);
    closeInfo();
    const p = HW.player(v.current), val = ui.value;
    if (await actAs(p.id, 'enter', { n: val, hex: i }, `✓ ${p.name} stands for ${v.values[val].name}`)) ui.value = null;
    return;
  }
  if (!v.turn) return info();
  const p = HW.player(v.turn.player);
  if (ui.pass) { ui.pass = false; return render(v); }
  // no action picked: a tap only shows the hex (its card offers Move when they can go there)
  if (!ui.mode) return info();
  if (ui.mode === 'move') {
    if (!hl.has(i) && !hl2.has(i)) {
      // next to them but no move: say why
      const near = B.adj[p.pos]?.includes(i);
      return info(!near ? 'To move: tap a numbered hex, or tap Move again to cancel.' : p.water <= 0 ? `${esc(p.name)} has no water: a teammate on this hex passes 1 on their turn.`
        : !v.turn.actions ? 'No actions left: end the turn.' : sealed(v, i) ? 'Sealed: clear it first (a Challenger may walk in).' : '');
    }
    return moveTo(v, p, i);
  }
  if (!hl.has(i)) return info(`To ${ui.mode}: tap a numbered hex, or tap ${PK[ui.mode]} again to cancel.`);
  closeInfo();
  const mode = ui.mode;
  ui.mode = null;
  await actAs(p.id, mode, { hex: i }, `✓ ${p.name} ${VERB[mode]}`);
  return render(HW.view);
}
async function moveTo(v, p, i) {
  closeInfo();
  ui.mode = null;
  const bring = has(p, 8) ? bringing(v, p).map(q => q.id) : null;
  if (await actAs(p.id, 'move', bring ? { hex: i, bring } : { hex: i }, bring?.length ? `✓ ${p.name} moves with ${bring.map(HW.name).join(', ')}` : '')) ui.bring = null;
  else render(HW.view);
}

// ---------- the hex card: value, ring, weather, what lies there, leaves, who stands there, safe at the Tide ----------
const WX_NOW = { sun: 'Everything works as usual.', rain: 'No harvest. Clear costs 2 actions.', fog: 'Explore costs 2 actions. No double step.' };
const pic = (spec, h = 30) => M(`pic${spec}${h}`, () => ART.inline(spec, { height: h + 'px' }));
// who keeps the plant on hex i from dropping a step at the Forest Tide: someone on it, or a Loyalist next to it
function guardOf(v, i) {
  const on = v.players.find(p => p.pos === i);
  if (on) return { p: on, text: `${esc(on.name)} stands on it.` };
  const loy = v.players.find(p => has(p, 6) && p.pos >= 0 && B.adj[p.pos].includes(i));
  return loy ? { p: loy, role: true, text: `${esc(loy.name)}, a Loyalist, stands next to it.` } : null;
}
function infoHTML(v, i, why) {
  const row = (icon, html, cls = '') => `<div class="k-inf-r ${cls}"><span class="k-inf-i">${icon}</span><span>${html}</span></div>`;
  const here = v.players.filter(p => p.pos === i);
  let head, rows = '';
  if (!i) {
    head = `${I.world(v.result === 'won', 46)}<div class="k-inf-t"><b>World Tree</b><small>the centre</small></div>`;
    rows += row(pic('leaves:1', 26), 'No weather, and dead leaves never land here.');
    rows += row(I.fruit(28), 'Step on it and what you carry is placed: fruit and treasures.');
  } else {
    const hx = v.hexes[i], t = v.tiles[i] || {}, w = v.weather[hx.sector], tr = t.treasure ? HW.treasure(t.treasure) : null, lv = t.leaves || 0;
    head = `${I.val(hx.sector, 44)}<div class="k-inf-t"><b>${esc(v.values[hx.sector]?.name || '')}</b><small>Ring ${hx.ring}${hx.ring === 4 ? ' · the edge' : hx.ring === 1 ? ' · by the World Tree' : ''}</small></div>`;
    rows += row(I.wx(w, 30), `<b>${esc(HW.WEATHER[w]?.[1] || '')}</b> · ${WX_NOW[w] || ''}`);
    if (!t.up) rows += row(pic('tile:down', 28), '<b>Face down</b> · a mossy stone: explore to dig it away and see what lies here.');
    if (!t.up && t.hint) rows += row(svgI(hintMark(t.hint === 'something'), '-20 -28 40 40', 26), t.hint === 'something'
      ? '<b>Something lies here</b> · an Individualist sensed it: a spring or a treasure.' : '<b>Nothing here</b> · an Individualist sensed it is empty.');
    else if (t.stage) {
      const next = t.stage === 4 ? (t.harvested ? 'picked since the last Tide' : 'harvest a fruit here (not in rain)')
        : `next: ${esc(stageName(v, t.stage + 1))} by ${t.stage === 3 ? 'Tend' : 'Water, or rain at the Tide'}`;
      rows += row(pic(`stage:${t.stage}${t.stage === 4 ? ':' + hx.sector : ''}`, 32), `<b>${esc(stageName(v, t.stage))}</b> · ${next}`);
    } else if (t.kind === 'spring') rows += row(pic('spring', 30), '<b>A spring</b> · Drink fills your water to 5. It never runs dry.');
    else if (tr) rows += row(I.treasure(tr.id, 30), `<b>${esc(tr.name)}</b> · take it and carry it to the World Tree.`);
    else rows += row(I.icon('sow', 28), '<b>Nothing here</b> · an empty clearing, a place to sow.');
    rows += row(lv ? pic(`leaves:${Math.min(lv, 2)}`, 26) : I.dead(24, 2, true), lv >= 2 ? '<b>Sealed</b> · only a Challenger walks in. No sowing, watering, tending or harvest. Clear it, even from next door.'
      : lv ? '<b>1 layer of dead leaves</b> · one more seals it.' : 'No dead leaves.');
    if (t.up && t.stage >= 1 && t.stage <= 3 && v.phase === 'turn') {
      const g = guardOf(v, i);
      rows += g ? row(g.role ? I.role(6, 30) : medPic(g.p, 34, { badges: false }), `<b>Safe at the Tide</b> · ${g.text}`, 'safe')
        : row(I.dead(26, 4), '<b>At risk at the Tide</b> · if leaves land here, it drops a step. Stand on it to keep it safe.', 'risk');
    }
  }
  if (here.length && v.phase !== 'lobby') rows += `<div class="k-inf-who">${here.map(p => chip(p, 30)).join('')}</div>`;
  const cur = v.isHost && v.phase === 'turn' && v.turn && !v.share && !ui.mode ? HW.player(v.turn.player) : null, mt = cur && moveTargets(v, cur);
  if (mt && (mt.one.includes(i) || mt.two.includes(i))) rows += `<div class="k-inf-act"><button class="k-btn sm" data-movehere="${i}">${I.icon('move', 24)}<span>Move ${esc(cur.name)} here</span></button></div>`;
  return `<div class="k-inf-h">${head}<button class="k-x" data-k="closeInfo" aria-label="Close">✕</button></div>${rows}${why ? `<div class="k-inf-why">${why}</div>` : ''}`;
}
function showInfo(i, why = '') { ui.info = { i, why }; renderInfo(HW.view); }
function closeInfo() { if (!ui.info) return; ui.info = null; renderInfo(HW.view); }
function renderInfo(v) {
  const el = $('k-info'), inf = ui.info;
  B?.L.hit.querySelector('.k-h.inf')?.classList.remove('inf');
  if (!inf || !v || !B || v.phase === 'lobby' || inf.i >= B.n) { ui.info = null; el.hidden = true; HW.patch(el, ''); return; }
  HW.patch(el, `<div class="k-panel k-inf">${infoHTML(v, inf.i, inf.why)}</div>`);
  el.hidden = false;
  B.hg[inf.i]?.classList.add('inf');
  placeInfo();
}
// beside the hex: to its right, or its left when there is no room; always on screen
function placeInfo() {
  const el = $('k-info'), g = ui.info && B?.hg[ui.info.i];
  if (!g || el.hidden) return;
  const r = g.getBoundingClientRect(), cw = el.offsetWidth, ch = el.offsetHeight, W = innerWidth, H = innerHeight, gap = 14;
  let x = r.right + gap;
  if (x + cw > W - 10) x = r.left - gap - cw;
  x = Math.max(10, Math.min(x, W - cw - 10));
  const y = Math.max(10, Math.min(r.top + r.height / 2 - ch / 2, H - ch - 10));
  el.style.left = Math.round(x) + 'px';
  el.style.top = Math.round(y) + 'px';
}

$('k-map').addEventListener('click', e => { if (!e.target.closest('.k-h, .k-med')) closeInfo(); });
$('k-tl').addEventListener('click', e => { const b = e.target.closest('[data-turn]'); if (b) turnMap(+b.dataset.turn); });
$('k-tab').onclick = () => { ui.drawer = !ui.drawer; store.set('hw-drawer', ui.drawer); if (HW.view) renderDrawer(HW.view); };
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || !b.closest('#k-tray, #k-pop, #k-modal, #k-drawer, #k-info')) return;
  const d = b.dataset, v = HW.view;
  if (!v) return;
  if (d.t) return act('timer', { n: +d.t }, `${+d.t % 60 === 0 ? +d.t / 60 + ' min' : d.t + ' s'} timer started`);
  if (d.kick) {
    const p = HW.player(d.kick);
    return twice('kick' + d.kick, `Tap ✕ again to remove ${p?.name}`) && act('kick', { target: d.kick }, `${p?.name} removed`);
  }
  if (d.unphoto) {
    const p = HW.player(d.unphoto);
    return twice('unphoto' + d.unphoto, `Tap again to remove ${p?.name}'s photo`) && act('removePhoto', { target: d.unphoto }, `${p?.name}'s photo removed`);
  }
  if (d.assign) {
    const p = HW.player(d.assign), t = +d.type, types = p.types.slice();
    const i = types.indexOf(t);
    if (i >= 0) types.splice(i, 1);
    else if (types.length >= 3) return HW.toast(`${p.name} already has 3 types. Tap one to take it away.`, 'bad');
    else types.push(t);
    types.sort((a, b) => a - b);
    return act('assignPowers', { target: p.id, types }, `✓ ${p.name}: ${types.map(x => HW.roleName(x)).join(', ') || 'no type'}`);
  }
  if (d.slide != null && d.slide !== '') return goSlide(+d.slide);
  if (d.val != null && d.val !== '') { ui.value = +d.val; HW.toast(`Now tap a glowing hex on the outer ring of ${v.values[ui.value].name}`); return render(v); }
  if (d.bring && v.turn) {
    const p = HW.player(v.turn.player), ids = bringing(v, p).map(q => q.id), k = ids.indexOf(d.bring);
    if (k >= 0) ids.splice(k, 1); else ids.push(d.bring);
    ui.bring = { pid: p.id, pos: p.pos, ids };
    return render(v);
  }
  if (d.movehere && v.turn) return moveTo(v, HW.player(v.turn.player), +d.movehere);
  const cur = v.turn ? HW.player(v.turn.player) : null;
  if (d.do && cur) {
    if (b.getAttribute('aria-disabled') === 'true') {
      // unavailable: say why (the bubble shows on the packet for a moment)
      ui.tip = d.do; HW.toast(`${PK[d.do]}: ${d.why}`, 'bad'); renderTray(v);
      clearTimeout(ui.tipT); ui.tipT = setTimeout(() => { ui.tip = ''; HW.view && renderTray(HW.view); }, 2600);
      return;
    }
    if (d.do === 'move') { ui.mode = ui.mode === 'move' ? null : 'move'; ui.pass = false; closeInfo(); return render(v); }
    if (d.do === 'pass') { ui.pass = !ui.pass; ui.mode = null; return render(v); }
    if (d.do === 'end') {
      // ask twice only when there is still something they could do (not when, say, they have no water left)
      const canStill = moveTargets(v, cur).one.length > 0 || Object.values(turnOptions(v, cur)).some(o => o.ok);
      if (v.turn.actions > 0 && canStill && !twice('end', `${cur.name} still has ${v.turn.actions} action${v.turn.actions > 1 ? 's' : ''}. Tap End turn again to end it.`)) return;
      const ok = await actAs(cur.id, 'endTurn');
      if (ok && HW.view.phase === 'turn' && HW.view.turn) HW.toast(`Next: ${HW.name(HW.view.turn.player)}`, 'ok');
      return;
    }
    const o = turnOptions(v, cur)[d.do];
    ui.pass = false;
    // Water, Tend and Clear pick a hex when more than one is possible.
    if (['water', 'tend', 'clear'].includes(d.do)) {
      if (ui.mode === d.do) { ui.mode = null; return render(v); }
      if (o.targets.length > 1) { ui.mode = d.do; closeInfo(); return render(v); }
      return actAs(cur.id, d.do, { hex: o.targets[0] }, `✓ ${cur.name} ${VERB[d.do]}`);
    }
    return actAs(cur.id, d.do, {}, `✓ ${cur.name} ${VERB[d.do]}`);
  }
  if (d.pass) {
    const from = cur, to = HW.player(d.pass);
    if (!from || !to) return;
    return actAs(from.id, 'pass', { target: to.id, text: d.item }, `✓ ${from.name} passes ${d.item === 'treasure' ? 'the treasure' : d.item} to ${to.name}`);
  }
  switch (d.k) {
    case 'start': return act('start', {}, '✓ The game begins with the briefing');
    case 'slidePrev': return goSlide(slideAt(v) - 1);
    case 'slideNext': return goSlide(slideAt(v) + 1);
    case 'skipBrief': return twice('skipBrief', 'Tap again to end the briefing and enter the forest') && act('begin', {}, '✓ Enter the forest');
    case 'begin': return act('begin', {}, '✓ Enter the forest');
    case 'showBrief': ui.brief = 0; return render(v);
    case 'closeBrief': ui.brief = null; return render(v);
    case 'randomTypes': {
      const typed = v.players.filter(p => p.types.length).length;
      if (typed && !twice('randomTypes', `Tap again: everyone's types are replaced by 1 random type each`)) return;
      return act('randomTypes', {}, '✓ One random type each: tap a number to change one');
    }
    case 'closeInfo': return closeInfo();
    case 'undo': return undo();
    case 'doneShare': return act('doneShare', {}, '✓ Thank you');
    case 'another': return act('another', {}, '✓ Another card from the same deck');
    case 'pickAgain': ui.value = null; return render(v);
    case 'closePass': ui.pass = false; return render(v);
    case 'startChain': {
      const waiting = v.players.filter(p => !p.guessed).length;
      if (waiting && !twice('chain', `${waiting} still guessing. Tap again to start anyway.`)) return;
      return act('startChain', {}, '✓ The tribute chain begins');
    }
    case 'nextTribute': return act('nextTribute', {}, '✓ Next tribute');
    case 'spot': ui.spot = ui.spot === d.id ? '' : d.id; return spotlight($('k-modal'));
    case 'hidePanel': ui.hidePanel = true; return render(v);
    case 'showPanel': ui.hidePanel = false; return render(v);
    case 'askEnd': ui.confirmEnd = true; return render(v);
    case 'cancelEnd': ui.confirmEnd = false; return render(v);
    case 'endGame': {
      ui.confirmEnd = false;
      const ok = await act('endGame', {}, '✓ The game is closed: on to the Secret Owl guesses');
      if (!ok) render(HW.view);
      return;
    }
  }
});
// Escape closes a popover or a mode
addEventListener('keydown', e => {
  const v = HW.view;
  // the briefing: arrow keys and presenter clickers (Page Up / Page Down) step through the slides
  if (v && briefOn(v) && !v.share && v.isHost && !e.target.closest?.('input, select, textarea')) {
    const step = { ArrowRight: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, PageUp: -1 }[e.key];
    if (step) { e.preventDefault(); return goSlide(slideAt(v) + step); }
    if (e.key === 'Escape' && !briefLive(v)) { ui.brief = null; return render(v); }
  }
  // Ctrl+Z / ⌘Z: take back the last tap
  if (v && v.isHost && e.key.toLowerCase() === 'z' && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.target.closest?.('input, select, textarea')) {
    e.preventDefault();
    return undo();
  }
  // 1…9: the numbered hex (the team says "move to 3")
  if (v && v.isHost && /^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey && $('k-modal').hidden && !e.target.closest?.('input, select, textarea')) {
    const i = B?.nums?.[+e.key - 1];
    if (i != null) { e.preventDefault(); return onHex(i); }
  }
  // M Move, E Explore, Enter End turn: the same as tapping that button in the tray
  if (v && v.isHost && v.phase === 'turn' && v.turn && !v.share && !e.metaKey && !e.ctrlKey && !e.altKey && !e.repeat
    && $('k-modal').hidden && !e.target.closest?.('input, select, textarea')) {
    const k = { m: 'move', e: 'explore', Enter: 'end' }[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    const b = k && $('k-tray').querySelector(`[data-do="${k}"]`);
    if (b) { e.preventDefault(); return b.click(); }
  }
  if (e.key !== 'Escape' || !HW.view) return;
  if (ui.info) return closeInfo();
  if (ui.pass || ui.mode) { ui.pass = false; ui.mode = null; render(HW.view); }
});

HW.connect(creds, render, msg => { $('k-modal').hidden = false; $('k-modal').className = 'k-m-lobby'; $('k-modal').innerHTML = `<div class="k-panel"><p class="bad">${esc(msg)}</p><p><a href="/">Back to the start page</a></p></div>`; });
</script>
