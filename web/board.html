<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Tree · Keeper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌳%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking: the game runs on a school Wi-Fi that may have no internet. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body class="kp">
<div id="k-sky"><i class="k-night"></i><i class="k-dawn"></i></div>
<div id="k-map" aria-label="The forest board"></div>
<div id="k-dim" hidden></div>
<header id="k-tl" class="k-sign k-still"></header>
<aside id="k-tr" class="k-sign k-still" hidden></aside>
<div id="k-pop"></div>
<div id="k-tray"></div>
<button id="k-tab" class="k-tab" aria-controls="k-drawer"></button>
<aside id="k-drawer" class="k-still">
  <section class="k-dsec"><h3>Players</h3><div id="k-players"></div></section>
  <section class="k-dsec" id="k-host" hidden>
    <h3>Keeper tools</h3>
    <div class="k-row"><span class="k-lab">Timer</span>
      <button class="k-btn cream sm" data-t="60">1 min</button><button class="k-btn cream sm" data-t="90">90 s</button><button class="k-btn cream sm" data-t="240">4 min</button></div>
    <details class="k-det"><summary>Help a player rejoin · Keeper on another device</summary><div id="hostTools"></div><div id="hostOut"></div></details>
    <details class="k-det" id="endEarly" hidden><summary>End the game early</summary><div id="endBox"></div></details>
  </section>
  <section class="k-dsec"><h3>Trail log</h3><div class="k-log" id="log"></div></section>
  <p class="k-links"><a href="howto.html" target="_blank">How to play</a> · <a href="wiki.html" target="_blank">Wiki</a></p>
</aside>
<div id="k-modal" hidden></div>
<div id="k-banner" aria-live="polite"></div>
<div id="k-moment" hidden></div>
<script src="common.js"></script>
<script src="art.js"></script>
<script src="recorder.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
// A Keeper link (?k=…) moves the Keeper controls to this device.
const params = new URLSearchParams(location.search);
if (params.get('k')) {
  localStorage.setItem('hw-host-' + HW.code, params.get('k'));
  params.delete('k');
  history.replaceState(null, '', `${location.pathname}?${params}`);
}
const host = localStorage.getItem('hw-host-' + HW.code) || '';
const creds = host ? { host } : {};
ART.install();
const esc = HW.esc;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const SPRING = 'cubic-bezier(.34,1.56,.64,1)';
const NS = 'http://www.w3.org/2000/svg';
const S = ART.S, TILT = ART.TILT;
const MED_R = 13.5;                       // photo radius of a medallion on the board (world units)
const now = () => performance.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = { get(k, d) { try { const x = localStorage.getItem(k); return x == null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem(k, JSON.stringify(x)); } catch { } } };

// ---------- actions ----------
// Players say it aloud; the Keeper taps it here, acting for them (`as`). Every tap gets visible feedback:
// the board animates, and a toast says what happened (green) or why the server refused (red).
let busy = false;
async function act(type, extra = {}, okMsg) {
  if (busy) return false;
  busy = true;
  document.body.classList.add('busy');
  try {
    const ok = await HW.act(creds, type, extra);
    if (ok && okMsg) HW.toast(okMsg, 'ok');
    return ok;
  } finally { busy = false; document.body.classList.remove('busy'); }
}
const actAs = (pid, type, extra, okMsg) => act(type, { as: pid, ...extra }, okMsg);

// Keeper choices on this screen that aren't sent yet.
const ui = { value: null, mode: null, bring: '', passFrom: '', pass: false, scope: '', confirmEnd: false, hidePanel: false,
  drawer: store.get('hw-drawer', false), tip: '' };

// ---------- small drawings for the HUD (ART markup, memoised) ----------
const memo = new Map();
const M = (k, f) => { let x = memo.get(k); if (x === undefined) { if (memo.size > 600) memo.clear(); x = f(); memo.set(k, x); } return x; };
const svgI = (inner, vb, w, h, cls) => ART.svg(inner, { viewBox: vb, width: w, height: h ?? w, cls });
const I = {
  icon: (n, s = 40) => M(`ic${n}${s}`, () => svgI(ART.icon(n), '-25 -25 50 50', s)),
  wx: (w, s = 30) => M(`wx${w}${s}`, () => svgI(ART.weatherBadge(w), '-25 -25 50 50', s)),
  val: (i, s = 30) => M(`va${i}${s}`, () => svgI(ART.valueBadge(i), '-25 -25 50 50', s)),
  role: (t, s = 30) => M(`ro${t}${s}`, () => svgI(ART.roleBadge(t), '-25 -25 50 50', s)),
  fruit: (s = 22) => M(`fr${s}`, () => svgI(ART.fruit(), '-13 -13 26 26', s)),
  drop: (s = 18, empty) => M(`dr${s}${empty}`, () => svgI(empty ? '<g opacity=".28" style="filter:url(#art-grey)">' + ART.drop() + '</g>' : ART.drop(), '-13 -13 26 26', s)),
  acorn: (s = 22) => M(`ac${s}`, () => svgI(ART.acorn(), '-13 -13 26 26', s)),
  treasure: (id, s = 30) => M(`tr${id}${s}`, () => svgI(ART.treasure(id), '-19 -19 38 38', s)),
  ghost: (s = 30) => M(`gh${s}`, () => svgI('<circle r="13" fill="rgba(80,50,20,.18)" stroke="#9a7a52" stroke-width="2.2" stroke-dasharray="4 3"/>', '-19 -19 38 38', s)),
  leaf: (on, s = 26) => M(`lf${on}${s}`, () => svgI(ART.leaf({ empty: !on }), '-13 -13 26 26', s)),
  dead: (s = 18, seed = 1, dim) => M(`dl${s}${seed}${dim}`, () => svgI(dim ? '<g opacity=".25">' + ART.deadLeaf({ seed }) + '</g>' : ART.deadLeaf({ seed }), '-10 -10 20 20', s)),
  bigTree: (s, h = 44, done = true) => M(`bt${s}${h}${done}`, () => svgI(ART.plant(4, s, { seed: 7 }), '-40 -92 80 96', h * 80 / 96, h, done ? '' : 'k-dimtree')),
  world: (awake, h = 64) => M(`wt${awake}${h}`, () => svgI(ART.worldTree({ awake }), '-96 -205 192 215', h * 192 / 215, h)),
  hollow: (s = 120) => M(`ho${s}`, () => svgI(ART.worldTree({ awake: true, fruit: 4 }), '-30 -84 60 52', s, s * 52 / 60)),
  sprig: (s = 44, flip) => M(`sp${s}${flip}`, () => svgI(ART.sprig(), '-24 -16 48 32', s, s * 32 / 48, flip ? 'k-flip' : '')),
};
const photoURL = p => (p && p.photo ? `/api/games/${HW.code}/photo/${encodeURIComponent(p.id)}?v=${p.photo}` : '');
// a player's medallion as a small picture for the HUD (no stump)
function medPic(p, size = 56, o = {}) {
  if (!p) return '';
  // outside play (lobby, finale) the water crown is just decoration: full
  const playing = ['enter', 'turn'].includes(HW.view?.phase), water = o.water ?? (playing ? p.water : 5), st = o.state || '';
  const fruit = o.badges === false ? 0 : p.fruit, treasure = o.badges === false ? '' : p.treasure;
  // memoised, so an unchanged panel keeps the very same HTML and HW.patch leaves it (and its taps) alone
  return M(`mp|${p.id}|${photoURL(p)}|${p.name}|${p.color}|${water}|${fruit}|${treasure}|${st}|${size}`, () =>
    svgI(ART.medallion({ photo: photoURL(p), name: p.name, color: p.color, water, fruit, treasure, state: st, r: 20, stump: false }), '-42 -44 84 86', size, size, 'k-medpic'));
}
const pname = id => esc(HW.name(id));
const chip = (p, size = 30) => p ? `<span class="k-chip">${medPic(p, size, { badges: false })}<b>${esc(p.name)}</b></span>` : '';

// ---------- rules the Keeper screen checks before offering a tap ----------
// The server checks again and its refusal is shown; these only decide what glows.
const has = (p, t) => (p?.types || []).includes(t);
const wxOf = (v, i) => (i > 0 && v.hexes[i] ? v.weather[v.hexes[i].sector] : null);
const tileOf = (v, i) => (i > 0 ? v.tiles[i] : null);
const sealed = (v, i) => !!tileOf(v, i) && tileOf(v, i).leaves >= 2;
const stageName = (v, s) => (v.stages && v.stages[s]) || HW.STAGES[s] || '';

function moveTargets(v, p) {
  if (!p || p.pos < 0 || p.water <= 0 || !v.turn || v.turn.actions < 1) return { one: [], two: [] };
  const one = B.adj[p.pos].filter(j => !sealed(v, j) || has(p, 8));
  const two = [];
  if (has(p, 7) && !v.turn.enthusiastUsed && wxOf(v, p.pos) !== 'fog')
    for (const m of B.adj[p.pos].filter(j => !sealed(v, j) && wxOf(v, j) !== 'fog'))
      for (const j of B.adj[m]) if (j !== p.pos && !sealed(v, j) && wxOf(v, j) !== 'fog' && !one.includes(j) && !two.includes(j)) two.push(j);
  return { one, two };
}
// Passing: on the same hex, or between a Peacemaker and a teammate on a neighbouring hex (either way).
function canPass(v, a, b) {
  if (!a || !b || a.id === b.id || a.pos < 0 || b.pos < 0) return false;
  if (a.pos === b.pos) return true;
  return (has(a, 9) || has(b, 9)) && B.adj[a.pos].includes(b.pos);
}
const reachable = (v, p) => [p.pos, ...(has(p, 2) ? B.adj[p.pos] : [])].filter(i => i > 0);
function targetsFor(v, p, mode) {
  if (mode === 'water') return reachable(v, p).filter(i => [1, 2].includes(v.tiles[i].stage) && v.tiles[i].leaves < 2);
  if (mode === 'tend') return reachable(v, p).filter(i => v.tiles[i].stage === 3 && v.tiles[i].leaves < 2);
  if (mode === 'clear') return [p.pos, ...B.adj[p.pos]].filter(i => i > 0 && v.tiles[i].leaves > 0)
    .filter(i => v.turn.actions >= clearCost(v, p, i));
  return [];
}
const clearCost = (v, p, i) => (wxOf(v, i) === 'rain' && !has(p, 1) ? 2 : 1);

// What the current player can do, with the reason when they can't.
function turnOptions(v, p) {
  const t = v.turn, left = t.actions, pos = p.pos, tile = tileOf(v, pos), w = wxOf(v, pos);
  const onTree = pos === 0, helper = has(p, 2);
  const o = {};
  const need = (n, ok, why) => (left < n ? { ok: false, why: left ? `needs ${n} actions` : 'no actions left' } : ok ? { ok: true } : { ok: false, why });
  const exploreCost = w === 'fog' ? 2 : 1;
  o.explore = need(exploreCost, tile && !tile.up, onTree ? 'nothing to explore here' : 'already explored');
  o.explore.cost = exploreCost; o.explore.wx = w;
  o.sow = need(1, tile && tile.up && tile.kind !== 'spring' && !tile.treasure && !tile.stage && tile.leaves < 2,
    onTree ? 'not on the World Tree' : !tile.up ? 'explore it first' : tile.kind === 'spring' ? 'a spring' : tile.treasure ? 'a treasure lies here'
      : tile.stage ? 'already growing' : 'sealed by leaves');
  const wt = targetsFor(v, p, 'water');
  o.water = need(1, p.water > 0 && wt.length, p.water <= 0 ? 'no water to give' : helper ? 'no Seeded or Sprout here or next door' : 'not Seeded or Sprout');
  o.water.targets = wt;
  const tt = targetsFor(v, p, 'tend');
  o.tend = need(1, tt.length, helper ? 'no Sapling here or next door' : 'no Sapling here');
  o.tend.targets = tt;
  const near = [pos, ...B.adj[pos]].filter(i => i > 0 && v.tiles[i].leaves > 0);
  const ct = targetsFor(v, p, 'clear');
  o.clear = need(1, ct.length, !near.length ? 'no leaves nearby' : 'needs 2 actions in rain');
  o.clear.targets = ct;
  o.clear.cost = near.length && near.every(i => clearCost(v, p, i) === 2) ? 2 : 1;
  o.clear.wx = o.clear.cost > 1 ? 'rain' : '';
  o.harvest = need(1, tile && tile.stage === 4 && tile.leaves < 2 && w !== 'rain' && !tile.harvested && p.fruit < HW.MAX_FRUIT,
    !tile || tile.stage !== 4 ? 'no Big Tree here' : tile.leaves >= 2 ? 'sealed by leaves' : w === 'rain' ? 'not in the rain'
      : tile.harvested ? 'picked since the Tide' : 'carrying 2 fruit');
  o.take = need(1, tile && tile.up && tile.treasure && !p.treasure, tile && tile.up && tile.treasure ? 'carrying a treasure' : 'no treasure here');
  o.drink = need(1, tile && tile.up && tile.kind === 'spring' && p.water < HW.MAX_WATER, tile && tile.up && tile.kind === 'spring' ? 'already full' : 'no spring here');
  return o;
}

// ==================================================================================================
// The board: a full-screen 2.5D map in stacked SVG layers (same viewBox), built once per game and
// patched in place. Static tiles sit in their own layer so the animated layers above never repaint them.
// Painter order: tiles (+ ground dusk) → weather + dappled light → objects → mist, fireflies, sector signs
// → highlight rims + hit areas → medallions → effects.
// ==================================================================================================
let B = null;
const TR = (x, y) => `translate(${x.toFixed(1)},${y.toFixed(1)})`;
const LAYERS = ['tile', 'wx', 'obj', 'air', 'hit', 'med', 'fx'];
// Animations hold back parts of the new state until their moment (a flipped tile, a plant that pops).
const hold = { tile: new Map(), obj: new Map() };
const ovr = {};          // pid → {water, fruit, treasure}: what a medallion shows until an animation lands
let queueEnd = 0;        // when the animations already scheduled are done (the share card waits for it)

function buildBoard(v) {
  const map = $('k-map');
  map.innerHTML = '';
  const hx = v.hexes, xy = hx.map(h => ART.project(h.q, h.r));
  const at = {};
  hx.forEach((h, i) => (at[h.q + ',' + h.r] = i));
  const adj = hx.map(h => ART.DIRS.map(([dq, dr]) => at[(h.q + dq) + ',' + (h.r + dr)]).filter(i => i !== undefined));
  const order = hx.map((_, i) => i).sort((a, b) => xy[a][1] - xy[b][1] || xy[a][0] - xy[b][0]);
  const L = {};
  for (const n of LAYERS) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'k-layer k-L' + n);
    s.setAttribute('preserveAspectRatio', 'none');
    map.appendChild(s);
    L[n] = s;
  }
  const sc = [0, 1, 2, 3, 4, 5].map(s => hx.map((h, i) => [h, i]).filter(([h]) => h.sector === s).map(([, i]) => xy[i]));
  // tiles + the ground dusk (one group with one opacity, so overlapping hexes don't double-darken)
  L.tile.innerHTML = order.map(i => `<g transform="${TR(...xy[i])}"><g class="k-tw"></g></g>`).join('')
    + `<g class="k-dusk" id="kDusk">${order.map(i => `<polygon data-d="${i}" points="${ART.tileOutline(hx[i].ring)}" transform="${TR(...xy[i])}"/>`).join('')}</g>`;
  const tw = [], dusk = [];
  L.tile.querySelectorAll('.k-tw').forEach((g, k) => (tw[order[k]] = g));
  L.tile.querySelectorAll('[data-d]').forEach(p => (dusk[+p.dataset.d] = p));
  // weather and dappled light per sector
  L.wx.innerHTML = [0, 1, 2, 3, 4, 5].map(s => `<g class="k-wxs" data-s="${s}"></g><g class="k-dap" data-s="${s}">${ART.dapple(sc[s], { seed: 40 + s })}</g>`).join('');
  // objects, one slot per hex in painter order
  L.obj.innerHTML = order.map(i => `<g transform="${TR(...xy[i])}"><g class="k-ow"></g></g>`).join('');
  const ow = [];
  L.obj.querySelectorAll('.k-ow').forEach((g, k) => (ow[order[k]] = g));
  // mist + fireflies over asleep sectors; sector signs at the board's outer edge
  let air = '';
  for (let s = 0; s < 6; s++) {
    const R = ART.rng(900 + s);
    let ff = '';
    for (let k = 0; k < 3; k++) { const [x, y] = sc[s][Math.floor(R() * sc[s].length)]; ff += ART.firefly(x + (R() - .5) * 40, y - 20 - R() * 30, { seed: s * 10 + k }); }
    air += `<g class="k-mist" data-s="${s}">${ART.mist(sc[s], { seed: 70 + s, n: 2 })}${ff}</g>`;
  }
  air += `<g class="k-mist k-mist0" data-s="-1">${ART.mist([[0, -30]], { seed: 77, n: 1 })}</g>`;
  air += SIGN.map((p, s) => `<g class="k-sign-g" data-s="${s}" transform="${TR(p[0], p[1])} scale(.72)">${signMarkup(v, s)}</g>`).join('');
  L.air.innerHTML = air;
  // highlight rims + hit areas (front tiles last, so they win where a back tile's wall hides behind them)
  const face = ART.facePoints(S, .9);
  L.hit.innerHTML = order.map(i => `<g class="k-h" data-i="${i}" transform="${TR(...xy[i])}"><polygon class="k-rim-o" points="${face}"/><polygon class="k-rim" points="${face}"/><polygon class="k-hitp" points="${ART.tileOutline(hx[i].ring)}"/></g>`).join('');
  const hg = [];
  L.hit.querySelectorAll('.k-h').forEach(g => (hg[+g.dataset.i] = g));
  L.hit.addEventListener('click', e => { const g = e.target.closest('.k-h'); if (g) onHex(+g.dataset.i); });
  // tapping a medallion means the hex it stands on; pointing at one lights that hex
  L.med.addEventListener('click', e => { const m = e.target.closest('.k-med'); if (m && m.dataset.hex) onHex(+m.dataset.hex); });
  const hov = i => { L.hit.querySelector('.k-h.hov')?.classList.remove('hov'); if (i != null) L.hit.querySelector(`.k-h[data-i="${i}"]`)?.classList.add('hov'); };
  L.med.addEventListener('mouseover', e => { const m = e.target.closest('.k-med'); hov(m ? m.dataset.hex : null); });
  L.med.addEventListener('mouseout', e => { if (!e.relatedTarget?.closest?.('.k-med')) hov(null); });
  L.med.innerHTML = order.map(i => `<g data-m="${i}"></g>`).join('');
  const mg = [];
  L.med.querySelectorAll('[data-m]').forEach(g => (mg[+g.dataset.m] = g));
  L.fx.innerHTML = '<g id="kFx"></g>';
  // the board's extent: tiles with walls, the World Tree's crown, medallions on the top row, the signs
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  hx.forEach((h, i) => { const [x, y] = xy[i]; x0 = Math.min(x0, x - 36); x1 = Math.max(x1, x + 36); y0 = Math.min(y0, y - 62); y1 = Math.max(y1, y + 24 + ART.depth(h.ring) + 7); });
  y0 = Math.min(y0, xy[0][1] - 4.75 * S);
  SIGN.forEach(([x, y]) => { x0 = Math.min(x0, x - 50); x1 = Math.max(x1, x + 50); y0 = Math.min(y0, y - 44); y1 = Math.max(y1, y + 22); });
  B = { code: v.code, n: hx.length, hx, xy, adj, order, L, sc, tw, ow, hg, dusk, mg, fx: L.fx.firstChild,
    tk: [], ok: [], meds: {}, medPos: {}, wk: [], awake: null, won: null, deep: null, bbox: [x0, y0, x1 - x0, y1 - y0], k: 1, vx: 0, vy: 0 };
  fit();
}

// Sector signs: weather badge + value badge + name, just outside each sector's outer edge (ZERAOS clockwise
// from the top). Z and A slide sideways so the World Tree's crown and the action tray stay clear.
const SIGN = [[206, -176], [282, -64], [246, 112], [-206, 178], [-282, 64], [-246, -112]];
function signMarkup(v, s) {
  const x = v.values[s] || {}, w = v.weather[s] || 'sun', name = esc(x.name || ''), wd = Math.max(70, (x.name || '').length * 7.2 + 34);
  return `<g class="k-plaque"><rect x="${-wd / 2}" y="-1" width="${wd}" height="21" rx="10" fill="#6b3f1d" stroke="#2e1709" stroke-width="2.4"/>
    <rect x="${-wd / 2 + 2.5}" y="1.5" width="${wd - 5}" height="7" rx="3.5" fill="#8a5530"/>
    <g transform="translate(${-wd / 2 + 4},9.5) scale(.5)">${ART.valueBadge(s)}</g>
    <text x="${10}" y="15" text-anchor="middle" font-family="Lilita One, Nunito, sans-serif" font-size="12.5" fill="#fff6e0" stroke="#2e1709" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${name}</text></g>
    <g transform="translate(0,-21)"><g class="k-wb" data-w="${w}">${ART.weatherBadge(w, { size: 38 })}</g></g>`;
}

// Fits the board's extent into the screen minus the HUD (the tray at the bottom, the drawer when open).
// The tray's height is measured; within a phase the reserve only grows, so the board doesn't jump on every share.
let trayMax = { phase: '', h: 0 };
function trayReserve(v) { return v && ['enter', 'turn'].includes(v.phase) ? Math.max(trayMax.phase === v.phase ? trayMax.h : 0, Math.min(150, innerHeight * .15)) : 18; }
// HUD scale: 1 at 1920×1080, smaller on a laptop or an old projector, a little bigger on a 4K screen
function hudScale() {
  const k = Math.max(.62, Math.min(1.3, innerWidth / 1920, innerHeight / 1080));
  document.body.style.setProperty('--hud', k.toFixed(3));
  document.body.style.setProperty('--hudw', Math.max(.75, Math.min(1.3, k * 1.08)).toFixed(3));
}
hudScale();
function fit() {
  if (!B) return;
  if (queueEnd - now() > 60) { clearTimeout(fit.q); fit.q = setTimeout(fit, queueEnd - now() + 50); return; }
  const W = innerWidth, H = innerHeight, v = HW.view;
  const drawer = ui.drawer && W >= 900 ? $('k-drawer').getBoundingClientRect().width + 14 : 0;
  let left = 10, right = 10 + drawer;
  // in the lobby the map sits between the join panel and the team panel
  const lobL = v?.phase === 'lobby' && document.querySelector('#k-modal .k-lob-l'), lobR = lobL && document.querySelector('#k-modal .k-lob-r');
  // (the value signs stick out past the hexes: keep them clear of the panels too)
  if (lobL && lobR && W >= 900) { left = lobL.getBoundingClientRect().right + 40; right = Math.max(right, W - lobR.getBoundingClientRect().left + 40); }
  const top = 6, bottom = trayReserve(v);
  const aw = W - left - right, ah = H - top - bottom, [bx, by, bw, bh] = B.bbox;
  const k = Math.min(aw / bw, ah / bh);
  const vx = bx + bw / 2 - (left + aw / 2) / k, vy = by + bh / 2 - (top + ah / 2) / k;
  const vb = `${vx.toFixed(2)} ${vy.toFixed(2)} ${(W / k).toFixed(2)} ${(H / k).toFixed(2)}`;
  if (vb === B.vb) return;

// Rendering a view
// ==================================================================================================
let prevView = null;

  if (!B.tidePending) patchWeather(v, false);

  if (!B.wakePending && !B.dryPending) patchDusk(v, true);

  run(v, evs);
  // the HUD
  if (B.fitKey && !B.fitKey.endsWith('|' + trayReserve(v))) fit();
  renderTopLeft(v);
  renderGoals(v);
  renderTray(v);
  renderPop(v);
  renderDrawer(v);
  renderModal(v);
  // recording each share (web/recorder.js): it watches the open share and records the Keeper's microphone
  window.HWRec?.view(v);
  if (v.phase === 'lobby' || prevView?.phase === 'lobby') fit();
  prevView = v;
}

// ---------- HUD: whose turn + the action tray of seed packets ----------

function packet(k, o) {

  return `<button class="k-pk k-pk-${k}${o.ok ? '' : ' no'}${o.sel ? ' sel' : ''}${o.cost > 1 ? ' two' : ''}${ui.tip === k ? ' tip' : ''}" data-do="${k}"${o.ok ? '' : ` aria-disabled="true" data-why="${esc(o.why)}"`}>
    <span class="k-pk-art">${I.icon(k, 46)}</span><span class="k-pk-name">${PK[k]}</span>${cost}${o.ok ? '' : `<span class="k-tipb">${esc(o.why)}</span>`}</button>`;
}
function whereLine(v, p) {

  if (pos < 0) return '';
  const h = v.hexes[pos], t = v.tiles[pos] || {}, w = v.weather[h.sector], tr = t.treasure ? HW.treasure(t.treasure) : null;
  const what = !t.up ? 'face down' : t.stage ? stageName(v, t.stage) + (t.stage === 4 && t.harvested ? ' (picked)' : '') : t.kind === 'spring' ? 'a spring' : tr ? esc(tr.name) : 'empty';
  return `${I.val(h.sector, 22)}<span>${esc(v.values[h.sector]?.name)} · Ring ${h.ring}</span>${I.wx(w, 22)}<span>${esc(HW.weatherName(w).replace(/^\S+\s/, ''))} · ${what}${t.leaves ? ` · ${t.leaves >= 2 ? 'sealed' : 'leaves'}` : ''}</span>`;
}
function carrying(p) {
  return `<span class="k-drops">${[0, 1, 2, 3, 4].map(k => I.drop(15, k >= p.water)).join('')}</span>`
    + (p.fruit ? `<span class="k-carry">${I.fruit(18)}${p.fruit > 1 ? '<b>×2</b>' : ''}</span>` : '')
    + (p.treasure ? `<span class="k-carry">${I.treasure(p.treasure, 22)}</span>` : '');
}
function whoBlock(v, p, extra = '') {
  const t = v.turn, max = v.actionsPerTurn || 2, left = t ? t.actions : 0;
  return `<div class="k-who k-wood">${medPic(p, 88, { state: 'turn' })}<div class="k-who-t">
    <div class="k-who-n">${esc(p.name)}${v.phase === 'turn' ? `<span class="k-acts" title="${left} of ${max} actions left">${[...Array(max)].map((_, k) => I.leaf(k < left, 30)).join('')}</span>` : ''}</div>
    ${v.phase === 'turn' ? `<div class="k-where">${whereLine(v, p)}</div><div class="k-car">${carrying(p)}<span class="k-roles">${p.types.map(x => `<span title="${esc(HW.roleName(x))}: ${esc(HW.roleText(x))}">${I.role(x, 24)}</span>`).join('')}</span></div>` : ''}
    ${extra}</div></div>`;
}
function renderTray(v) {
  const el = $('k-tray');
  let h = '';
  if (v.phase === 'enter') {
    const p = HW.player(v.current);
    if (p && !v.share) {
      const x = ui.value != null ? v.values[ui.value] : null;
      h = whoBlock(v, p, x ? `<div class="k-hint">${I.val(ui.value, 26)} <span>Stands for <b>${esc(x.name)}</b>: tap a glowing hex on its outer ring.</span>
        <button class="k-btn cream sm" data-k="pickAgain">Change</button></div>` : `<div class="k-hint"><span>Which value does ${esc(p.name)} stand for?</span></div>`);
    }
  } else if (v.phase === 'turn' && v.turn) {

    if (p) {

      else if (!v.isHost) h = whoBlock(v, p) + `<div class="k-wait k-wood"><span>They say what they do;</span><small>the Keeper taps it.</small></div>`;
      else { const t = turnHint(v, p); h = whoBlock(v, p, t.bring) + `<div class="k-shelf"><div class="k-cap">${t.hint}</div><div class="k-packets">${packets(v, p)}</div></div>`; }
    }
  }
  el.className = h ? 'on k-' + v.phase : '';
  HW.patch(el, h);
  const th = h ? el.getBoundingClientRect().height + 16 : 0;
  document.body.style.setProperty('--trayh', th + 'px');

function packets(v, p) {
  const t = v.turn, o = turnOptions(v, p), m = moveTargets(v, p), canMove = m.one.length + m.two.length > 0;
  const mv = { ok: canMove, sel: !ui.mode && !ui.pass && canMove, why: p.water <= 0 ? 'no water: someone must pass 1' : !t.actions ? 'no actions left' : 'nowhere to go', cost: 1 };
  const holds = q => q.water > 0 || q.fruit > 0 || !!q.treasure;
  const canGive = v.players.some(q => holds(q) && v.players.some(r => canPass(v, q, r)));
  let h = packet('move', mv);
  for (const k of ['explore', 'sow', 'water', 'tend', 'clear', 'harvest', 'take', 'drink']) h += packet(k, Object.assign({}, o[k], { sel: ui.mode === k, cost: o[k].cost || 1 }));
  h += packet('pass', { ok: canGive, sel: ui.pass, free: true, why: 'nobody can pass right now' });
  h += packet('end', { ok: true, free: true, sel: false });
  return h;
}

// what to tap now, and the Challenger's bring choice, under the name in the who block
function turnHint(v, p) {
  const mates = has(p, 8) && v.turn.actions && p.water > 0 ? v.players.filter(q => q.id !== p.id && q.pos === p.pos) : [];
  const hint = ui.pass ? 'Pick who passes what to whom'
    : ui.mode ? `Tap a glowing hex to <b>${ui.mode}</b> · tap ${PK[ui.mode]} again to cancel`
      : p.water <= 0 ? `No water: someone must pass 1 before ${esc(p.name)} can move`
        : !v.turn.actions ? 'No actions left: pass things, or end the turn'
          : moveTargets(v, p).two.length ? 'Tap a glowing hex to move (dashed: the double step)' : 'Tap a glowing hex to move, or pick a packet';
  // many mates (a crowd on the World Tree): just their medallions, the name shows on hover
  const few = mates.length <= 3;
  return { hint, bring: mates.length && !ui.pass ? `<div class="k-bring"><span>${I.role(8, 22)} Bring:</span>${mates.map(q => `<button class="k-mate${few ? '' : ' pic'}${ui.bring === q.id ? ' sel' : ''}" data-bring="${esc(q.id)}" title="Bring ${esc(q.name)}">${few ? chip(q, 26) : medPic(q, 30, { badges: false })}</button>`).join('')}</div>` : '' };
}

// Passing is free: water, fruit or a treasure, between any two players the rules allow.

  if (!givers.length) { ui.pass = false; return ''; }
  if (!givers.some(q => q.id === ui.passFrom)) ui.passFrom = givers.some(q => q.id === cur.id) ? cur.id : givers[0].id;
  const a = HW.player(ui.passFrom), mates = v.players.filter(r => canPass(v, a, r));

    <div class="k-pass-row"><span class="k-lab">To</span>${mates.map(r => `<span class="k-mate to">${chip(r, 34)}

      ${a.fruit > 0 ? item(r, 'fruit', I.fruit(28), r.fruit < HW.MAX_FRUIT, `${r.name} carries 2 fruit`) : ''}
      ${a.treasure ? item(r, 'treasure', I.treasure(a.treasure, 30), !r.treasure, `${r.name} carries a treasure`) : ''}</span>`).join('') || '<span class="k-muted">nobody in reach</span>'}</div></div>`;
}

// ---------- centred panels and cards over the dimmed board ----------
let shownModal = '';

    const sk = `share|${v.share.idx}|${v.share.kind}|${v.share.player}|${v.isHost}`;
    // a new card waits for the board's animations (a fruit still flying, the treasure moment)
    const wait = shownModal === sk ? 0 : queueEnd - now();
    if (wait > 60) { clearTimeout(renderModal.t); renderModal.t = setTimeout(() => HW.view && renderModal(HW.view), wait + 20); }
    else { key = sk; cls = 'card'; }
  } else if (v.phase === 'lobby') { key = 'lobby'; cls = 'lobby'; h = lobbyHTML(v); }
  else if (v.phase === 'enter' && ui.value == null) { key = 'enter'; cls = 'enter'; h = enterHTML(v); }
  else if (['guess', 'chain', 'end'].includes(v.phase) && shownModal !== 'fin' && queueEnd - now() > 60) {
    clearTimeout(renderModal.t); renderModal.t = setTimeout(() => HW.view && renderModal(HW.view), queueEnd - now() + 300);
  }
  else if (['guess', 'chain', 'end'].includes(v.phase)) {

  el.className = key ? 'k-m-' + cls : '';
  if (!key) { shownModal = ''; el._html = ''; el.innerHTML = ''; return; }
  if (cls === 'card') {

    else {

    }
  } else HW.patch(el, h);
  shownModal = key;
}

  const why = n < min ? `Needs at least ${min} players (${n} joined).` : n > max ? `At most ${max} players.`
    : untyped.length ? `Give every player a type: ${untyped.map(p => esc(p.name)).join(', ')}.` : '';
  return h + `<div class="k-start"><button class="k-btn big" data-k="start" ${why ? 'disabled' : ''}>Start: enter the forest</button>${why ? `<span class="k-muted">${why}</span>` : ''}</div></div>`;
}

function enterHTML(v) {
  const p = HW.player(v.current);
  if (!p) return '';
  return `<div class="k-panel k-enter"><div class="k-enter-h">${medPic(p, 96, { state: 'turn', badges: false })}<div><div class="k-kicker">Entering the forest</div>
    <h2>${esc(p.name)}, which value do you stand for?</h2><p class="k-muted">${v.isHost ? 'They say it aloud; tap it. Then tap a hex on that value\'s outer ring.' : 'They say it aloud and tell us why; the Keeper places them on the outer ring of that value.'}</p></div></div>
    <div class="k-vals">${v.values.map((x, i) => `<button class="k-val" style="--vc:${x.color}" data-val="${i}" ${v.isHost ? '' : 'disabled'}>${I.val(i, 54)}<span><b>${esc(x.name)}</b><small>${esc(x.tagline)}</small></span></button>`).join('')}</div></div>`;
}

const DECK = { 1: ['Deep', '#1f6e5a'], 2: ['Story', '#b8742a'], 3: ['Light', '#7cbf3a'] };
function shareHTML(v) {
  const s = v.share, p = HW.player(s.player), tre = s.kind === 'treasure' ? HW.treasure(s.sub) : null;
  let head = '', kind = '', color = '#5cb84a', sub = '';
  if (s.kind === 'why') {
    const vi = p?.value ?? -1, x = v.values[vi];
    color = x?.color || color; kind = x ? `Why ${esc(x.name)}` : 'Entering the forest';
    head = vi >= 0 ? I.val(vi, 84) : ''; sub = s.sub;
  } else if (s.kind === 'ring') {
    const r = +s.sub, name = (v.ringDecks && v.ringDecks[r]) || DECK[r]?.[0] || '';
    color = DECK[r]?.[1] || color; kind = `${esc(name)} <small>· Ring ${r} card</small>`;
    head = `<span class="k-ringno"><b>${r}</b><small>Ring</small></span>`;
  } else if (s.kind === 'harvest') {
    color = '#e8344f'; kind = 'Harvest story'; head = I.fruit(84); sub = s.sub;
  } else if (s.kind === 'heartwood') {
    color = '#8a5a36'; kind = 'Heartwood <small>· a fruit on the World Tree</small>'; head = I.hollow(120);
  } else if (s.kind === 'treasure') {
    color = '#e2a93b'; kind = `Treasure found: ${esc(tre?.name || 'a treasure')}`;
    head = `<span class="k-cardrays">${svgI(ART.rays({ n: 16, color: '#fffbe6', opacity: .7 }), '-50 -50 100 100', 220)}</span>${tre ? I.treasure(tre.id, 110) : ''}`;
  }
  let h = `<div class="k-card k-card-${s.kind}" style="--cc:${color}"><span class="k-sprig tr big">${I.sprig(80, true)}</span><div class="k-card-head"><div class="k-card-art">${head}</div><div class="k-card-kind">${kind}</div></div>
    <div class="k-card-body">${tre ? `<div class="k-card-mean">${esc(tre.meaning)}</div>` : ''}<div class="k-card-q">${esc(s.prompt)}</div>${sub ? `<div class="k-card-sub">${esc(sub)}</div>` : ''}`;
  h += s.kind === 'treasure'
    ? `<div class="k-card-who">${p ? `${chip(p, 46)}<span><b>${s.of ? `answer ${s.seq} of ${s.of}` : 'answers'}</b> · one sentence each, round the table${s.by && HW.player(s.by) ? ` · found by ${esc(HW.player(s.by).name)}` : ''}</span>` : ''}</div>`
    : `<div class="k-card-who">${chip(p, 46)}<span>shares · listeners give trust on their phones</span><span class="k-trust">${I.acorn(34)}<b id="trustN">${s.trustCount || 0}</b></span></div>`;
  h += `<div class="timer k-cardtimer" data-timer></div>`;
  if (v.isHost) h += `<div class="k-card-btns"><button class="k-btn big" data-k="doneShare">Done sharing ✓</button><button class="k-btn cream" data-t="60">1 min</button><button class="k-btn cream" data-t="90">90 s</button></div>`;
  return h + '</div></div>';
}

function finaleHTML(v) {
  const won = v.result === 'won';
  let h = `<div class="k-panel k-fin"><button class="k-x k-hide" data-k="hidePanel" title="Show the forest">Show the forest</button>`;
  if (won) h += `<div class="k-res won">${I.world(true, 92)}<div><h2>The forest woke${v.round ? ` in round ${v.round}` : ''}!</h2><p>Purpose, light and each other.</p></div></div>`;
  else if (v.result === 'lost') h += `<div class="k-res lost">${I.world(false, 80)}<div><h2>Everyone ran dry${v.round ? ` in round ${v.round}` : ''}.</h2><p>The forest sleeps on.</p></div></div>`;
  else if (v.result === 'ended') h += `<div class="k-res lost">${I.world(false, 80)}<div><h2>The Keeper closed the game.</h2><p>The forest is still asleep.</p></div></div>`;
  if (v.phase === 'guess') {
    const done = v.players.filter(p => p.guessed).length;
    h += `<div class="k-fin-h">${I.icon('owl', 54)}<div><h2>Who was your Secret Owl?</h2><p>Guess on your phone. <b>${done}/${v.players.length}</b> guessed.</p></div></div>
      <div class="k-guess">${v.players.map(p => `<div class="k-gp${p.guessed ? ' ok' : ''}">${medPic(p, 62, { badges: false })}<b>${esc(p.name)}</b><small>${p.guessed ? '✓ guessed' : 'thinking…'}</small></div>`).join('')}</div>`;
    if (v.isHost) h += `<div class="k-fin-btns"><button class="k-btn big${done < v.players.length ? ' cream' : ''}" data-k="startChain">Start the tribute chain →</button></div>`;
  }
  if (v.phase === 'chain' && v.tribute) {
    const tr = v.tribute, g = HW.player(tr.giver), r = HW.player(tr.receiver);
    h += `<div class="k-kicker">Tribute ${tr.idx + 1} of ${tr.total}</div>
      <div class="k-trib">${g ? `<div>${medPic(g, 120, { badges: false })}<b>${esc(g.name)}</b></div>` : ''}<span class="k-arrow">→</span>${r ? `<div>${medPic(r, 120, { badges: false })}<b>${esc(r.name)}</b></div>` : ''}</div>
      <p class="k-trib-q">“Three things I discovered about you today, and one thing I appreciate.”</p>
      <p class="k-muted">Then ${esc(r?.name || '')} says how many of the three were true, and gives their own tribute.</p><div class="timer k-cardtimer" data-timer></div>`;
    if (v.isHost) h += `<div class="k-fin-btns"><button class="k-btn big" data-k="nextTribute">Next tribute →</button><button class="k-btn cream" data-t="60">1 min</button><button class="k-btn cream" data-t="90">90 s</button></div>`;
  }
  if (v.phase === 'end') {
    h += `<div class="k-fin-h"><div><h2>Recognition</h2><p>No points and no winner: the team ${won ? 'woke the forest' : 'played'} together. Here is what each of you received.</p></div></div>
      <div class="k-recog">${(v.recognition || []).map(r => { const p = HW.player(r.id) || r; return `<div class="k-rc">${medPic(p, 64, { badges: false })}<div class="k-rc-t"><b>${esc(r.name)}</b>
        <span class="k-rc-a">${I.acorn(24)}<b>${r.trust}</b>${r.givers ? `<small>from ${r.givers} ${r.givers === 1 ? 'person' : 'people'}</small>` : ''}</span>
        <span>${I.icon('owl', 24)}<small>Owl: <b>${esc(r.owlName || '')}</b></small></span>
        <span class="k-rc-tags">${r.guessedRight ? '<i class="good">spotted their Owl</i>' : '<i>missed their Owl</i>'}${r.owlHidden ? '<i class="good">stayed hidden</i>' : '<i>was spotted</i>'}</span></div></div>`; }).join('')}</div>`;
  }
  return h + '</div>';
}

// ---------- taps ----------
// Taps that need a second tap within 3 s, so a stray tap doesn't end a turn early.
const armed = {};
function twice(key, msg) {
  if (Date.now() - (armed[key] || 0) < 3000) { armed[key] = 0; return true; }
  armed[key] = Date.now();
  HW.toast(msg);
  return false;
}
const VERB = { explore: 'explores', sow: 'sows a seed', water: 'waters', tend: 'tends the Sapling', clear: 'clears leaves', harvest: 'harvests a fruit', take: 'takes the treasure', drink: 'drinks at the spring' };

async function onHex(i) {
  const v = HW.view;
  if (!v?.isHost) return;
  if (v.share) return HW.toast(`${HW.name(v.share.player)} is sharing: tap Done sharing first.`, 'bad');
  const { hl, hl2 } = highlights(v);
  if (v.phase === 'enter') {
    if (ui.value == null) return HW.toast('First tap the value they stand for.', 'bad');
    if (!hl.has(i)) return HW.toast(`Tap a glowing hex on the outer ring of ${v.values[ui.value].name}.`, 'bad');
    const p = HW.player(v.current), val = ui.value;
    if (await actAs(p.id, 'enter', { n: val, hex: i }, `✓ ${p.name} stands for ${v.values[val].name}`)) ui.value = null;
    return;
  }
  if (v.phase !== 'turn' || !v.turn) return;
  const p = HW.player(v.turn.player);
  if (ui.pass) { ui.pass = false; return render(v); }
  if (ui.mode) {
    if (!hl.has(i)) return HW.toast(`Tap a glowing hex to ${ui.mode}.`, 'bad');
    const mode = ui.mode;
    ui.mode = null;
    await actAs(p.id, mode, { hex: i }, `✓ ${p.name} ${VERB[mode]}`);
    return render(HW.view);
  }
  if (!hl.has(i) && !hl2.has(i)) {
    return HW.toast(p.water <= 0 ? `${p.name} has no water: someone must pass them 1 first.` : !v.turn.actions ? 'No actions left: end the turn.' : 'Tap a glowing hex next to them to move.', 'bad');
  }
  const bring = ui.bring && HW.player(ui.bring)?.pos === p.pos ? ui.bring : '';
  if (await actAs(p.id, 'move', { hex: i, target: bring }, bring ? `✓ ${p.name} moves with ${HW.name(bring)}` : '')) ui.bring = '';
}

$('k-tab').onclick = () => { ui.drawer = !ui.drawer; store.set('hw-drawer', ui.drawer); if (HW.view) renderDrawer(HW.view); setTimeout(fit, 260); };
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b || b.disabled || !b.closest('#k-tray, #k-pop, #k-modal, #k-drawer')) return;
  const d = b.dataset, v = HW.view;
  if (!v) return;
  if (d.t) return act('timer', { n: +d.t }, `${+d.t % 60 === 0 ? +d.t / 60 + ' min' : d.t + ' s'} timer started`);
  if (d.kick) {
    const p = HW.player(d.kick);
    return twice('kick' + d.kick, `Tap ✕ again to remove ${p?.name}`) && act('kick', { target: d.kick }, `${p?.name} removed`);
  }
  if (d.unphoto) {
    const p = HW.player(d.unphoto);
    return twice('unphoto' + d.unphoto, `Tap again to remove ${p?.name}'s photo`) && act('removePhoto', { target: d.unphoto }, `${p?.name}'s photo removed`);
  }
  if (d.assign) {
    const p = HW.player(d.assign), t = +d.type, types = p.types.slice();
    const i = types.indexOf(t);
    if (i >= 0) types.splice(i, 1);
    else if (types.length >= 3) return HW.toast(`${p.name} already has 3 types. Tap one to take it away.`, 'bad');
    else types.push(t);
    types.sort((a, b) => a - b);
    return act('assignPowers', { target: p.id, types }, `✓ ${p.name}: ${types.map(x => HW.roleName(x)).join(', ') || 'no type'}`);
  }
  if (d.val != null && d.val !== '') { ui.value = +d.val; HW.toast(`Now tap a glowing hex on the outer ring of ${v.values[ui.value].name}`); return render(v); }
  if (d.bring) { ui.bring = ui.bring === d.bring ? '' : d.bring; return render(v); }
  if (d.from) { ui.passFrom = d.from; return render(v); }
  const cur = v.turn ? HW.player(v.turn.player) : null;
  if (d.do && cur) {
    if (b.getAttribute('aria-disabled') === 'true') {
      // unavailable: say why (the bubble shows on the packet for a moment)
      ui.tip = d.do; HW.toast(`${PK[d.do]}: ${d.why}`, 'bad'); renderTray(v);
      clearTimeout(ui.tipT); ui.tipT = setTimeout(() => { ui.tip = ''; HW.view && renderTray(HW.view); }, 2600);
      return;
    }
    if (d.do === 'move') { ui.mode = null; ui.pass = false; render(v); return HW.toast('Tap a glowing hex to move'); }
    if (d.do === 'pass') { ui.pass = !ui.pass; ui.mode = null; return render(v); }
    if (d.do === 'end') {
      // ask twice only when there is still something they could do (not when, say, they have no water left)
      const canStill = moveTargets(v, cur).one.length > 0 || Object.values(turnOptions(v, cur)).some(o => o.ok);
      if (v.turn.actions > 0 && canStill && !twice('end', `${cur.name} still has ${v.turn.actions} action${v.turn.actions > 1 ? 's' : ''}. Tap End turn again to end it.`)) return;
      const ok = await actAs(cur.id, 'endTurn');
      if (ok && HW.view.phase === 'turn' && HW.view.turn) HW.toast(`Next: ${HW.name(HW.view.turn.player)}`, 'ok');
      return;
    }
    const o = turnOptions(v, cur)[d.do];
    ui.pass = false;
    // Water, Tend and Clear pick a hex when more than one is possible.
    if (['water', 'tend', 'clear'].includes(d.do)) {
      if (ui.mode === d.do) { ui.mode = null; return render(v); }
      if (o.targets.length > 1) { ui.mode = d.do; HW.toast(`Tap the glowing hex to ${d.do}.`); return render(v); }
      return actAs(cur.id, d.do, { hex: o.targets[0] }, `✓ ${cur.name} ${VERB[d.do]}`);
    }
    return actAs(cur.id, d.do, {}, `✓ ${cur.name} ${VERB[d.do]}`);
  }
  if (d.pass) {
    const from = HW.player(ui.passFrom), to = HW.player(d.pass);
    return actAs(from.id, 'pass', { target: to.id, text: d.item }, `✓ ${from.name} passes ${d.item === 'treasure' ? 'the treasure' : d.item} to ${to.name}`);
  }
  switch (d.k) {
    case 'start': return act('start', {}, '✓ The game begins: enter the forest');
    case 'doneShare': return act('doneShare', {}, '✓ Thank you');
    case 'pickAgain': ui.value = null; return render(v);
    case 'closePass': ui.pass = false; return render(v);
    case 'startChain': {
      const waiting = v.players.filter(p => !p.guessed).length;
      if (waiting && !twice('chain', `${waiting} still guessing. Tap again to start anyway.`)) return;
      return act('startChain', {}, '✓ The tribute chain begins');
    }
    case 'nextTribute': return act('nextTribute', {}, '✓ Next tribute');
    case 'hidePanel': ui.hidePanel = true; return render(v);
    case 'showPanel': ui.hidePanel = false; return render(v);
    case 'askEnd': ui.confirmEnd = true; return render(v);
    case 'cancelEnd': ui.confirmEnd = false; return render(v);
    case 'endGame': {
      ui.confirmEnd = false;
      const ok = await act('endGame', {}, '✓ The game is closed: on to the Secret Owl guesses');
      if (!ok) render(HW.view);
      return;
    }
  }
});
// Escape closes a popover or a mode
addEventListener('keydown', e => { if (e.key === 'Escape' && HW.view && (ui.pass || ui.mode)) { ui.pass = false; ui.mode = null; render(HW.view); } });

HW.connect(creds, render, msg => { $('k-modal').hidden = false; $('k-modal').className = 'k-m-lobby'; $('k-modal').innerHTML = `<div class="k-panel"><p class="bad">${esc(msg)}</p><p><a href="/">Back to the start page</a></p></div>`; });
</script>
</body>
</html>
