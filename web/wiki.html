<style>
:root {
  --bg: #13241b; --panel: #1c3326; --panel2: #24402f; --deep: #0f1d16; --ink: #f3efe2; --muted: #b9c4b3;
  --accent: #e0a32e; --good: #7bc47f; --bad: #e57373; --line: #345a42;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
@media (min-width: 900px) { html { font-size: 17.5px; } }
body {
  margin: 0; color: var(--ink); line-height: 1.55; background: var(--bg);
  font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background-image: radial-gradient(ellipse 90% 40% at 50% -5%, rgba(224,163,46,.12), transparent 70%);
  background-repeat: no-repeat;
}
.wrap { max-width: 60rem; margin: 0 auto; padding: 0 16px 48px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { line-height: 1.2; font-weight: 800; }
p { margin: 0 0 .8rem; }
ul, ol { margin: 0 0 .8rem; padding-left: 1.3rem; }
li { margin: .25rem 0; }
b, strong { font-weight: 800; }
.muted { color: var(--muted); }
table { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-size: .95rem; }
th, td { text-align: left; padding: .45em .6em; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.tablewrap { overflow-x: auto; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 0 6px; }
.brand { font-weight: 800; letter-spacing: .12em; text-decoration: none; color: var(--ink); font-size: 1.05rem; }
.brand span { margin-right: .3em; }
.toplinks { margin-left: auto; display: flex; gap: 14px; font-size: .92rem; font-weight: 700; }
.toplinks a { color: var(--muted); text-decoration: none; }
.toplinks a:hover { color: var(--ink); }
.search { width: 100%; margin: 6px 0 0; }
.search input {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: .65em .9em;
}
.search input::placeholder { color: var(--muted); }

/* index */
.hero { text-align: center; padding: 22px 0 4px; }
.hero .seed { font-size: 2.8rem; line-height: 1; }
.hero h1 { font-size: 2.1rem; margin: .3rem 0 .2rem; letter-spacing: .06em; }
.hero p { color: var(--muted); max-width: 34rem; margin: 0 auto; }
.cat { margin-top: 1.8rem; }
.cat h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 .6rem; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
.tile {
  display: flex; gap: .7rem; align-items: flex-start; text-decoration: none; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.tile:hover { border-color: var(--accent); }
.tile .ic { font-size: 1.6rem; line-height: 1.1; flex: none; width: 2rem; text-align: center; }
.tile .ic .art-i { max-width: 2rem; }
.tile b { display: block; }
.tile small { display: block; color: var(--muted); font-size: .86rem; line-height: 1.35; margin-top: .1rem; }
.empty { color: var(--muted); text-align: center; padding: 2rem 0; }

/* article */
.crumbs { font-size: .9rem; color: var(--muted); margin: 14px 0 0; }
.crumbs a { color: var(--muted); }
article { margin-top: 10px; }
.head { display: flex; gap: 14px; align-items: center; padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.head .ic { font-size: 3rem; line-height: 1; }
.head h1 { font-size: 2rem; margin: 0; }
.head .tag { display: inline-block; margin-top: .3rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 99px; padding: .1em .7em; font-size: .8rem; font-weight: 800; color: var(--muted); }
.summary { font-size: 1.15rem; margin: 1rem 0 1.2rem; }
article h3 { font-size: 1.15rem; margin: 1.5rem 0 .5rem; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 1rem 0; }
.box > :last-child { margin-bottom: 0; }
.tip { background: #2d2a17; border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 1rem 0; }
.tip > :last-child { margin-bottom: 0; }
.tip h3 { margin-top: 0; font-size: 1rem; }
.facts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); margin: 1rem 0; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.see { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.see h3 { margin: 0 0 .6rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { text-decoration: none; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 99px; padding: .3em .8em; font-size: .9rem; font-weight: 700; }
.chips a:hover { border-color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 1.6rem; font-weight: 700; font-size: .95rem; }
.pager a { text-decoration: none; }
.foot { margin-top: 3rem; text-align: center; color: var(--muted); font-size: .85rem; }
</style>
</head>

<script>
// Each entry is one wiki page. In body text, [[id]] links to another page
// (shown with its title) and [[id|text]] links with custom text.
const CATS = [
  ['basics', 'The basics'],
  ['forest', 'The forest'],
  ['actions', 'Actions'],
  ['growing', 'Plants, water and fruit'],
  ['weather', 'Weather and the Forest Tide'],
  ['treasures', 'The treasures'],
  ['talking', 'Stories and trust'],
  ['roles', 'Enneagram roles'],
  ['end', 'The end'],
  ['cards', 'All the cards'],
  ['phone', 'Your phone'],
];

// The six value pages share one shape.
const VALUE_INFO = [
  ['zealous', 'value:0', 'Zealous', 'Z', 'Be zealous, not jealous.', 'Passionate, driven energy channelled into learning and purpose rather than comparison: advocacy for students, initiative, and enthusiastic participation.'],
  ['excellence', 'value:1', 'Excellence', 'E', 'Beyond expectation.', 'Consistently surpassing standards, never merely meeting them: in academics, governance, and personal growth. Heart (zealous) always comes first.'],
  ['resilience', 'value:2', 'Resilience', 'R', 'Anti-fragile.', 'More than bouncing back: growing stronger through challenge. Purpose-driven leadership that persists toward long-term goals and learns from setbacks.'],
  ['authenticity', 'value:3', 'Authenticity', 'A', 'Inclusive education.', 'Genuine representation and honesty. Everyone, including students in zera Plus, belongs and is valued, without pretense.'],
  ['open-mindedness', 'value:4', 'Open-mindedness', 'O', 'Growth mindset.', 'Welcoming diverse perspectives and inclusive decision-making: challenging assumptions and treating failure as a place to grow, not an endpoint.'],
  ['sustainability', 'value:5', 'Sustainability', 'S', 'Start with the end in mind.', 'Long-term thinking built into everything: creating lasting impact and building systems that outlast any single leader or cohort.'],
];

const W = [
// ───────────── The basics
{ id: 'world-tree-game', cat: 'basics', icon: 'worldTree:awake', title: 'Heartwood, the game',
  short: 'What the game is, in one page.',
  body: `
<p>Heartwood is a cooperative game for 6 to 12 school leaders. Its purpose is simple: <b>get to know each other while you work as one team.</b></p>
<p>The forest is asleep and face down. Together you [[explore]] it, grow a [[big-tree]] in every [[sector]], [[harvest]] fruit while you tell stories, find the three [[treasure|treasures]], and gather on the [[world-tree]] in the centre. Then the forest wakes.</p>
<div class="facts">
  <div class="fact"><span>Players</span>6 to 12, plus the [[keeper]]</div>
  <div class="fact"><span>Time</span>A long afternoon (3 to 4 hours)</div>
  <div class="fact"><span>Team</span>Everyone wins or loses together</div>
  <div class="fact"><span>Phones</span>Down: see [[phones-down]]</div>
</div>
<h3>The shape of the game</h3>
<ol>
  <li>The Keeper gives everyone their [[roles|Enneagram roles]], then starts with the [[briefing]]. Your phone tells you who you watch as a [[secret-owl]].</li>
  <li>[[entering|Enter the forest]]: choose the [[values|value]] you stand for, and say why.</li>
  <li>Play [[round|rounds]]. In each, every player takes a [[turn]] of 2 [[action|actions]], then the [[forest-tide]] runs.</li>
  <li>The game ends when [[wake|the forest wakes]], or [[sleep|the forest sleeps on]].</li>
  <li>The [[finale]]: the Secret Owl [[guess]], the [[tribute-chain]] and [[recognition]].</li>
</ol>
<p>There are no points and no winner among the players. See [[goal]].</p>` },

{ id: 'goal', cat: 'basics', icon: 'icon:goal', title: 'The goal',
  short: 'Three goals, all true at the same moment: then the forest wakes.',
  body: `
<p>The forest [[wake|wakes]] the moment all three goals are true at the same time:</p>
<ol>
  <li><b>{{stage:4}} A [[big-tree]] in every [[sector]].</b> Six Big Trees, one per value. It doesn't matter who grew them.</li>
  <li><b>{{fruit}} Fruit from everyone, and all three treasures.</b> Every player has placed at least one [[fruit]] on the [[world-tree]], and [[compass|the Compass]], [[lantern|the Lantern]] and [[rope|the Rope]] are there too.</li>
  <li><b>{{icon:team}} Everyone on the World Tree.</b> Every player stands on it, together.</li>
</ol>
<p>The big screen shows how far the team has come on each goal.</p>
<h3>Losing</h3>
<p>If every player is at 0 [[water]] at the same moment, [[sleep|the forest sleeps on]].</p>
<div class="tip"><h3>No winner among players</h3><p>Heartwood has no points. You win or lose as one team. At the end, [[recognition]] shows what each person received: trust, and their Secret Owl.</p></div>` },

{ id: 'keeper', cat: 'basics', icon: 'icon:keeper', title: 'Keeper',
  short: 'The facilitator who runs the big screen. Not a player.',
  body: `
<p>The Keeper is the facilitator. They stand outside the game: they don't take turns.</p>
<h3>What the Keeper does</h3>
<ul>
  <li>Creates the game and shows the 4-letter join code and QR code on the big screen.</li>
  <li>Gives each player 1 to 3 Enneagram types in the lobby: their [[roles]].</li>
  <li>Starts the game when 6 to 12 players are in and everyone has a role.</li>
  <li>Gives the [[briefing]] on the big screen, and reads the [[forest-pact]] in it.</li>
  <li>Taps what players say: [[entering]], every [[action]], every [[pass]], and <b>End turn</b>. A slip (the wrong hex) is taken back with <b>Undo</b> in the trail log, until the turn ends.</li>
  <li>On a laptop, keys do the commonest taps: <b>M</b> Move, <b>E</b> Explore, <b>Enter</b> End turn, or the default button of whatever is open (marked ↵: <b>Done sharing</b>, <b>Next</b>…), <b>1</b> to <b>9</b> a numbered hex, <b>,</b> and <b>.</b> turn the map, <b>Ctrl+Z</b> Undo, <b>Esc</b> cancels.</li>
  <li>Can <b>turn the map</b> to see the forest from any of its six sides (the buttons in the top-left sign, or the <b>,</b> and <b>.</b> keys).</li>
  <li>Taps <b>Done sharing</b> when a [[share]] ends, and can start a [[timer]]. When a player says "not this one" to a [[ring-card]] or a [[heartwood-question]], taps <b>Another question</b>.</li>
  <li>Leads the [[finale]]: starts the [[tribute-chain]] and taps <b>Next</b> for each tribute.</li>
  <li>May pause any story, and gives [[rejoin-code|rejoin codes]] when a player changes phone.</li>
  <li>Can remove a player's [[photo]] from the board.</li>
  <li>Records the stories on the laptop ([[recording]]): can switch it off, or drop a clip.</li>
</ul>` },

{ id: 'forest-pact', cat: 'basics', icon: 'icon:pact', title: 'Forest Pact',
  short: 'The six promises everyone makes before playing.',
  body: `
<p>The [[keeper]] reads the Forest Pact at the start, in the [[briefing]]. It holds for the whole game, and after it.</p>
<div class="box">
<p>{{worldTree:awake}} <b>What's shared in the forest stays in the forest.</b></p>
<p>{{leaf}} <b>Every question is an invitation.</b> You may always say "not this one".</p>
<p>{{icon:ear}} <b>Listen to understand:</b> no advice, no fixing, no debating.</p>
<p>{{acorn}} <b>Trust is a gift, not a grade.</b> See [[trust-acorn]].</p>
<p>{{icon:team}} <b>One team.</b> Plan out loud, and look after each other.</p>
<p>{{icon:phoneOff}} <b>Phones down.</b> See [[phones-down]].</p>
</div>
<p>The Keeper may pause any story.</p>` },

{ id: 'briefing', cat: 'basics', icon: 'icon:goal', title: 'The briefing',
  short: 'Slides on the big screen after Start: the goal, limits, obstacles, roles, the Secret Owl, the Forest Pact.',
  body: `
<p>When the [[keeper]] starts the game, the big screen shows the briefing before anyone enters. The Keeper steps through it with <b>Next</b> and <b>Back</b>, the arrow keys or a presenter clicker; every screen and phone follows.</p>
<ol>
  <li><b>Welcome:</b> the map, with a sector for each of the six [[values]] around the sleeping [[world-tree]], and the team.</li>
  <li><b>Our goal:</b> the three parts of the [[goal]], for the whole team.</li>
  <li><b>What we have:</b> 2 [[action|actions]] a turn, [[water]], fruit and [[treasure]] limits, free [[pass|passing]].</li>
  <li><b>The weather</b> and <b>dead leaves, running dry:</b> each obstacle and how to prevent it. See [[weather]] and [[forest-tide]].</li>
  <li><b>Our powers:</b> the nine [[roles]] and who holds each. Your phone shows yours.</li>
  <li><b>Side quest:</b> the [[secret-owl]]: what to notice, and what each Owl says at the end. Your phone shows whose Owl you are.</li>
  <li><b>The [[forest-pact]]</b>, read aloud.</li>
  <li><b>How we play:</b> the turn order and the [[share|shares]]. Then <b>Enter the forest</b> starts [[entering]].</li>
</ol>
<p>The Keeper may skip it, and can show the slides again during play from the Keeper tools.</p>` },
{ id: 'phones-down', cat: 'basics', icon: 'icon:phoneOff', title: 'Phones down',
  short: 'Look at each other and at the big screen, not at your phone.',
  body: `
<p>Heartwood is about the people in the room. So your phone stays face down. Everything public happens on the big screen: you say what you want, and the [[keeper]] taps it.</p>
<p>Pick your phone up only to:</p>
<ul>
  <li>{{acorn}} give a [[trust-acorn]] after someone else's [[share]];</li>
  <li>{{icon:eye}} check your private looks (the [[investigator]]'s forecast);</li>
  <li>{{icon:guess}} make your [[guess]] at the end.</li>
</ul>
<p>See [[your-phone]] for everything it shows.</p>` },

{ id: 'round', cat: 'basics', icon: 'icon:round', title: 'Round',
  short: 'Every player takes one turn, then the Forest Tide.',
  body: `
<p>In a round, every player takes one [[turn]], clockwise, in the order they joined. After the last player's turn, the [[forest-tide]] runs by itself. Then the next round begins with the first player again.</p>
<p>A game has many rounds: often 20 to 30. The game ends the moment [[wake|the forest wakes]] or [[sleep|sleeps on]], even in the middle of a round.</p>` },

{ id: 'turn', cat: 'basics', icon: 'medallion:turn', title: 'Turn',
  short: 'Up to 2 actions. Say them, and the Keeper taps them.',
  body: `
<p>On your turn you have <b>2 [[action|actions]]</b>. Say what you want to do, and the [[keeper]] taps it on the big screen. You may use fewer. Some actions cost 2 in certain [[weather]]: [[explore]] in [[fog]], [[clear]] in [[rain]].</p>
<p>When you are done, the Keeper taps <b>End turn</b>. After the last player of the [[round]], the [[forest-tide]] runs.</p>
<h3>Free things</h3>
<ul>
  <li>[[pass|Passing]] water, fruit or a treasure costs no action, on your own turn.</li>
  <li>[[placing|Placing]] on the [[world-tree]] happens by itself.</li>
  <li>The [[investigator]]'s weather look costs no action.</li>
</ul>
<p>When someone starts a [[share]], play waits until the Keeper taps <b>Done sharing</b>.</p>` },

{ id: 'action', cat: 'basics', icon: 'leaf', title: 'Action',
  short: 'The nine things you can do on your turn.',
  body: `
<p>You have 2 actions a [[turn]]. Each action below costs 1, unless it says otherwise.</p>
<div class="tablewrap"><table>
<tr><th>Action</th><th>In short</th></tr>
<tr><td>{{icon:move}} [[move]]</td><td>Step to a hex next to you.</td></tr>
<tr><td>{{icon:explore}} [[explore]]</td><td>Turn over the hex you stand on (2 in [[fog]]).</td></tr>
<tr><td>{{icon:sow}} [[sow]]</td><td>Plant a seed on an empty explored hex.</td></tr>
<tr><td>{{icon:water}} [[water-action|Water]]</td><td>Seeded → Sprout, Sprout → Sapling. Uses 1 [[water]].</td></tr>
<tr><td>{{icon:tend}} [[tend]]</td><td>Sapling → [[big-tree]].</td></tr>
<tr><td>{{icon:clear}} [[clear]]</td><td>Remove a layer of [[dead-leaves]] (2 in [[rain]]).</td></tr>
<tr><td>{{icon:harvest}} [[harvest]]</td><td>Take a [[fruit]] from a Big Tree, and tell a [[harvest-story]].</td></tr>
<tr><td>{{icon:take}} [[take]]</td><td>Pick up a [[treasure]] on your hex.</td></tr>
<tr><td>{{icon:drink}} [[drink]]</td><td>Fill up to 5 water at a [[spring]].</td></tr>
</table></div>
<p>Your [[roles]] change some of these a little.</p>` },

{ id: 'entering', cat: 'basics', icon: 'medallion:stump', title: 'Entering the forest',
  short: 'Choose the value you stand for, take your place on Ring 4, and say why.',
  body: `
<p>Before the first [[round]], in turn order, each player:</p>
<ol>
  <li>Chooses the [[values|value]] they <b>stand for</b>. Several players may stand for the same value.</li>
  <li>Chooses a hex on Ring 4 of that value's [[sector]]. The [[keeper]] places their medallion there. You may share a hex.</li>
  <li>Tells the room <b>why</b> they stand for this value. This is a [[share]]: listeners may give a [[trust-acorn]].</li>
</ol>
<p>Everyone starts with 4 [[water]] and 10 trust acorns to give.</p>
<p>You stand for your value for the whole game. You will still grow trees and tell stories in other sectors.</p>` },

// ───────────── The forest
{ id: 'forest', cat: 'forest', icon: 'icon:board', title: 'The forest',
  short: '61 hexes: the World Tree, four rings and six value sectors.',
  body: `
<p>The forest is the board on the big screen. It has 61 [[hex|hexes]]:</p>
<ul>
  <li>the [[world-tree]] in the centre;</li>
  <li>four [[ring|rings]] around it: Ring 1 (6 hexes), Ring 2 (12), Ring 3 (18) and Ring 4 (24, the edge);</li>
  <li>six [[sector|sectors]], one for each of ZERA's [[values]], 10 hexes each.</li>
</ul>
<p>The 60 hexes around the World Tree start face down. Under them: 53 empty clearings, 4 [[spring|springs]] and 3 [[treasure|treasures]].</p>
<p>Any number of players can stand on the same hex.</p>` },

{ id: 'world-tree', cat: 'forest', icon: 'worldTree:awake', title: 'World Tree',
  short: 'The centre of the forest. Bring fruit and treasures here, and gather at the end.',
  body: `
<p>The World Tree is the hex in the centre of the [[forest]]. It is face up from the start.</p>
<ul>
  <li>When you stand on it holding [[fruit]] or a [[treasure]], everything you carry is placed there at once: see [[placing]].</li>
  <li>Placing fruit brings a [[heartwood-question]].</li>
  <li>It has no [[weather]], and [[dead-leaves]] never land on it.</li>
  <li>To [[wake|wake the forest]], every player must stand on it together.</li>
</ul>` },

{ id: 'ring', cat: 'forest', icon: 'icon:ring', title: 'Ring',
  short: 'Four rings around the World Tree. Deeper rings bring deeper questions.',
  body: `
<div class="tablewrap"><table>
<tr><th>Ring</th><th>Hexes</th><th>The first time you step in</th></tr>
<tr><td>Ring 4 (the edge)</td><td>24</td><td>You start here: [[entering]]</td></tr>
<tr><td>Ring 3</td><td>18</td><td>A [[ring-card]] from the Light deck: an easy question</td></tr>
<tr><td>Ring 2</td><td>12</td><td>A ring card from the Story deck: a story from your life</td></tr>
<tr><td>Ring 1</td><td>6</td><td>A ring card from the Deep deck: a deep question</td></tr>
<tr><td>[[world-tree]]</td><td>1</td><td>Nothing to draw: [[placing]]</td></tr>
</table></div>
<p>The [[treasure|treasures]] hide only in Rings 1 and 2. [[spring|Springs]] can be in any ring.</p>
<p>At the [[forest-breath]], dead leaves drift one ring closer to the centre. Ring 4 gets them from beyond the edge.</p>` },

{ id: 'sector', cat: 'forest', icon: 'icon:sector', title: 'Sector',
  short: 'One of six wedges of the forest, one for each value.',
  body: `
<p>Six lines from the centre cut the [[forest]] into six sectors, one for each of the [[values]]. Reading clockwise from the top they spell <b>ZERAOS</b>. Each sector has 10 hexes: 4 on Ring 4, 3 on Ring 3, 2 on Ring 2 and 1 on Ring 1.</p>
<ul>
  <li>Each sector has its own [[weather]].</li>
  <li>The team needs a [[big-tree]] in every sector.</li>
  <li>A [[harvest-story]] is about the value of the sector the tree grows in.</li>
  <li>You [[entering|enter]] on Ring 4 of your own value's sector.</li>
</ul>` },

{ id: 'values', cat: 'forest', icon: 'stage:4', title: 'Value (ZERAOS)',
  short: "ZERA's six core values. Each one owns a sector of the forest.",
  body: `
<p>The forest is cut into six [[sector|sectors]], one for each of ZERA's core values, <b>ZERAOS</b>, reading clockwise from the top.</p>
<div class="tablewrap"><table>
<tr><th>Value</th><th>ZERA's line</th></tr>
<tr><td>{{value:0}} [[zealous]]</td><td><i>Be zealous, not jealous.</i></td></tr>
<tr><td>{{value:1}} [[excellence]]</td><td><i>Beyond expectation.</i></td></tr>
<tr><td>{{value:2}} [[resilience]]</td><td><i>Anti-fragile.</i></td></tr>
<tr><td>{{value:3}} [[authenticity]]</td><td><i>Inclusive education.</i></td></tr>
<tr><td>{{value:4}} [[open-mindedness]]</td><td><i>Growth mindset.</i></td></tr>
<tr><td>{{value:5}} [[sustainability]]</td><td><i>Start with the end in mind.</i></td></tr>
</table></div>
<h3>Stand for one</h3>
<p>When you [[entering|enter the forest]], you choose the value you <b>stand for</b> and tell the room why. During the game you will hear stories about every value: each [[harvest-story]] is about the value of the tree's sector.</p>` },

...VALUE_INFO.map(([id, icon, name, letter, line, desc], i) => ({
  id, cat: 'forest', icon, title: name,
  short: `${letter} in ZERAOS. ${line}`,
  body: `
<p class="muted">${letter} in ZERAOS · sector ${i + 1} of 6, clockwise from the top</p>
<div class="box"><p><b>${line}</b></p><p>${desc}</p></div>
<p>One of the six [[values]]. Its [[sector]] has 10 hexes. The team needs a [[big-tree]] there, and whoever harvests from a tree in this sector tells a [[harvest-story]] about ${name}.</p>` })),

{ id: 'hex', cat: 'forest', icon: 'tile:down', title: 'Hex',
  short: 'One space of the forest. Face down until someone explores it.',
  body: `
<p>The forest has 61 hexes. The [[world-tree]] is face up. The other 60 start <b>face down</b> ({{tile:down}}).</p>
<p>When someone [[explore|explores]] a hex, it turns over and shows one of three things:</p>
<ul>
  <li><b>An empty clearing</b> (53 of them): a place to [[sow]].</li>
  <li><b>A [[spring]]</b> {{spring}} (4): a place to [[drink]].</li>
  <li><b>A [[treasure]]</b> {{treasure}} (3, only in Rings 1 and 2).</li>
</ul>
<p>A hex can also hold a plant (see [[plant]]) and up to 2 layers of [[dead-leaves]]. Two layers make it [[sealed]].</p>
<p>Any number of players can stand on one hex. "Next to you" means one of the six hexes touching yours.</p>` },

// ───────────── Actions
{ id: 'move', cat: 'actions', icon: 'icon:move', title: 'Move',
  short: 'Step to a hex next to you. Not into a sealed hex, not at 0 water.',
  body: `
<p>1 [[action]]: step to a [[hex]] next to you.</p>
<ul>
  <li>Not into a [[sealed]] hex (a [[challenger]] may).</li>
  <li>Not when you have 0 [[water]]. Moving does not use water.</li>
  <li>The first time you step into Ring 3, Ring 2 or Ring 1, moving inward, you draw that [[ring-card|ring's card]].</li>
  <li>If you arrive on the [[world-tree]] with fruit or a treasure, it is placed: see [[placing]].</li>
</ul>
<p>The [[enthusiast]] may move 2 hexes once a turn. The [[challenger]] may bring a teammate.</p>` },

{ id: 'explore', cat: 'actions', icon: 'icon:explore', title: 'Explore',
  short: 'Turn over the face-down hex you stand on. 2 actions in fog.',
  body: `
<p>1 [[action]] (2 in [[fog]]): turn over the face-down [[hex]] you stand on. You find an empty clearing, a [[spring]] or a [[treasure]].</p>
<p>If you find a treasure, the room has its [[group-moment]].</p>
<p>When the [[individualist]] explores, the board also shows which face-down hexes around them hold something.</p>` },

{ id: 'sow', cat: 'actions', icon: 'icon:sow', title: 'Sow',
  short: 'Plant a seed on an explored, empty hex. It becomes Seeded.',
  body: `
<p>1 [[action]]: plant a seed on the hex you stand on. It becomes <b>Seeded</b> (see [[plant]]).</p>
<p>The hex must be explored, with no plant, not a [[spring]], not [[sealed]], and no [[treasure]] lying there. (Once a treasure is taken, its hex can be sown.)</p>
<p>The [[achiever]]'s seed grows straight to Sprout.</p>` },

{ id: 'water-action', cat: 'actions', icon: 'icon:water', title: 'Water (the action)',
  short: 'Seeded → Sprout, or Sprout → Sapling. Uses 1 of your water.',
  body: `
<p>1 [[action]], and 1 of your [[water]]: help a plant grow one step.</p>
<ul>
  <li>Seeded → Sprout, or Sprout → Sapling. A Sapling needs [[tend]], not water.</li>
  <li>On the hex you stand on. The [[helper]] can water a hex next to them.</li>
  <li>Not on a [[sealed]] hex.</li>
</ul>
<p>[[rain|Rain]] at the [[forest-tide]] also grows Seeded and Sprout, for free.</p>` },

{ id: 'tend', cat: 'actions', icon: 'icon:tend', title: 'Tend',
  short: 'Sapling → Big Tree.',
  body: `
<p>1 [[action]]: a Sapling on your hex becomes a [[big-tree]]. It uses no water.</p>
<p>The [[helper]] can tend a hex next to them. Not on a [[sealed]] hex.</p>` },

{ id: 'clear', cat: 'actions', icon: 'icon:clear', title: 'Clear',
  short: 'Remove 1 layer of dead leaves from your hex or one next to you.',
  body: `
<p>1 [[action]] (2 if that hex is in [[rain]]): remove 1 layer of [[dead-leaves]] from your hex or a hex next to you.</p>
<p>Because you can clear the hex next to you, you can open a [[sealed]] hex from outside.</p>
<p>The [[reformer]] sweeps instead: one Clear takes a layer off their own hex and every hex around it.</p>` },

{ id: 'harvest', cat: 'actions', icon: 'icon:harvest', title: 'Harvest',
  short: 'Take a fruit from the Big Tree you stand on, and tell a story.',
  body: `
<p>1 [[action]]: take 1 [[fruit]] from the [[big-tree]] you stand on. Then tell a [[harvest-story]].</p>
<ul>
  <li>Not in [[rain]]. Fog and sun are fine.</li>
  <li>Not on a [[sealed]] hex.</li>
  <li>Each tree gives 1 fruit between [[forest-tide|Forest Tides]].</li>
  <li>You carry 2 fruit at most.</li>
</ul>` },

{ id: 'take', cat: 'actions', icon: 'icon:take', title: 'Take',
  short: 'Pick up a treasure lying on your hex.',
  body: `
<p>1 [[action]]: pick up an explored [[treasure]] lying on the hex you stand on. You carry 1 treasure at most.</p>
<p>Then bring it to the [[world-tree]], or [[pass]] it to a teammate.</p>` },

{ id: 'drink', cat: 'actions', icon: 'icon:drink', title: 'Drink',
  short: 'At a spring: back to 5 water.',
  body: `
<p>1 [[action]]: stand on an explored [[spring]] and fill your [[water]] back to 5.</p>
<p>Springs never run dry. Drinking is the only way to get water back, apart from a teammate's [[pass]].</p>` },

{ id: 'pass', cat: 'actions', icon: 'icon:pass', title: 'Pass',
  short: 'Hand water, fruit or a treasure to a teammate. Free, on your own turn.',
  body: `
<p>Passing costs no [[action]]. On your own [[turn]], when nobody is in a [[share]], you can pass <b>water</b>, <b>fruit</b> or a <b>treasure</b> to a teammate. Only the player whose turn it is gives. Say it, and the [[keeper]] taps it.</p>
<h3>Who can pass to whom</h3>
<ul>
  <li><b>Same hex:</b> always.</li>
  <li><b>Neighbouring hexes:</b> only in a [[peacemaker]]'s chain: teammates linked to the Peacemaker hex by hex, each on or next to the next one's hex. Anyone in the chain can pass to a teammate next to them, never further.</li>
</ul>
<h3>Limits</h3>
<p>The teammate can hold 5 [[water]], 2 [[fruit]] and 1 [[treasure]] at most.</p>
<p>If they stand on the [[world-tree]], what you pass is [[placing|placed]] at once.</p>` },

// ───────────── Plants, water and fruit
{ id: 'plant', cat: 'growing', icon: 'stage:2', title: 'Plant (Seeded, Sprout, Sapling)',
  short: 'The steps from a seed to a Big Tree.',
  body: `
<div class="tablewrap"><table>
<tr><th>Step</th><th>How it gets there</th></tr>
<tr><td>{{stage:1}} Seeded</td><td>[[sow]] an empty clearing</td></tr>
<tr><td>{{stage:2}} Sprout</td><td>[[water-action|Water]] a Seeded hex, or [[rain]] at the Tide</td></tr>
<tr><td>{{stage:3}} Sapling</td><td>Water a Sprout hex, or rain at the Tide</td></tr>
<tr><td>{{stage:4}} [[big-tree]]</td><td>[[tend]] a Sapling</td></tr>
</table></div>
<p>When [[dead-leaves]] land on a growing plant, it drops back one step. A Seeded hex loses its seed. Someone standing on the hex keeps the plant safe, and so does a [[loyalist]] next to it.</p>
<p>Nobody can water, tend or harvest on a [[sealed]] hex.</p>` },

{ id: 'big-tree', cat: 'growing', icon: 'stage:4', title: 'Big Tree',
  short: 'The last step of a plant. Gives fruit and shade.',
  body: `
<p>A Sapling becomes a Big Tree when someone [[tend|tends]] it. The team needs one Big Tree in every [[sector]] (see [[goal]]).</p>
<ul>
  <li><b>Fruit:</b> [[harvest]] it for 1 [[fruit]], once between [[forest-tide|Forest Tides]], and tell a [[harvest-story]].</li>
  <li><b>Shade:</b> if you stand on a Big Tree, the [[sun]] does not dry you.</li>
  <li><b>Strong:</b> [[dead-leaves]] don't make it smaller. But two layers still seal it, and nobody can harvest a [[sealed]] tree until it is cleared.</li>
</ul>
<p>A sealed Big Tree still counts for the goal.</p>` },

{ id: 'fruit', cat: 'growing', icon: 'fruit', title: 'Fruit',
  short: 'From a Big Tree, for the World Tree. Carry 2 at most.',
  body: `
<p>You get fruit by [[harvest|harvesting]] a [[big-tree]]. You carry 2 at most. You can [[pass]] fruit to teammates.</p>
<p>Bring it to the [[world-tree]]: it is placed by itself (see [[placing]]), and you answer one [[heartwood-question]].</p>
<p>Every player must place at least one fruit. A fruit counts for the person who places it, so you can pass a fruit to a teammate who has not placed one yet.</p>` },

{ id: 'water', cat: 'growing', icon: 'drop', title: 'Water (your supply)',
  short: 'Start with 4, hold 5. Without water you cannot move.',
  body: `
<div class="facts">
  <div class="fact"><span>Start</span>4</div>
  <div class="fact"><span>Most</span>5</div>
</div>
<h3>You lose water</h3>
<ul>
  <li>1 each time you [[water-action|Water]] a plant.</li>
  <li>1 at the [[forest-tide]] if your sector has [[sun]] and you are not on a [[big-tree]].</li>
</ul>
<h3>You get water back</h3>
<ul>
  <li>[[drink]] at a [[spring]]: back to 5.</li>
  <li>A teammate [[pass|passes]] you some.</li>
</ul>
<p>[[rain|Rain]] does not fill you up.</p>
<h3>At 0 water</h3>
<p>You stay in the game, but you cannot [[move]] until a teammate comes to your hex and passes you 1 water on their turn. You can still do other actions on your hex. If every player is at 0 at the same moment, [[sleep|the forest sleeps on]].</p>` },

{ id: 'spring', cat: 'growing', icon: 'spring', title: 'Spring',
  short: 'Four hidden springs. Drink to fill up to 5. They never run dry.',
  body: `
<p>Four springs {{spring}} hide under face-down [[hex|hexes]], anywhere in Rings 1 to 4, scattered: each in a different [[sector]], never close together. Once someone [[explore|explores]] one, everyone can see it.</p>
<p>Stand on it and [[drink]]: your [[water]] goes back to 5. A spring never runs dry. Anyone can drink there, as often as they like.</p>
<p>You cannot [[sow]] on a spring.</p>
<div class="tip"><h3>Tip</h3><p>Springs are the only way to get water back. Find them early, and tell the team where they are.</p></div>` },

// ───────────── Weather and the Forest Tide
{ id: 'weather', cat: 'weather', icon: 'weather', title: 'Weather',
  short: 'Each sector has Sun, Rain or Fog. It changes at every Forest Tide.',
  body: `
<p>Each [[sector]] has its own weather: [[sun]], [[rain]] or [[fog]]. Each is equally likely. It is drawn at the start of the game and again at every [[forest-tide]]. The big screen colours each sector by its weather. The [[world-tree]] has no weather.</p>
<p>The next weather is decided early. Only the [[investigator]] can look at it.</p>
<div class="tablewrap"><table>
<tr><th>Weather</th><th>During the round</th><th>At the Forest Tide</th></tr>
<tr><td>{{weather:sun}} Sun</td><td>All normal</td><td>Players here lose 1 water, unless on a Big Tree</td></tr>
<tr><td>{{weather:rain}} Rain</td><td>No harvest; Clear costs 2</td><td>Seeded and Sprout grow one step</td></tr>
<tr><td>{{weather:fog}} Fog</td><td>Explore costs 2; no Enthusiast double step</td><td>Nothing</td></tr>
</table></div>
<div class="tip"><h3>Watch out</h3><p>At the Tide, the new weather comes first, and then it acts. A sector that turns sunny at the Tide dries you at once.</p></div>` },

{ id: 'sun', cat: 'weather', icon: 'weather:sun', title: 'Sun',
  short: 'Dries you at the Forest Tide, unless you stand on a Big Tree.',
  body: `
<p>During the [[round]], everything works as usual in a sunny [[sector]].</p>
<p>At the [[forest-tide]], every player in a sunny sector loses 1 [[water]] (never below 0), unless they stand on a [[big-tree]]. Its shade keeps them cool.</p>` },

{ id: 'rain', cat: 'weather', icon: 'weather:rain', title: 'Rain',
  short: 'Grows young plants at the Tide. No harvest, and Clear costs 2.',
  body: `
<ul>
  <li>At the [[forest-tide]], every Seeded and Sprout hex in a rainy [[sector]] grows one step (see [[plant]]), unless it is [[sealed]].</li>
  <li>No [[harvest]] in rain.</li>
  <li>[[clear]] costs 2 actions in rain (for the [[reformer]]'s sweep: when their own hex is in rain).</li>
  <li>Nobody dries out in rain. But rain does not fill your [[water]] either.</li>
</ul>` },

{ id: 'fog', cat: 'weather', icon: 'weather:fog', title: 'Fog',
  short: 'Explore costs 2 actions. No Enthusiast double step.',
  body: `
<ul>
  <li>[[explore]] costs 2 actions in fog.</li>
  <li>The [[enthusiast]] cannot take a double step if their hex, the middle hex or the last hex is in fog.</li>
  <li>[[harvest]] works in fog.</li>
</ul>` },

{ id: 'forest-tide', cat: 'weather', icon: 'icon:wind', title: 'Forest Tide',
  short: 'After every round: new weather, rain grows, sun dries, leaves drift in.',
  body: `
<p>After the last player's [[turn]] in a [[round]], the Forest Tide runs by itself. The big screen shows each step.</p>
<ol>
  <li><b>New weather.</b> Each [[sector]] turns to its new [[weather]]. Every [[big-tree]] can be harvested again.</li>
  <li><b>Rain grows, sun dries.</b> In [[rain]], Seeded and Sprout grow one step. In [[sun]], players who are not on a Big Tree lose 1 [[water]].</li>
  <li><b>[[forest-breath]].</b> [[dead-leaves]] blow in from the edge and drift toward the centre.</li>
</ol>
<p>Then a new round begins with the first player.</p>` },

{ id: 'forest-breath', cat: 'weather', icon: 'icon:breath', title: 'Forest Breath',
  short: 'At each Tide, dead leaves drift one ring closer to the centre.',
  body: `
<p>The last step of every [[forest-tide]]. The wind picks a few random places: hexes of the [[forest]], or spots just beyond its edge. From each one, one layer of [[dead-leaves]] blows onto a hex next to it, <b>one [[ring]] closer to the centre</b>. From beyond the edge, the leaves land on Ring 4. A Ring 1 hex keeps its own leaves. The [[world-tree]] never gets leaves.</p>
<div class="tablewrap"><table>
<tr><th>Tide</th><th>1–2</th><th>3–4</th><th>5–6</th><th>7–8</th><th>9 and later</th></tr>
<tr><td>Drifts</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
</table></div>
<ul>
  <li>A growing [[plant]] where leaves land drops one step (a Seeded hex loses its seed), unless someone stands on it, or a [[loyalist]] stands next to it.</li>
  <li>A [[big-tree]] keeps its stage.</li>
  <li>A [[sealed]] hex gets no more leaves.</li>
</ul>
<p>The next Breath is decided early: the [[investigator]] always sees it on their phone.</p>` },

{ id: 'dead-leaves', cat: 'weather', icon: 'leaves:1', title: 'Dead leaves',
  short: 'Blown in by the Forest Breath. Two layers seal a hex.',
  body: `
<p>[[forest-breath]] blows dead leaves onto hexes, one layer at a time.</p>
<ul>
  <li><b>{{leaves:1}} 1 layer:</b> a warning. The hex still works.</li>
  <li><b>{{leaves:2}} 2 layers:</b> the hex is [[sealed]].</li>
</ul>
<p>When leaves land on a growing [[plant]], it drops back one step. [[clear]] removes a layer.</p>` },

{ id: 'sealed', cat: 'weather', icon: 'leaves:2', title: 'Sealed',
  short: 'A hex with 2 layers of dead leaves. Nobody walks in.',
  body: `
<p>A hex with 2 layers of [[dead-leaves]] is sealed (the big screen shows a dashed edge).</p>
<ul>
  <li>Nobody can [[move]] in, except a [[challenger]].</li>
  <li>Nobody can [[sow]], [[water-action|water]], [[tend]] or [[harvest]] there.</li>
  <li>If you are standing on it when it seals, you can still walk out.</li>
  <li>It gets no more leaves.</li>
  <li>A sealed [[big-tree]] still counts for the [[goal]].</li>
</ul>
<p>To open it, [[clear]] it, from the hex itself or from a hex next to it.</p>` },

// ───────────── The treasures
{ id: 'treasure', cat: 'treasures', icon: 'treasure', title: 'Treasure',
  short: 'Three treasures hide in Rings 1 and 2. Bring them all to the World Tree.',
  body: `
<p>Three treasures hide under face-down hexes, only in Rings 1 and 2: [[compass|the Compass]] {{treasure:compass}}, [[lantern|the Lantern]] {{treasure:lantern}} and [[rope|the Rope]] {{treasure:rope}}. Each has a meaning for a team.</p>
<ol>
  <li><b>Find it.</b> Someone [[explore|explores]] its hex. The room has a [[group-moment]].</li>
  <li><b>[[take]] it.</b> It lies on its hex until someone takes it. You carry 1 at most.</li>
  <li><b>Bring it home.</b> Walk it to the [[world-tree]], or [[pass]] it along. It is [[placing|placed]] by itself.</li>
</ol>
<p>All three on the World Tree is part of the [[goal]]. Then the forest says: <b>"Purpose, light and each other: the heart of the forest is complete."</b></p>` },

{ id: 'compass', cat: 'treasures', icon: 'treasure:compass', title: 'The Compass',
  short: 'Purpose: where we are going.',
  body: `
<div class="box"><p><b>{{treasure:compass}} The Compass</b> · <i>Purpose: where we're going.</i></p></div>
<p>One of the three [[treasure|treasures]]. When it is found, the room has this [[group-moment]]:</p>
<div class="box"><p><b>"Everyone, one sentence: where do you want this team to be a year from now?"</b></p></div>` },

{ id: 'lantern', cat: 'treasures', icon: 'treasure:lantern', title: 'The Lantern',
  short: 'Lighting the way for others.',
  body: `
<div class="box"><p><b>{{treasure:lantern}} The Lantern</b> · <i>Lighting the way for others.</i></p></div>
<p>One of the three [[treasure|treasures]]. When it is found, the room has this [[group-moment]]:</p>
<div class="box"><p><b>"Everyone, one sentence: who lit the way for you when you were new?"</b></p></div>` },

{ id: 'rope', cat: 'treasures', icon: 'treasure:rope', title: 'The Rope',
  short: 'Holding together.',
  body: `
<div class="box"><p><b>{{treasure:rope}} The Rope</b> · <i>Holding together.</i></p></div>
<p>One of the three [[treasure|treasures]]. When it is found, the room has this [[group-moment]]:</p>
<div class="box"><p><b>"Everyone, one sentence: what holds this team together when things get hard?"</b></p></div>` },

{ id: 'group-moment', cat: 'treasures', icon: 'sparkle', title: 'Group moment',
  short: 'When a treasure is found, everyone answers its question in one sentence.',
  body: `
<p>When someone finds a [[treasure]], its question appears on the big screen. <b>Everyone</b> answers in one sentence, around the table. Then the [[keeper]] taps <b>Done sharing</b>.</p>
<p>There are no [[trust-acorn|trust acorns]] after a group moment: everyone gives something, together.</p>
<p>The three questions: [[compass]], [[lantern]], [[rope]].</p>` },

// ───────────── Stories and trust
{ id: 'share', cat: 'talking', icon: 'icon:talk', title: 'Share',
  short: 'One person tells a story or answers a question. The forest waits.',
  body: `
<p>A share is a moment when one person talks and the room listens. They come from:</p>
<div class="tablewrap"><table>
<tr><th>When</th><th>What</th></tr>
<tr><td>[[entering]]</td><td>Why you stand for your value</td></tr>
<tr><td>First time in Ring 3, 2, 1</td><td>A [[ring-card]]</td></tr>
<tr><td>[[harvest]]</td><td>A [[harvest-story]]</td></tr>
<tr><td>[[placing]] fruit</td><td>A [[heartwood-question]]</td></tr>
<tr><td>A treasure is found</td><td>A [[group-moment]] (everyone)</td></tr>
</table></div>
<ul>
  <li>While a share is open, nobody can act. Shares come one at a time, in the order they happened.</li>
  <li>The [[keeper]] taps <b>Done sharing</b> to close it. The Keeper may start a [[timer]].</li>
  <li>Listeners may give a [[trust-acorn]] (not after a group moment).</li>
  <li>Each share is [[recording|recorded]] on the Keeper's laptop and turned into text for the team.</li>
  <li>Every question is an invitation: see the [[forest-pact]].</li>
</ul>` },

{ id: 'ring-card', cat: 'talking', icon: 'icon:cards', title: 'Ring card',
  short: 'A question for the first time you reach Ring 3, 2 and 1.',
  body: `
<p>Each [[ring]] has its own deck of questions to get to know each other. The deeper the ring, the deeper the question:</p>
<ul>
  <li><b>Ring 3, the Light deck:</b> an easy question. <i>"What did you want to be when you were a child?"</i></li>

// ───────────── rendering
const byId = Object.fromEntries(W.map(e => [e.id, e]));
const main = document.getElementById('main');
const q = document.getElementById('q');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Pictures are drawn by art.js (the game's own sprites): an entry's icon is a spec such as 'icon:move' or 'value:2',
// and {{spec}} in body text marks one inline. ART.hydrate() draws them after each render.
const pic = spec => `<i class="art-i" data-art="${esc(spec)}"></i>`;
const pics = html => html.replace(/\{\{([a-zA-Z0-9:]+)\}\}/g, (m, spec) => pic(spec));
const plain = html => html.replace(/\{\{[^}]*\}\}/g, ' ').replace(/<[^>]+>/g, ' ');

function links(html) {
  return pics(html).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, text) => {
    const e = byId[id];
    if (!e) return text || id;
    return `<a href="#${id}">${text || e.title}</a>`;
  });
}

function tile(e) {
  return `<a class="tile" href="#${e.id}"><span class="ic">${pic(e.icon)}</span><span><b>${esc(e.title)}</b><small>${esc(e.short)}</small></span></a>`;
}

// Card decks come from the game itself (GET /api/cards), so these pages always match what's dealt:
// {values, stages:["",…], ringDeckNames:["","Deep","Story","Light"], ringDecks:{1:[],2:[],3:[]}, heartwood:[], harvest:"…",
//  treasures:[{id,icon,name,meaning,question}], roles:[{type,name,text}]}
let CARDS = null;
const RING_DECKS = ['', 'Deep', 'Story', 'Light']; // until /api/cards answers with ringDeckNames
function harvestLine(tpl, name) {
  const t = String(tpl || 'Tell us a story from your own life about {Value}.');
  return /\{value\}|%s/i.test(t) ? t.replace(/\{value\}|%s/gi, name) : `${t} (${name})`;
}
function deckHTML(deck) {
  const C = CARDS || {}, li = xs => `<ol>${(xs || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
  const [kind, arg] = deck.split(':');
  if (kind === 'ring') {
    const xs = (C.ringDecks || {})[arg] || [];
    const name = (C.ringDeckNames || RING_DECKS)[arg] || '';
    return `<p class="muted">${esc(name)} deck · Ring ${arg} · ${xs.length} cards</p>` + li(xs);
  }
  if (kind === 'heartwood') return `<p class="muted">${(C.heartwood || []).length} questions</p>` + li(C.heartwood);
  if (kind === 'harvest') return (C.values || []).map((v, i) => `<div class="box"><h3 style="margin-top:0">${pic('value:' + ('ZERAOS'.includes(v.letter) && v.letter ? 'ZERAOS'.indexOf(v.letter) : i))} ${esc(v.name)}</h3>
      <p><b>${esc(harvestLine(C.harvest, v.name))}</b></p><p class="muted"><i>${esc(v.tagline)}</i></p></div>`).join('');
  if (kind === 'treasures') return (C.treasures || []).map(t => `<div class="box"><h3 style="margin-top:0">${pic('treasure:' + String(t.id || '').replace(/[^a-z]/g, ''))} ${esc(t.name)}</h3>
      <p><i>${esc(t.meaning)}</i></p><p><b>${esc(t.question)}</b></p></div>`).join('');
  if (kind === 'roles') return `<div class="tablewrap"><table><tr><th>Type</th><th>Role</th><th>What it does</th></tr>` +
    (C.roles || []).map(r => `<tr><td>${esc(r.type)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.text)}</td></tr>`).join('') + `</table></div>`;
  return '';
}
function safeDeck(deck) {
  try { return deckHTML(deck); } catch (err) { return `<p class="empty">Couldn't show these cards.</p>`; }
}
function fillDecks() {
  main.querySelectorAll('[data-deck]').forEach(el => {
    el.innerHTML = CARDS ? safeDeck(el.dataset.deck)
      : CARDS === false ? `<p class="empty">Couldn't load the cards. Open the wiki from the game's own address (for example https://heartwood.zera.edu.my/wiki.html).</p>`
      : `<p class="muted">Loading the cards…</p>`;
  });
}
function loadCards() {
  let p;
  try { p = fetch('/api/cards'); } catch (err) { p = Promise.reject(err); }
  p.then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))).then(d => {
    CARDS = d && typeof d === 'object' ? d : false;
    if (!CARDS) return;
    // Let the index search find any question.
    for (const e of W) {
      const m = e.body.match(/data-deck="([^"]+)"/);
      if (m) e.extra = plain(safeDeck(m[1]));
    }
  }).catch(() => { CARDS = false; }).finally(route);
}

function renderIndex(filter) {
  const f = (filter || '').trim().toLowerCase();
  const match = e => !f || (e.title + ' ' + e.short + ' ' + plain(e.body) + ' ' + (e.extra || '')).toLowerCase().includes(f);
  let html = f ? '' : `<div class="hero"><div class="seed">${pic('icon:book')}</div><h1>Heartwood Wiki</h1>
    <p>Every term in the game, one page each. Tap a term to read it; links inside each page lead to the next. For the whole game in one page, see <a href="howto.html">How to play</a>.</p></div>`;
  let any = false;
  for (const [cat, name] of CATS) {
    const items = W.filter(e => e.cat === cat && match(e));
    if (!items.length) continue;
    any = true;
    html += `<section class="cat"><h2>${name}</h2><div class="tiles">${items.map(tile).join('')}</div></section>`;
  }
  if (!any) html += `<p class="empty">Nothing matches "${esc(filter)}".</p>`;
  main.innerHTML = html;
  ART.hydrate(main);
}

function renderEntry(e) {
  const cat = CATS.find(c => c[0] === e.cat)[1];
  const same = W.filter(x => x.cat === e.cat);
  const i = same.indexOf(e);
  const prev = same[i - 1], next = same[i + 1];
  // "Mentioned here" chips: every page this one links to, in order, without repeats.
  const refs = [...new Set([...e.body.matchAll(/\[\[([a-z0-9-]+)/g)].map(m => m[1]))].filter(id => id !== e.id && byId[id]);
  // "Linked from": pages that link to this one.
  const back = W.filter(x => x !== e && new RegExp('\\[\\[' + e.id + '[\\]|]').test(x.body)).map(x => x.id).filter(id => !refs.includes(id));
  const chips = ids => ids.map(id => `<a href="#${id}">${pic(byId[id].icon)} ${esc(byId[id].title)}</a>`).join('');
  main.innerHTML = `
    <p class="crumbs"><a href="#">Wiki</a> › ${cat}</p>
    <article>
      <div class="head"><span class="ic">${pic(e.icon)}</span><div><h1>${esc(e.title)}</h1><span class="tag">${cat}</span></div></div>
      <p class="summary">${esc(e.short)}</p>
      ${links(e.body)}
      ${refs.length ? `<div class="see"><h3>Mentioned here</h3><div class="chips">${chips(refs)}</div></div>` : ''}
      ${back.length ? `<div class="see"><h3>Linked from</h3><div class="chips">${chips(back)}</div></div>` : ''}
      <div class="pager">
        <span>${prev ? `<a href="#${prev.id}">← ${pic(prev.icon)} ${esc(prev.title)}</a>` : ''}</span>
        <span>${next ? `<a href="#${next.id}">${pic(next.icon)} ${esc(next.title)} →</a>` : ''}</span>
      </div>
    </article>`;
  fillDecks();
  ART.hydrate(main);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const e = byId[id];
  if (e) {
    q.value = '';
    document.title = e.title + ' · Heartwood Wiki';
    renderEntry(e);
    window.scrollTo(0, 0);
  } else {
    document.title = 'Heartwood Wiki';
    renderIndex(q.value);
  }
}

q.addEventListener('input', () => {
  if (location.hash.length > 1) history.pushState(null, '', location.pathname);
  renderIndex(q.value);
});
window.addEventListener('hashchange', route);
ART.hydrate();
route();
loadCards();
</script>
</body>
</html>
