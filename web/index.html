<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartwood</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="panel" style="text-align:center">
    <div style="font-size:3rem">🌰</div>
    <h1>HEARTWOOD</h1>
    <p class="muted">A ZERA leadership expedition, from the seed to the forest.</p>
    <p><a href="howto.html">How to play</a> · <a href="wiki.html">Wiki</a></p>
  </div>
  <div class="panel">
    <h2>Join a game</h2>
    <label for="code">Game code</label>
    <input id="code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase">
    <p><button id="join">Join on this device</button></p>
  </div>
  <div class="panel">
    <h2>Host a game</h2>
    <p class="muted">Opens the board for the big screen. You run it as the Keeper.</p>
    <button id="create" class="ghost">Create a new game</button>
  </div>
</div>
<script src="common.js"></script>
<script>
document.getElementById('join').onclick = () => {
  const c = document.getElementById('code').value.trim().toUpperCase();
  if (c.length === 4) location.href = `play.html?g=${c}`;
  else HW.toast('Enter the 4-letter code from the board');
};
document.getElementById('create').onclick = async () => {
  try {
    const r = await HW.post('/api/games');
    localStorage.setItem('hw-host-' + r.code, r.host);
    location.href = `board.html?g=${r.code}`;
  } catch (e) { HW.toast(e.message); }
};
</script>
</body>
</html>
