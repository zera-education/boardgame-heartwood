# @SITE@ -> heartwood Go service (systemd unit `heartwood`, @ADDR@). Written by deploy/install.sh.
# Cloudflare proxies the domain; the *.zera.edu.my Origin cert covers it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @SITE@;

    ssl_certificate     /etc/nginx/ssl/zera.edu.my.pem;
    ssl_certificate_key /etc/nginx/ssl/zera.edu.my.key;

    # Story recordings come up as one upload per share (recording.go allows 25 MB; nginx's default is 1 MB).
    client_max_body_size 26m;

    location / {
        proxy_pass http://@ADDR@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Live updates are WebSockets; the app sends a heartbeat every 20 s.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name @SITE@;
    return 301 https://$host$request_uri;
}
